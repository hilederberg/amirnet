{id:'rd_he12',lvl:3,lang:'he',title:'שפות נכחדות',
 text:'לפי הערכות הבלשנים, מתוך כשבעת אלפים השפות המדוברות כיום בעולם, כמחציתן עלולות להיעלם עד סוף המאה. רובן מדוברות בפי קהילות קטנות, ודוברים צעירים רבים עוברים לשפה דומיננטית, המבטיחה להם השכלה ופרנסה. כשהדובר הוותיק האחרון של שפה כזו מת, היא חדלה להתקיים כשפה חיה.\n\nמדוע שיהיה בכך עניין למי שאינו דובר אותן? טענה אחת היא מדעית: כל שפה היא מעין ניסוי טבעי ביכולת האנושית ליצור מבנים לשוניים, ושפות נדירות מגלות לעיתים תופעות דקדוקיות שלא שוערו קודם לכן. כך, כמה תאוריות על "כללים אוניברסליים" של השפה נאלצו להשתנות כשנמצאו שפות שאינן מצייתות להם. טענה שנייה היא תרבותית: בשפה טמונים ידע מקומי, מסורות וסיפורים, ואלה עלולים לאבוד עמה.\n\nמבקרים אינם כופרים בערכן של שפות אלה, אך הם מזהירים מפני רומנטיזציה. לדבריהם, ההחלטה לנטוש שפה היא לעיתים קרובות החלטה מושכלת של הדוברים עצמם, המבקשים לשפר את מצבם, ואין זה ראוי שאנשים מבחוץ יכריעו בשבילם. יתרה מזאת, תיעוד שפה, כלומר הקלטתה וכתיבת מילון ודקדוק שלה, אינו זהה להחייאתה: שפה מתועדת היטב יכולה בהחלט לחדול מלהיות מדוברת.\n\nנראה שהמחלוקת מצטמצמת כשמבחינים בין שתי מטרות. תיעוד נועד לשמר את הידע על השפה לטובת המחקר והדורות הבאים, ואפשר לבצעו גם בלי הסכמה רחבה של הקהילה לחזור לדבר בה. החייאה, לעומת זאת, תלויה ברצונם של הדוברים, ומאמצים לכפותה מבחוץ נדונים בדרך כלל לכישלון.',
 qs:[
 {id:'rd_he12_1',q:'מהי, לפי הקטע, הסיבה העיקרית להיעלמותן של שפות?',o:['מעבר הצעירים לשפה דומיננטית','אסונות טבע שפגעו בקהילות הקטנות','איסור חוקי לדבר בשפות המיעוט','קשיים בכתיבתן ובהוראתן בבתי ספר'],a:0,e:'הסיבה מופיעה בפסקה הראשונה: המעבר לשפה שמבטיחה השכלה ופרנסה.'},
 {id:'rd_he12_2',q:'מה תפקידה של הדוגמה על "כללים אוניברסליים" בפסקה השנייה?',o:['להמחיש את הטענה המדעית','להוכיח שכל השפות בעולם דומות','להראות שתיעוד שפות הוא מיותר','לבסס את הטענה התרבותית'],a:0,e:'הדוגמה באה מיד אחרי "טענה אחת היא מדעית" ומדגימה אותה.'},

 {id:'rd_he12_4',q:'מה ניתן להסיק מן הקטע על שפה שתועדה במלואה?',o:['היא עשויה לחדול מלהיות מדוברת','היא תשרוד בהכרח לאורך דורות','היא תחזור בהכרח להיות מדוברת','אין בה עוד כל עניין מחקרי'],a:0,e:'"שפה מתועדת היטב יכולה בהחלט לחדול מלהיות מדוברת".'},
 {id:'rd_he12_5',q:'לפי הפסקה האחרונה, במה תלויה הצלחת החייאתה של שפה?',o:['ברצונם של הדוברים עצמם','בתיעוד מלא ומדויק של השפה','במימון חיצוני ממוסדות מחקר','בהסכמתם של הבלשנים'],a:0,e:'"החייאה... תלויה ברצונם של הדוברים".'},

{id:'rd_en8',lvl:3,lang:'en',title:'The paradox of thrift',
 text:'In ordinary life, saving money is considered a virtue: a family that spends less than it earns builds security for the future. Yet some economists have argued that what is wise for a single household can be harmful when everyone does it at once. This idea, often called the "paradox of thrift," rests on a simple observation: one person\'s spending is another person\'s income. If, during an economic downturn, households throughout a country simultaneously cut their spending in order to save, businesses sell less, lay off workers, and pay out less in wages. Incomes then fall, and households may end up saving no more than before, or even less, while the economy as a whole has shrunk.\n\nCritics of the idea do not deny the arithmetic, but they question its practical importance. They point out that savings are not simply hidden under mattresses; deposited in banks, they are lent to businesses that use them to invest in new equipment and buildings, which in turn creates jobs. In the long run, they argue, higher savings lead to more investment and faster growth.\n\nMuch of the disagreement turns on timing. In a healthy economy, businesses are eager to borrow and invest, so increased saving is quickly put to use. In a deep recession, however, businesses may be reluctant to invest no matter how much money is available, because they doubt that customers will buy their products. Under such conditions, the warnings of the paradox of thrift appear far more relevant.',
 qs:[
 {id:'rd_en8_1',q:'According to the paradox of thrift, why might widespread saving reduce incomes?',o:['Less spending means lower incomes for others.','Banks refuse to accept any new deposits.','Saving causes prices to rise very quickly.','Households hide their money instead of spending it.'],a:0,e:'הרעיון מבוסס על one person\'s spending is another person\'s income.'},
 {id:'rd_en8_2',q:'The critics mentioned in the second paragraph',o:['accept its logic but doubt its importance','reject the arithmetic of the argument','believe that saving is always harmful','think that banks should not lend money'],a:0,e:'do not deny the arithmetic, but they question its practical importance.'},
 {id:'rd_en8_3',q:'According to the critics, how do savings help the economy?',o:['They are lent to firms that invest.','They raise prices for consumers.','They reduce the need for banks.','They let households stop working.'],a:0,e:'החסכונות מופקדים בבנקים, ומשם מולווים לעסקים שמשקיעים ויוצרים מקומות עבודה.'},
 {id:'rd_en8_4',q:'It can be inferred that the paradox of thrift is most relevant when',o:['businesses will not invest despite available money','the economy is growing quickly and steadily','interest rates are high and still rising fast','households earn far more than they spend'],a:0,e:'הפסקה האחרונה: במיתון עמוק עסקים לא משקיעים, ואז האזהרות רלוונטיות יותר.'},
 {id:'rd_en8_5',q:'The word "simultaneously" in the first paragraph is closest in meaning to',o:['at the same time','little by little','with reluctance','in secret'],a:0,e:'simultaneously פירושו בו זמנית, וזו נקודת המפתח של הפרדוקס.'},
 {id:'rd_en8_6',q:'What is the main purpose of the last paragraph?',o:['To show the dispute depends on conditions','To prove that the critics are simply wrong','To describe in detail how banks work','To argue that saving should be banned'],a:0,e:'Much of the disagreement turns on timing: הפסקה מראה שהתשובה תלויה בתנאים.'}
 ]}
);

{id:'an80',lvl:3,q:'להמריץ : להתאמץ',o:['להרגיע : להירגע','להתאמץ : להמריץ','לשכנע : לסרב','להזהיר : להסתכן'],a:0,e:'היחס: גרימה. מי שממריץ גורם לאחר להתאמץ, ומי שמרגיע גורם לאחר להירגע. אזהרה נועדה דווקא למנוע סיכון.'},
{id:'an81',lvl:3,q:'התחנן : רחמים',o:['הסית : מרי','שיבח : כעס','איים : אהבה','התנצל : עונש'],a:0,e:'היחס: פעולה דיבורית והתגובה שהיא מבקשת לעורר. המתחנן מבקש לעורר רחמים, והמסית מבקש לעורר מרי.'},
{id:'an82',lvl:3,q:'גמע : שתה',o:['טרף : אכל','אכל : טרף','לגם : שתה','הריח : טעם'],a:0,e:'היחס: הפועל הראשון הוא צורה עזה ונמרצת של השני. גמע הוא שתה בלגימות גדולות, וטרף הוא אכל בלהיטות. לגם הוא דווקא שתה מעט, ו"אכל : טרף" הפוך.'},
{id:'an83',lvl:3,q:'אורך : סנטימטרים',o:['נפח : ליטרים','חום : מדחום','זמן : שעון','מהירות : מכונית'],a:0,e:'היחס: גודל ויחידת המידה שלו. מדחום ושעון הם מכשירים, לא יחידות.'},
{id:'an84',lvl:3,q:'שקיעה : זריחה',o:['אחרית : ראשית','צהריים : ערב','שבוע : יום','לילה : חושך'],a:0,e:'היחס: הסוף של רצף מול ההתחלה שלו. שקיעה היא סוף היום וזריחה תחילתו, כמו אחרית וראשית.'},
{id:'an85',lvl:3,q:'טהור : זיהום',o:['שלם : פגם','מלא : כלי','שקט : שתיקה','חכם : ידע'],a:0,e:'היחס: תכונה שמשמעותה היעדר הדבר השני. טהור הוא נקי מזיהום, ושלם הוא נקי מפגם. לחכם דווקא יש ידע.'},
{id:'an86',lvl:3,q:'סופר : רומן',o:['נגר : רהיט','רופא : חולה','טייס : טיסה','נהג : דרך'],a:0,e:'היחס: יוצר והמוצר שהוא מייצר. הסופר כותב רומן והנגר בונה רהיט.'},
{id:'an87',lvl:3,q:'הלך רכיל : רכלן',o:['פיזר את כספו : בזבזן','משך בכתפיו : נלהב','שמר על לשונו : פטפטן','קם עם שחר : עצלן'],a:0,e:'היחס: ביטוי שמתאר פעולה, והאדם שמאופיין בה. מי שהולך רכיל הוא רכלן, ומי שמפזר את כספו הוא בזבזן. בשאר האפשרויות הביטוי סותר את התואר.'},
{id:'an88',lvl:3,q:'מלמל : דיבר',o:['קשקש : כתב','כתב : קשקש','צעק : דיבר','קרא : כתב'],a:0,e:'היחס: ביצוע לא ברור ולא מוקפד של הפעולה. מלמול הוא דיבור לא ברור, וקשקוש הוא כתיבה לא מוקפדת. צעקה היא דיבור חזק, לא מרושל.'}
);

HI.push(
{id:'hi17',lvl:3,q:'במחקר נמצא שתלמידים שישבו בשורות הקדמיות בכיתה קיבלו ציונים גבוהים יותר מתלמידים שישבו בשורות האחוריות. עוד נמצא שתלמידים בעלי מוטיבציה גבוהה נוטים לבחור לשבת בשורות הקדמיות. מה נכון לגבי הקשר בין שני הממצאים?',o:['הממצא השני מציע הסבר חלופי לראשון','הממצא השני מוכיח שמקום הישיבה משפיע','הממצא הראשון סותר את הממצא השני','הממצא השני הוא דוגמה לממצא הראשון'],a:0,e:'ייתכן שהמוטיבציה היא שגורמת גם לבחירת המקום וגם לציונים. כך הממצא השני מסביר את הראשון בלי שמקום הישיבה ישפיע כלל.'},
{id:'hi18',lvl:3,q:'חוקרים מצאו שצמחים הגדלים ליד כבישים סואנים מפרחים מוקדם יותר מצמחים מאותו מין הגדלים הרחק מהם. לדבריהם, הסיבה היא החום שנפלט מכלי הרכב ומהאספלט, שכן צמחים אלה מתחילים לפרוח כשהטמפרטורה עולה על סף מסוים. איזו מהטענות הבאות אינה עולה מהפסקה?',o:['הרעש ליד הכבישים מאיץ את הפריחה','ליד כבישים סואנים הטמפרטורה גבוהה יותר','מועד הפריחה של הצמחים תלוי בטמפרטורה','החום נפלט גם מהאספלט ולא רק מהמכוניות'],a:0,e:'הפסקה מייחסת את ההשפעה לחום, לא לרעש. בשאלות "אינה עולה" מחפשים את מה שלא נאמר ולא נובע.'},
{id:'hi19',lvl:3,q:'רבים מופתעים לגלות שחלק ניכר מן המים שבאגם מלוח מגיע מנהרות של מים מתוקים. אולם ההסבר פשוט: מן האגם אין יציאה, והמים מתאדים ממנו, ואילו המלחים שנשאו הנהרות נשארים ומצטברים בו. לפי הפסקה, מדוע האגם מלוח אף שמזינים אותו נהרות מתוקים?',o:['המים מתאדים והמלחים נשארים ומצטברים','הנהרות מלוחים הרבה יותר ממה שנדמה','מי ים חודרים לאגם דרך תעלות תת־קרקעיות','המים המתוקים אינם מגיעים בפועל לאגם'],a:0,e:'גם מים "מתוקים" נושאים מעט מלחים. כשהמים מתאדים והמלח נשאר, הוא מצטבר.'},
{id:'hi20',lvl:3,q:'מונחים רבים ממשיכים לשמש אותנו גם אחרי שהטכנולוגיה שהולידה אותם נעלמה. כך, למשל, אנו ממשיכים "לחייג" בטלפון אף שאין בו עוד חוגה. איזו מהדוגמאות הבאות מתאימה ביותר להחליף את הדוגמה שבפסקה?',o:['אנו קוראים לסרט "סרט" אף שאין בו עוד פילם','אנו מכנים טלפון נייד "טלפון חכם" כי הוא מבצע הרבה','אנו מכנים מכונית חשמלית "מכונית" אף שאינה צורכת דלק','אנו אומרים "לגלוש" באינטרנט אף שאין בו גלים'],a:0,e:'הדוגמה צריכה לשמר את אותו מנגנון: שם שנשאר מטכנולוגיה שנעלמה. "מכונית" אינה קשורה לדלק, ו"לגלוש" הוא דימוי שלא היה מעולם טכנולוגיה ממשית.'},
{id:'hi21',lvl:3,q:'כשהציעו ליואב, בן החמישים, להתחיל לחסוך לפנסיה, השיב: "זה כמו לשתול עץ ולצפות לשבת בצילו עוד באותו קיץ." מה מתאים ביותר להיות כוונתו?',o:['חיסכון מניב פרי רק אחרי זמן רב, ובגילו מאוחר מדי','חיסכון לפנסיה הוא בזבוז כסף בכל גיל שהוא','עדיף להשקיע בנדל"ן מאשר לחסוך בקרן פנסיה','הוא מעדיף ליהנות מהכסף כבר בקיץ הקרוב'],a:0,e:'עץ מעניק צל רק אחרי שנים. יואב משווה לזה חיסכון שמתחיל מאוחר: הוא לא יספיק לצמוח.'},
{id:'hi22',lvl:3,q:'לפי תקנון של ספרייה, אפשר לשאול ספר לשבועיים. אם הספר לא הוזמן על ידי קורא אחר, מותר להאריך את ההשאלה פעם אחת בלבד, בשבועיים נוספים. קורא שמחזיר ספר באיחור ישלם קנס, אלא אם הספרנית קבעה שהאיחור נבע מנסיבות מוצדקות. באיזה מהמקרים הבאים הייתה בוודאות הפרה של התקנון?',o:['רונית האריכה פעמיים השאלה של ספר שלא הוזמן','דני החזיר ספר באיחור ולא שילם קנס כלל','מיכל החזיקה ספר שלושה שבועות ולא שילמה קנס','לאבי לא התירו להאריך את השאלת הספר'],a:0,e:'הארכה מותרת פעם אחת בלבד, בלי קשר לנסיבות, ולכן זו הפרה ודאית. דני: ייתכן שהספרנית קבעה נסיבות מוצדקות. מיכל: ייתכן שהאריכה. אבי: ייתכן שהספר הוזמן.'},
{id:'hi23',lvl:3,q:'אלון, בני וגיל בוחרים יחד מסעדה מבין שלוש: איטלקית, סינית ומקסיקנית. אלון: "לא אלך למקסיקנית." בני: "אני רוצה סינית." גיל: "אהיה מרוצה אם נלך לאיטלקית, או אם בני יהיה מרוצה." הם הלכו לאחת המסעדות, ורק אחד מהם לא קיבל את מבוקשו. מה מהבאים נכון?',o:['הם הלכו למסעדה האיטלקית, ובני לא קיבל את מבוקשו','הם הלכו למסעדה הסינית, ואלון לא קיבל את מבוקשו','הם הלכו למסעדה המקסיקנית, וגיל לא קיבל את מבוקשו','הם הלכו למסעדה האיטלקית, וגיל לא קיבל את מבוקשו'],a:0,e:'סינית: כולם מרוצים (גיל מרוצה כי בני מרוצה). מקסיקנית: שלושתם אינם מרוצים. איטלקית: רק בני אינו מרוצה, ולכן זו התשובה.'},
{id:'hi24',lvl:3,q:'סופר אמר בראיון: "אני כותב כדי לגלות מה אני חושב." איזה מהמשפטים הבאים מתאים ביותר להביע את כוונתו?',o:['הכתיבה היא דרך לגבש את המחשבות','הוא כותב רק על נושאים שכבר חשב עליהם','הקוראים מגלים את מחשבותיו רק דרך ספריו','הוא אינו מסוגל לכתוב בלי תוכנית מוקדמת'],a:0,e:'המחשבה נוצרת תוך כדי הכתיבה, ולא קודמת לה. שתי האפשרויות האחרונות הפוכות לכך.'},
{id:'hi25',lvl:3,q:'רוני: "רוב האנשים שאני מכיר מעדיפים לקרוא ספרים דיגיטליים." תמר: "זה מוכיח שהספר המודפס ייעלם בקרוב." על איזו הנחה נשענת מסקנתה של תמר?',o:['שמכריו של רוני מייצגים את הציבור כולו','שספרים דיגיטליים זולים יותר ממודפסים','שרוני עצמו אינו קורא ספרים מודפסים כלל','שספרים מודפסים איכותיים יותר מדיגיטליים'],a:0,e:'תמר מכלילה ממדגם מצומצם לכלל הציבור, וגם מניחה שההעדפה תימשך לאורך זמן.'},
{id:'hi26',lvl:3,q:'חוקר מצא שעובדים שעבדו מהבית הספיקו יותר משימות מעובדים שעבדו במשרד, ושיער שהעבודה מהבית היא שהגבירה את התפוקה. איזו מן העובדות הבאות מחזקת ביותר את השערתו?',o:['תפוקת אותם עובדים עלתה כשעברו לעבוד מהבית','העובדים מהבית נבחרו מבין העובדים המצטיינים','לעובדים מהבית ניתנו משימות קלות יותר מלאחרים','העובדים במשרד נדרשו לנכוח בישיבות רבות'],a:0,e:'השוואה של אותם אנשים לפני ואחרי מנטרלת הבדלים ביניהם. שלוש האפשרויות האחרות מציעות הסברים חלופיים, ולכן מחלישות.'},
{id:'hi27',lvl:3,q:'בעיר מסוימת נמצא ש־80% מרוכבי האופנועים שנפגעו בתאונות לא חבשו קסדה. מכאן הסיק כתב שרוב רוכבי האופנועים בעיר אינם חובשים קסדה. מהו הפגם בהסקה?',o:['הנתון מתייחס רק לרוכבים שנפגעו','80% אינם רוב מתוך כלל הרוכבים','קסדה אינה מגנה כלל מפני פציעה','הנתון אינו מבחין בין צעירים למבוגרים'],a:0,e:'ייתכן שרוב הרוכבים חובשים קסדה, ודווקא מי שלא חובש נפגע יותר ולכן מופיע בנתונים. זו הסקה ממדגם מוטה.'},
{id:'hi28',lvl:3,q:'"מאחר שבעשור האחרון גדל מספר בעלי התואר האקדמי, וגם שיעור האבטלה עלה, ברור שהשכלה גבוהה גורמת לאבטלה." איזו מהטענות הבאות היא הביקורת המתאימה ביותר על הטיעון?',o:['חפיפה בזמן אינה מוכיחה קשר סיבתי','מספר בעלי התואר לא גדל באמת בעשור','אבטלה היא תופעה זמנית שחולפת מעצמה','השכלה גבוהה מועילה לחברה ולכלכלה'],a:0,e:'הטיעון מסיק סיבתיות מחפיפה בזמן. ייתכן ששתי המגמות נובעות מגורם שלישי או שאינן קשורות.'}
);

HSC.push(
{id:'hs57',lvl:3,q:'בעקבות _____ של התוכנית הניסיונית, החליטה העירייה _____ אותה לכל השכונות. היא נימקה זאת בכך שהתוכנית, _____ עלותה גבוהה, _____ את מספר התאונות בשכונות שבהן הופעלה.',o:['ההצלחה / להרחיב / אף ש / הפחיתה במידה ניכרת','הכישלון / להרחיב / משום ש / הפחיתה מעט','ההצלחה / לבטל / אף ש / הגדילה','הכישלון / לבטל / משום ש / הפחיתה במידה ניכרת'],a:0,e:'הרחבה לכל השכונות נובעת מהצלחה. "אף ש" מציג את העלות כוויתור, והנימוק הוא ירידה ניכרת בתאונות.'},
{id:'hs58',lvl:3,q:'השרים _____ בשאלת התקציב: שר האוצר סבור כי _____ להגדיל את התקציב לחינוך, ואילו שר החינוך _____ שיש להגדילו בהרבה, _____ על חשבון תחומים אחרים.',o:['חלוקים / אין מקום / גורס / ואפילו','תמימי דעים / אין מקום / גורס / ואפילו','חלוקים / חובה / מסכים / אך לא','חלוקים / אין מקום / מתנגד / ואפילו'],a:0,e:'"ואילו" מציג עמדות מנוגדות, ולכן השרים חלוקים. "גורס ש" תקין דקדוקית, ו"מתנגד שיש" אינו תקין.'},
{id:'hs59',lvl:3,q:'_____ שהשיטה החדשה מבטיחה דיוק רב, החוקרים _____ לאמצה, _____ היא מחייבת ציוד יקר _____ אינו מצוי ברוב המעבדות.',o:['אף / מהססים / שכן / ש','מאחר / ממהרים / שכן / ש','אף / ממהרים / אף ש / ו','מאחר / מהססים / אך / ש'],a:0,e:'דיוק רב הוא יתרון, ולכן ההיסוס מוצג כוויתור ("אף ש"), והנימוק לו בא ב"שכן".'},

function motion(){
  const enter = ANIM; ANIM = false;
  const view = session ? session.kind + (session.done ? ':done' : '') : 'home';
  const sameView = view === LAST_VIEW; LAST_VIEW = view;
  // progress bars that should glide from their previous value
  root.querySelectorAll('[data-w]').forEach(el => { const w = el.getAttribute('data-w'); requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = w; })); });
  if(!enter) return;
  LAST_ENTER = Date.now();
  if(!RM.matches){
    const items = [];
    for(const c of root.children){
      const skip = el => el.classList.contains('tabbar') || (sameView && (el.classList.contains('sess-top') || el.classList.contains('top')));
      if(skip(c)) continue;
      if(getComputedStyle(c).display === 'contents'){ for(const g of c.children) if(!skip(g)) items.push(g); }
      else items.push(c);
    }
    const live = items.filter(el => !el.hidden);
    const clear = el => { el.classList.remove('in'); el.style.removeProperty('--i'); };
    live.forEach((el, i) => {
      el.style.setProperty('--i', Math.min(i, 9));
      el.classList.add('in');
      el.addEventListener('animationend', function done(e){ if(e.target !== el) return; clear(el); el.removeEventListener('animationend', done); });
    });
    setTimeout(() => live.forEach(clear), 2000);
  }
  root.querySelectorAll('[data-count]').forEach(countUp);
}
function countUp(el){
  const to = +el.getAttribute('data-count'), suf = el.getAttribute('data-suf') || '';

  const t0 = performance.now(), dur = Math.min(1400, 700 + to * 12);
  const step = now => { const k = Math.min(1, (now - t0) / dur); const e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e) + suf; if(k < 1) requestAnimationFrame(step); };
  el.textContent = '0' + suf; requestAnimationFrame(step);
}

function bankQs(cfg){if(cfg.sim || cfg.daily || cfg.err) return []; return cfg.reading ? cfg.bank.reduce((a,p) => a.concat(p.qs), []) : cfg.bank;}
let HARD = false;
try{ HARD = localStorage.getItem('amirnet-hard') === '1'; }catch(e){}
function wantHard(qs){
  if(HARD) return true;
  let seen = 0, ok = 0;
  for(const x of qs){ const s = S.q[x.id]; if(s){ seen += s[0]; ok += s[1]; } }
  return seen >= 8 && ok / seen >= 0.7;
}
function pickQuestions(bank, n){
  const hard = wantHard(bank);
  const hardCount = bank.filter(x => x.lvl === 3).length;
  if(HARD && hardCount >= n) bank = bank.filter(x => x.lvl === 3);
  const items = bank.map(x => {
    const st = S.q[x.id];
    let p; if(!st) p = 0; else if(!st[2]) p = 1; else p = 2 + st[0];
    return {x, p: p + Math.random()*0.9 + (hard && x.lvl !== 3 ? 0.8 : 0)};
  });
  items.sort((a,b) => a.p - b.p);
  return items.slice(0, n).map(i => i.x);
}
const POOLS = () => [
  ['sc',SC,'en'],['rs',RS,'en'],['hv',HV,'he'],['an',AN,'he'],['hs',HSC,'he'],['hi',HI,'he'],['lg',LG,'he'],
  ['qw',QW,'he',1],['qa',QA,'he',1],['qn',QN,'he',1],['qg',QG,'he',1],['qd',QD,'he',1]];
function mkItem(q, k, lang, math){
  const o = q.o.map((t,i) => ({t, ok: i === q.a}));
  return {q, sec: QUIZ[k].label + (lang === 'en' ? ' (אנגלית)' : ''), lang, math: !!math, passage: null, opts: math ? o : shuffle(o)};
}
function wrongList(){
  const out = [];
  for(const [k, bank, lang, math] of POOLS()) for(const q of bank){ const st = S.q[q.id]; if(st && st[0] > 0 && !st[2]) out.push({q, k, lang, math, t: st[3] || 0}); }
  return out.sort((a,b) => a.t - b.t);
}
function dailyItems(){
  const pools = POOLS().map(([k, bank, lang, math]) => {
    let seen = 0, ok = 0; for(const q of bank){ const s = S.q[q.id]; if(s){ seen += s[0]; ok += s[1]; } }
    return {k, bank, lang, math, acc: seen ? ok/seen : 0.55, r: Math.random()};
  }).sort((a,b) => (a.acc - b.acc) || (a.r - b.r));
  const items = [], used = new Set();
  for(const w of wrongList().slice(0, 2)){ items.push(mkItem(w.q, w.k, w.lang, w.math)); used.add(w.q.id); }
  for(const pl of pools.slice(0, 3)){
    for(const q of pickQuestions(pl.bank.filter(q => !used.has(q.id)), 2)){ items.push(mkItem(q, pl.k, pl.lang, pl.math)); used.add(q.id); }
  }
  let i = 3;
  while(items.length < 8 && i < pools.length){ const pl = pools[i++]; const q = pickQuestions(pl.bank.filter(q => !used.has(q.id)), 1)[0]; if(q){ items.push(mkItem(q, pl.k, pl.lang, pl.math)); used.add(q.id); } }
  return shuffle(items);
}
function startDaily(){
  const st = wordStats(); const l = logToday();
  const newAvail = Math.min(Math.max(0, NEW_PER_DAY - l[2]), WORDS.length - st.learned);
  if(st.due + newAvail > 0){ startWords(false); if(session) session.thenDaily = true; }
  else startQuiz('daily');
}
function startQuiz(kind){
  const cfg = QUIZ[kind];
  let qs, passage = null;
  if(cfg.daily || cfg.err){
    const items = cfg.daily ? dailyItems() : wrongList().slice(0, 10).map(w => mkItem(w.q, w.k, w.lang, w.math));
    if(!items.length) return;
    go({kind, cfg, passage: null, items, i: 0, picked: null, answers: [], start: Date.now(), done: false, end: 0});
    timerId = setInterval(tick, 1000);
    return;
  }
  if(cfg.qsim){
    const mq = (q, sec) => ({q, sec, passage: null, opts: q.o.map((t,i) => ({t, ok: i === q.a}))});
    const qd = pickQuestions(QD, 2);
    let items = pickQuestions(QW, 6).map(q => mq(q,'בעיות מילוליות')).concat(
      pickQuestions(QA, 5).map(q => mq(q,'אלגברה')),
      pickQuestions(QN, 4).map(q => mq(q,'מספרים והסתברות')),
      pickQuestions(QG, 3).map(q => mq(q,'גאומטריה')),
      qd.map(q => mq(q,'טבלאות')));
    go({kind, cfg, passage: null, items, i: 0, picked: null, answers: [], start: Date.now(), done: false, end: 0});
    timerId = setInterval(tick, 1000);
    return;
  }
  if(cfg.sim){
    const mk = (q, sec, p) => ({q, sec, passage: p || null, opts: shuffle(q.o.map((t,i) => ({t, ok: i === q.a})))});
    const multi = HSC.filter(q => q.q.split('_____').length > 2);
    const six = READ_HE.filter(p => p.qs.length >= 6);

  const run = session.run, c = pxCh(run.ch);
  if(run.score == null) return pxKeyView();
  const pct = Math.round(run.score / run.n * 100);
  const wrong = [], flagged = [];
  for(let i = 0; i < run.n; i++){ if(run.ans[i] !== +run.key[i]) wrong.push(i); if(run.flag[i]) flagged.push(i); }
  const cell = i => h('div',{class:'pxr' + (run.ans[i] === +run.key[i] ? ' ok' : ' bad')},
    h('span',{class:'pxn num',text:String(i+1)}),
    run.ans[i] === +run.key[i] ? h('span',{class:'pxv num'}, ico('check', 16), String(run.ans[i])) : h('span',{class:'pxv num'}, h('s',{text: run.ans[i] ? String(run.ans[i]) : '—'}), h('b',{text: run.key[i]})),
    run.flag[i] ? h('span',{class:'pxtag',text:'?'}) : null);
  return h('div',{style:'display:contents'},
    screenTop(c.t, pxTitle(run.ex), () => go({kind:'pxmenu'})),
    h('section',{class:'card rsum'},
      h('div',{class:'rmain'}, h('div',{class:'scw'}, h('div',{class:'score num','data-count':String(pct),'data-suf':'%',text: pct + '%'}), pct >= 90 ? burst() : null), h('div',{class:'rmsg',text: !wrong.length ? 'אין טעויות בפרק הזה.' : wrong.length > 6 ? wrong.length + ' שאלות לחזרה בקובץ. הן מסומנות באדום למטה.' : 'לחזור בקובץ לשאלות: ' + wrong.map(i => i+1).join(', ')})),
      flagged.length ? h('div',{class:'sub',text:'סימנת לחזרה: ' + flagged.map(i => i+1).join(', ')}) : null,
      h('div',{class:'rstats'},
        h('div',{}, h('b',{class:'num',text: run.score + '/' + run.n}), h('span',{text:'נכונות'})),
        h('div',{}, h('b',{class:'num' + (run.ms > PX_LIMIT ? ' over' : ''),text: fmtTime(run.ms)}), h('span',{text:'זמן'})),
        h('div',{}, h('b',{class:'num',text:'20:00'}), h('span',{text:'יעד'})))),
    h('section',{class:'card'}, h('h2',{text:'כל התשובות'}), h('div',{class:'pxres'}, Array.from({length:run.n}, (_, i) => cell(i)))),
    h('div',{class:'bk'},
      h('button',{class:'btn btn-primary',onclick:()=>{ PX.draft = null; pxStart(run.ex, run.ch); }},'לפתור שוב'),
      h('button',{class:'btn btn-ghost',onclick:()=>{ run.score = null; go({kind:'pxkey', run}); }},'תיקון המפתח')));
}

      h('div',{class:'hxpl num'}, h('span',{text: g.xp.toLocaleString('he-IL') + ' ניסיון'}), h('span',{text: L >= 30 ? 'רמה מקסימלית' : 'לרמה ' + (L + 1) + ': ' + b.toLocaleString('he-IL')}))),
    h('div',{class:'hstats'}, [['a','התקפה'],['d','הגנה'],['m','קסם']].map(([k, t]) => h('div',{}, h('b',{class:'num','data-count':String(st[k]),text:String(st[k])}), h('span',{text:t})))));
  const actions = h('div',{class:'hact'},
    h('button',{class:'btn btn-primary',onclick:()=>go({kind:'shop', cat:'weapons'})}, 'לחנות'),
    h('button',{class:'btn btn-ghost',onclick:()=>go({kind:'shop', cat:'mine'})}, 'הציוד שלי'));
  const bl = [];
  if(g.boost.x2) bl.push('זהב כפול בסט הבא'); if(g.boost.x15) bl.push('+50% זהב בסט הבא');
  if(g.boost.retry) bl.push('ניסיון נוסף לטעות הראשונה בסט הבא'); if(g.boost.timer3) bl.push('+3 דקות בסימולציה הבאה');
  if(g.boost.x3past) bl.push('זהב משולש בפרק הבא ממבחן עבר');
  const fh = freeHintsLeft(), hp = hintPotions();
  if(fh) bl.push(fh + ' רמזים חינם היום'); if(hp) bl.push(hp + ' שיקויי ראייה רחוקה לרמזים');
  const boosts = bl.length ? h('section',{class:'card'}, h('h2',{text:'פעיל עכשיו'}), h('ul',{class:'blist'}, bl.map(t => h('li',{text:t})))) : null;
  const earnCard = h('section',{class:'card'}, h('h2',{text:'איך מרוויחים זהב'}),
    h('div',{class:'earn'}, G.EARN.map(([t, v]) => h('div',{class:'erow'}, h('span',{text:t}), h('b',{class:'num',text:v})))),
    h('div',{class:'sub',text:'כל זהב שמרוויחים נספר גם כניסיון, וניסיון מעלה רמה. ברמות גבוהות נפתחים פריטים נדירים יותר.'}));
  return h('div',{class:'app-inner',style:'display:contents'},
    h('header',{class:'top'}, h('div',{class:'ttl'}, h('h1',{text:'הגיבור שלך'}), h('div',{class:'sub',text:'מרוויחים זהב בתרגול וקונים ציוד'})), goldChip()),
    stage, actions, boosts, earnCard, srdNote(), tabBar('hero'));
}
function srdNote(){ return h('p',{class:'foot',text:'שמות רבים מהפריטים מבוססים על System Reference Document 5.1 של Wizards of the Coast LLC, ברישיון CC-BY-4.0. הציורים, התיאורים, חיות הלוויה, הרקעים והפריטים המקוריים נוצרו במיוחד למאמן אמירנט.'}); }
function setupView(){
  const s = session; s.gender = s.gender || 'm'; s.cls = s.cls || 'fighter';
  const kit = c => c.start.map(id => GI[id]).filter(Boolean);
  const eq = {}; kit(G.CLASSES.find(c => c.k === s.cls)).forEach(it => { eq[it.slot] = it.id; });
  const seg = h('div',{class:'seg',role:'group','aria-label':'הדמות'},
    [['m','גבר'],['f','אישה']].map(([k, t]) => h('button',{type:'button','aria-pressed':String(s.gender === k),onclick:()=>{ s.gender = k; render(); }}, t)));
  const cards = h('div',{class:'clist'}, G.CLASSES.map(c => { const p = c.he.split(' / '); return h('button',{type:'button',class:'cls','aria-pressed':String(s.cls === c.k),onclick:()=>{ s.cls = c.k; render(); }},
    h('b',{text: s.gender === 'f' ? (p[1] || p[0]) : p[0]}), h('span',{text:c.focus}), h('small',{text:'מתחילים עם: ' + kit(c).map(it => it.he).join(', ')})); }));
  const start = () => { const g = GS(); g.gender = s.gender; g.cls = s.cls; kit(G.CLASSES.find(c => c.k === s.cls)).forEach(it => { g.owned[it.id] = 1; g.eq[it.slot] = it.id; }); g.gold += 100; save(); ANIM = true; render(); setTimeout(() => gToast('+100', null, 'מענק פתיחה'), 500); };
  return h('div',{class:'app-inner',style:'display:contents'},
    screenTop('בוחרים גיבור', 'פעם אחת, ואחר כך מתקדמים מתרגול'),
    h('section',{class:'card hstage'}, h('div',{class:'hsvg',html: heroSVG(eq, s.gender)})),
    seg, h('h2',{text:'מקצוע'}), cards,
    h('button',{class:'btn btn-primary',onclick:start}, 'יוצאים לדרך · 100 זהב מתנה'),
    tabBar('hero'));
}

/* ---------- shop ---------- */
const SHOP_CATS = () => [{k:'mine', he:'שלי'}].concat(G.CATS);
function shopList(cat){
  const g = GS();
  if(cat === 'mine') return G.ITEMS.filter(it => g.owned[it.id] || g.pots[it.id]);
  const c = G.CATS.find(x => x.k === cat);
  return G.ITEMS.filter(it => c && c.slots.indexOf(it.slot) >= 0).slice().sort((a, b) => a.p - b.p);
}
function itemState(it){
  const g = GS();
  if(it.slot === 'potion') return g.pots[it.id] ? 'pot' : 'buy';
  if(it.slot === 'tome') return g.owned[it.id] ? 'read' : 'buy';
  if(g.eq[it.slot] === it.id) return 'on';
  if(g.owned[it.id]) return 'own';
  return 'buy';
}
function shopView(){
  const s = session, g = GS(), L = gLevel();
  const chips = h('div',{class:'scats',role:'toolbar','aria-label':'קטגוריות'}, SHOP_CATS().map(c => h('button',{type:'button',class:'chip','aria-pressed':String(s.cat === c.k),onclick:()=>{ s.cat = c.k; s.sel = null; ANIM = true; render(); }}, c.he)));
  const list = shopList(s.cat);
  const tag = it => { const st = itemState(it), lock = G.RARITY[it.r].lvl > L;
    if(st === 'on') return h('span',{class:'itag on',text:'מצויד'});
    if(st === 'own') return h('span',{class:'itag',text:'שלך'});
    if(st === 'read') return h('span',{class:'itag',text:'נקרא'});
    if(st === 'pot') return h('span',{class:'itag',text:'×' + g.pots[it.id]});
    if(lock) return h('span',{class:'itag lock',text:'רמה ' + G.RARITY[it.r].lvl});
    return null; };
  const grid = list.length ? h('div',{class:'items'}, list.map(it => h('button',{type:'button',class:'it' + (G.RARITY[it.r].lvl > L && itemState(it) === 'buy' ? ' locked' : ''),onclick:()=>{ s.sel = it.id; render(); }},
    tag(it), h('span',{class:'ic',html: G.iconSVG(it.look, it.id)}), h('span',{class:'n',text:it.he}),
    h('span',{class:'m num'}, h('i',{class:'rd',style:'background:' + G.RARITY[it.r].color}), G.RARITY[it.r].he + ' · ' + it.p.toLocaleString('he-IL'))))) :
    h('section',{class:'card'}, h('div',{class:'sub',text:'עוד אין לך פריטים. הזהב מגיע מתרגול, ואחר כך קונים כאן.'}));
  return h('div',{class:'app-inner',style:'display:contents'},
    h('header',{class:'top'}, h('div',{class:'ttl'}, h('h1',{text:'חנות'}), h('div',{class:'sub num',text:'רמה ' + L + ' · ' + G.ITEMS.length + ' פריטים'})),
      h('div',{class:'tact'}, goldChip(), h('button',{class:'icon-btn back','aria-label':'חזרה',onclick:()=>go({kind:'hero'})}, ico('back', 22)))),
    chips, grid, s.sel ? itemSheet(GI[s.sel]) : null, tabBar('hero'));
}
function itemSheet(it){
  const s = session, g = GS(), L = gLevel(), R = G.RARITY[it.r], st = itemState(it);
  const close = () => { s.sel = null; render(); };
  const sv = it.s || {};
  const stats = [['a','התקפה'],['d','הגנה'],['m','קסם']].filter(x => sv[x[0]]).map(x => h('span',{class:'chip num',text:x[1] + ' +' + sv[x[0]]}));
  const eqSlot = EQ_SLOTS.indexOf(it.slot) >= 0;
  const prev = eqSlot ? h('div',{class:'sprev',html: heroSVG(Object.assign({}, g.eq, {[it.slot]: it.id}))}) : null;
  const msg = h('div',{class:'sub',id:'smsg'});
  let btn;
  const lock = R.lvl > L;
  if(st === 'buy'){
    if(lock) btn = h('button',{class:'btn btn-ghost',disabled:true}, 'נפתח ברמה ' + R.lvl);
    else if(it.slot === 'potion' && (g.pots[it.id] || 0) >= potCap()) btn = h('button',{class:'btn btn-ghost',disabled:true}, 'התיק מלא');
    else btn = h('button',{class:'btn btn-primary',disabled: g.gold < it.p || null,onclick:()=>buy(it)}, g.gold < it.p ? 'חסרים ' + (it.p - g.gold).toLocaleString('he-IL') + ' זהב' : ['קנייה · ', h('span',{class:'num',text:it.p.toLocaleString('he-IL')}), h('span',{html:COIN})]);
  } else if(st === 'own') btn = h('button',{class:'btn btn-primary',onclick:()=>{ g.eq[it.slot] = it.id; save(); s.sel = null; s.flash = it.slot; render(); }}, 'ללבוש');
  else if(st === 'on') btn = h('button',{class:'btn btn-ghost',onclick:()=>{ delete g.eq[it.slot]; save(); render(); }}, 'להוריד');
  else if(st === 'read') btn = h('button',{class:'btn btn-ghost',disabled:true}, 'כבר נקרא · השדרוג פעיל');
  else if(st === 'pot'){
    const more = (g.pots[it.id] || 0) < potCap() && g.gold >= it.p && !lock;
    btn = h('div',{class:'bk'},
      it.fx === 'hint' ? h('button',{class:'btn btn-ghost',disabled:true}, 'משתמשים בו מתוך שאלה') : h('button',{class:'btn btn-primary',onclick:()=>usePotion(it)}, 'שימוש'),
      h('button',{class:'btn btn-ghost',disabled: !more || null,onclick:()=>buy(it)}, 'עוד אחד · ' + it.p.toLocaleString('he-IL')));
  }
  return h('div',{class:'sheet-bg',onclick:e => { if(e.target === e.currentTarget) close(); }},
    h('section',{class:'sheet',role:'dialog','aria-modal':'true','aria-label':it.he},
      h('div',{class:'shead'}, h('span',{class:'ic big',html: G.iconSVG(it.look, it.id)}),
        h('div',{}, h('b',{text:it.he}), h('div',{class:'sub'}, h('span',{style:'color:' + R.color + ';font-weight:700',text:R.he}), ' · ' + G.SLOTS[it.slot].he + (it.slot === 'potion' && g.pots[it.id] ? ' · יש לך ' + g.pots[it.id] : ''))),
        h('button',{class:'icon-btn','aria-label':'סגירה',onclick:close}, ico('x', 20))),
      prev,
      h('p',{class:'sdesc',text:it.d}),
      stats.length ? h('div',{class:'srow'}, stats) : null,
      it.fx && G.FX[it.fx] ? h('div',{class:'sfx',text:'✦ ' + G.FX[it.fx].replace(/‎/g, '')}) : null,
      btn, msg));
}
function buy(it){
  const g = GS(), s = session;
  if(g.gold < it.p || G.RARITY[it.r].lvl > gLevel()) return;
  g.gold -= it.p;
  if(it.slot === 'potion') g.pots[it.id] = (g.pots[it.id] || 0) + 1;
  else if(it.slot === 'tome'){ g.owned[it.id] = 1; const k = it.fx === 'permA' ? 'a' : it.fx === 'permD' ? 'd' : 'm'; g.perm[k] = (g.perm[k] || 0) + 3; }
  else { g.owned[it.id] = 1; g.eq[it.slot] = it.id; s.flash = it.slot; s.sel = null; }
  buzz(14); save(); render();
  gToast('-' + it.p.toLocaleString('he-IL'), 'buy', it.slot === 'tome' ? 'נקרא · השדרוג נוסף לתמיד' : it.slot === 'potion' ? 'נשמר בתיק' : 'נקנה ונלבש');
}
function usePotion(it){
  const g = GS(), b = g.boost, m = document.getElementById('smsg');
  const say = t => { if(m) m.textContent = t; };
  const map = {x2:'x2', x15:'x15', retry:'retry', timer3:'timer3', x3past:'x3past'};
  if(map[it.fx]){
    if(b[map[it.fx]] || ((it.fx === 'x2' || it.fx === 'x15') && (b.x2 || b.x15))) return say('יש כבר שיקוי כזה פעיל. הוא ייגמר בסט הבא.');
    b[map[it.fx]] = true;
  } else if(it.fx === 'permA1' || it.fx === 'permD1' || it.fx === 'permM1'){
    const k = it.fx[4].toLowerCase(); g.perm[k] = (g.perm[k] || 0) + 1;
  } else if(it.fx === 'streak'){
    const y = new Date(); y.setDate(y.getDate() - 1); const y2 = new Date(); y2.setDate(y2.getDate() - 2);
    const act = k => { const l = S.log[k]; return l && (l[0] + l[3]) > 0; };
    if(act(dateKey(y)) || !act(dateKey(y2))) return say('אין כרגע רצף שבור של יום אחד לשחזר.');
    S.log[dateKey(y)] = [1, 1, 0, 0, 0];
  } else return;
  g.pots[it.id]--; if(!g.pots[it.id]) delete g.pots[it.id];
  session.sel = null; buzz(14); save(); render();
  gToast('השיקוי פעיל', 'buy', G.FX[it.fx].replace(/‎/g, '').replace(/^שימוש: /, ''));
}

/* ---------- backup ---------- */
function bkMsg(s){const el=document.getElementById('bkmsg'); if(el) el.textContent=s;}
async function exportData(){
  const name='amirnet-backup-' + dateKey() + '.json';
  const blob=new Blob([JSON.stringify(Object.assign({},S,{px:PX}))],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'גיבוי מאמן אמירנט'}); bkMsg('הגיבוי נשמר.'); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); a.remove();
  bkMsg('הגיבוי ירד לקובץ ' + name);
}
function importData(file){
  file.text().then(tx => {
    const o=JSON.parse(tx);
    if(!o || typeof o.cards!=='object') throw new Error('bad');
    S={cards:o.cards||{}, q:o.q||{}, log:o.log||{}, g:o.g||null, updatedAt:Date.now()};
    if(o.px && typeof o.px==='object'){ PX={keys:o.px.keys||{}, runs:o.px.runs||[], draft:null}; pxSave(); }
    writeLocal(); render(); bkMsg('ההתקדמות שוחזרה מהגיבוי.');
  }).catch(() => bkMsg('הקובץ אינו גיבוי תקין של האפליקציה.'));
}

/* ---------- boot ---------- */
loadLocal();
pxLoad();
ANIM = true;
render();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator){ window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }
})();
</script>
