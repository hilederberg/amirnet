<style>
/* Ink look: cream paper, thick black outlines, line-art flourishes. One committed single-theme design. */
:root{
  --bg:#FBF6EE; --surface:#FBF6EE; --surface-2:#EFE6D6; --fg:#111111; --muted:#4A443C; --line:#111111;
  --accent:#111111; --accent-fg:#FBF6EE; --good:#1F6B3A; --good-bg:#DCEBD2; --bad:#A8281E; --bad-bg:#F7DCD2; --warn:#7A4B00; --bar:#CFC5B3;
  --hero-bg:#FBF6EE; --hero-fg:#111111; --hero-btn-bg:#111111; --hero-btn-fg:#FBF6EE; --hero-track:#EFE6D6; --hero-fill:#111111; --hero-mb:2.5px solid #111111;
  --cta-bg:#111111; --cta-fg:#FBF6EE;
  --lc1:#FBF6EE; --lf1:#111111; --lc2:#FBF6EE; --lf2:#111111; --lc3:#FBF6EE; --lf3:#111111; --lc4:#FBF6EE; --lf4:#111111;

  --ui:'Rubik','Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --en:'Rubik','Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --display:'Rubik','Heebo',system-ui,sans-serif; --dw:700; --hw:700;
  color-scheme:light;
}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--ui)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.4rem;line-height:1.2;margin:0;font-weight:var(--hw)}
h2{font-size:.8rem;margin:0 0 10px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.sub{color:var(--muted);font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:var(--bw) solid var(--bc);box-shadow:var(--shadow);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:500;white-space:nowrap}
.card{background:var(--surface);border:var(--bw) solid var(--bc);box-shadow:var(--shadow);border-radius:var(--radius);padding:16px;min-width:0}
.hero{position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-fg);border:var(--bw) solid var(--bc);border-radius:var(--radius);padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.hero>*{position:relative}
.hero>.deco{position:absolute;inset-inline-end:6px;top:6px;display:flex;pointer-events:none}
.hero .big{font:var(--dw) 4.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.hero .lbl{font-weight:700}
.hero .meta{opacity:.92;font-size:.9rem}
.lvl{display:flex;align-items:center;gap:10px;font-size:.85rem;font-weight:700}
.lvl .meter{flex:1;height:12px;background:var(--hero-track);border:var(--hero-mb)}
.lvl .meter i{background:var(--hero-fill)}
.btn{min-height:48px;border-radius:var(--btn-r);border:1px solid transparent;font-weight:700;padding:10px 16px;cursor:pointer;text-align:center}
.btn:focus-visible,.opt:focus-visible,.rate:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.hero .btn{background:var(--hero-btn-bg);color:var(--hero-btn-fg)}
.btn-primary{background:var(--cta-bg);color:var(--cta-fg)}
.btn-ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.launch{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.launch .btn{position:relative;overflow:hidden;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:2px;text-align:start;padding:14px 16px;border-radius:var(--radius);border:var(--bw) solid var(--bc);box-shadow:var(--shadow)}
.launch .btn:nth-child(4n+1){background:var(--lc1);color:var(--lf1)}
.launch .btn:nth-child(4n+2){background:var(--lc2);color:var(--lf2)}
.launch .btn:nth-child(4n+3){background:var(--lc3);color:var(--lf3)}
.launch .btn:nth-child(4n+4){background:var(--lc4);color:var(--lf4)}
.launch .btn .deco{position:absolute;inset-inline-end:10px;top:8px;pointer-events:none;display:flex}
.launch .t{font-weight:700;font-size:1.02rem;max-width:calc(100% - 30px)}
.launch .btn:last-child:nth-child(odd){grid-column:1/-1}
.launch .btn:last-child:nth-child(odd) .t{max-width:none}
.launch .d{font-weight:400;opacity:.78;font-size:.85rem}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px 12px}
.stat .v{font:var(--dw) 2rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat .k{color:var(--muted);font-size:.8rem}
.bars{display:flex;align-items:flex-end;gap:5px;height:72px}
.bar{flex:1;min-width:0;background:var(--bar);border-radius:4px 4px 2px 2px;min-height:3px}
.bar.today{background:var(--accent)}
.bar-labels{display:flex;gap:5px;margin-top:6px}
.bar-labels span{flex:1;min-width:0;text-align:center;font-size:.7rem;color:var(--muted)}
.acc{display:flex;flex-direction:column;gap:12px}
.acc-row .head{display:flex;justify-content:space-between;gap:12px;font-size:.9rem;margin-bottom:4px}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter{border:2px solid #111;height:12px;background:#FBF6EE}
.prog .meter{height:10px}
.course{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--fg)}
.course .ct{font-weight:700}
.q .text.long{font-size:1.08rem;line-height:1.8}
.passage{white-space:pre-line}
.hard-toggle{display:flex;align-items:center;gap:12px;text-align:start;cursor:pointer;font:inherit;color:var(--fg);width:100%}
.hard-toggle .ct{font-weight:700}
.sw-box{flex:none;width:46px;height:28px;border-radius:99px;border:2.5px solid #111;background:var(--surface);position:relative}
.sw-box i{position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:#111;transition:inset-inline-start .2s}
.hard-toggle[aria-pressed="true"] .sw-box{background:#111}
.hard-toggle[aria-pressed="true"] .sw-box i{background:var(--surface);inset-inline-start:21px}
.inst .tag{margin-inline-end:6px}
.foot{color:var(--muted);font-size:.8rem;line-height:1.6}

.sess-top{display:flex;align-items:center;gap:12px}
.icon-btn{min-height:44px;min-width:44px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;padding:0 14px}
.prog{flex:1;min-width:0}
.prog .meter{height:6px}
.prog .cnt{font-size:.8rem;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between}
.en{font-family:var(--en);font-weight:500;direction:ltr;text-align:left;unicode-bidi:isolate}
.flash{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px 18px}
.fdeco{display:flex;justify-content:center;min-height:0}
.flash .word{font-size:2.6rem;line-height:1.15;text-align:center;overflow-wrap:anywhere;font-weight:600}
.flash .he{font-size:1.7rem;font-weight:700}
.flash .ex{font-size:1.15rem;line-height:1.5;color:var(--fg);text-align:left;width:100%;padding-top:14px;border-top:2px solid var(--line)}
.flash mark{background:none;color:var(--fg);font-weight:600;text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--accent);text-underline-offset:4px}
.tag{font-size:.75rem;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--surface-2);color:var(--muted)}
.tag.new{background:var(--accent);color:var(--accent-fg)}
.speak{min-height:44px;min-width:44px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{min-height:64px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px}
.rate b{font-size:.95rem}
.rate span{font-size:.75rem;color:var(--muted)}
.r1{border-bottom-color:var(--bad)}.r2{border-bottom-color:var(--warn)}.r3{border-bottom-color:var(--accent)}.r4{border-bottom-color:var(--good)}

.q{padding:18px}
.q .inst{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.q .text{font-size:1.35rem;line-height:1.6}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--fg);text-align:center;margin-inline:2px;line-height:1.1}
.blank.ok{border-bottom-color:var(--good);color:var(--good)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:52px;width:100%;border-radius:var(--opt-r);border:2px solid var(--line);background:var(--surface);padding:10px 14px;cursor:pointer;font-size:1.1rem;line-height:1.45;direction:ltr;text-align:left}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.6}
.opt[disabled]{cursor:default}
.fb{border-radius:var(--opt-r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-bg)}.fb.no{background:var(--bad-bg)}
.fb .h{font-weight:700}
.fb.ok .h{color:var(--good)}.fb.no .h{color:var(--bad)}
.timer{font-variant-numeric:tabular-nums;font-weight:500}
.timer.over{color:var(--bad)}
.score{font:var(--dw) 3.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.miss{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-top:2px solid var(--line)}
.miss:first-of-type{border-top:0}
.miss .s{font-size:1.05rem;line-height:1.55}
.stack{display:flex;flex-direction:column;gap:18px}
.heb{direction:rtl;text-align:right;font-family:var(--ui);font-weight:500}
.q .text.heb{font-size:1.3rem;line-height:1.7}
.opt.heb{direction:rtl;text-align:right;font-family:var(--ui);font-size:1.05rem}
.passage{font-size:1.05rem;line-height:1.8;overflow-wrap:anywhere}
.passage.en{font-size:1.1rem}
.miss .s.heb{font-weight:400}
@media (prefers-reduced-motion:no-preference){.bar,.meter i{transition:height .3s,width .3s}}

.bk{display:flex;gap:10px;flex-wrap:wrap;margin-block:12px 6px}
.bk .btn{flex:1;min-width:140px;display:inline-flex;align-items:center;justify-content:center}
label.btn{cursor:pointer}
</style>
</head>

{id:'rd_he5',lang:'he',title:'פיזור הלמידה',

{id:'sc49',q:'The ancient manuscript was so _____ that it crumbled when the researchers tried to open it.',o:['fragile','durable','legible','valuable'],a:0,e:'כתב יד שמתפורר בפתיחה הוא שביר (fragile).'},

{id:'sc52',q:'Rather than _____ the problem, the committee chose to ignore it and hope it would disappear.',o:['confront','exacerbate','postpone','overlook'],a:0,e:'Rather than מסמן ניגוד ל־ignore: ההפך מהתעלמות הוא התמודדות (confront).'},

{id:'sc57',q:'Because the instructions were _____, different teams interpreted them in completely different ways.',o:['ambiguous','explicit','concise','redundant'],a:0,e:'פרשנויות שונות לגמרי נובעות מהוראות דו־משמעיות (ambiguous).'},

{id:'lg23',q:'רק חברי המועדון רשאים להשתתף בטורניר. כל חברי המועדון שילמו דמי חבר. יואב השתתף בטורניר. מה נובע בהכרח?',o:['יואב שילם דמי חבר','כל מי ששילם דמי חבר השתתף בטורניר','יואב אינו חבר מועדון','אי אפשר לדעת אם יואב שילם'],a:0,e:'"רק חברים רשאים" פירושו שכל משתתף הוא חבר. יואב השתתף, ולכן הוא חבר, ולכן שילם.'},

{id:'lg25',q:'מהי השלילה של הטענה "אף תלמיד לא נכשל במבחן"?',o:['לפחות תלמיד אחד נכשל במבחן','כל התלמידים נכשלו במבחן','רוב התלמידים עברו את המבחן','אף תלמיד לא עבר את המבחן'],a:0,e:'השלילה של "אף אחד לא" היא "לפחות אחד כן".'},

{id:'lg27',q:'ארבעה אנשים — א, ב, ג ו־ד — יושבים סביב שולחן עגול בארבעה מקומות במרחקים שווים. א יושב מול ב. ג יושב מימינו של א. מי יושב משמאלו של א?',o:['ד','ב','ג','אי אפשר לדעת'],a:0,e:'ב מול א, ולכן אינו צמוד לו. ג מימין לא, ולכן משמאל לא נשאר רק ד.'},
{id:'lg28',q:'בקבוצה 40 אנשים: 25 דוברים אנגלית, 18 דוברים ערבית, ו־7 אינם דוברים אף אחת מהשפות. כמה דוברים את שתי השפות?',o:['10','8','3','15'],a:0,e:'דוברי לפחות שפה אחת: 40 − 7 = 33. לכן 25 + 18 − 33 = 10.'},

{id:'lg31',q:'התפוח כבד מהאגס. האגס כבד מהשזיף. האפרסק קל מהאגס אך כבד מהשזיף. מה נכון בהכרח?',o:['התפוח כבד מהאפרסק','האפרסק כבד מהתפוח','השזיף כבד מהאפרסק','האגס הוא הקל ביותר'],a:0,e:'הסדר מהכבד לקל: תפוח, אגס, אפרסק, שזיף. לכן התפוח כבד מהאפרסק.'},
{id:'lg32',q:'אבי, בני וגדי עובדים כמורה, רופא ונגר, אחד בכל מקצוע. הנגר צעיר מבני. אבי והרופא נולדו באותו יום ממש. הרופא מבוגר מגדי. מה מקצועו של גדי?',o:['נגר','מורה','רופא','אי אפשר לדעת'],a:0,e:'אבי אינו הרופא (נולד ביומו של הרופא), וגדי אינו הרופא (צעיר ממנו), ולכן בני הוא הרופא. הנגר צעיר מבני, ואבי בן גילו של בני, ולכן אבי אינו הנגר. אבי מורה וגדי נגר.'}

{id:'rd_he10',lang:'he',title:'טכנולוגיה ותעסוקה',

 qs:[
 {id:'rd_he10_1',q:'מה עולה מן הקטע על ההשפעה ההיסטורית של טכנולוגיה על התעסוקה?',o:['שיעור התעסוקה הכולל לא קרס, אף שעובדים מסוימים נפגעו','הטכנולוגיה הביאה לאבטלה המונית','הטכנולוגיה לא פגעה באף עובד','כל המשרות שאבדו חזרו לאותם עובדים'],a:0,e:'הקטע מכיר בנפגעים, אך אומר ששיעור התעסוקה הכולל לא קרס.'},

 {id:'rd_he10_4',q:'מדוע, לדעת הכלכלנים, המעבר אינו חלק?',o:['המשרות החדשות דורשות לעיתים כישורים שאין לעובדים שפוטרו','אין מקצועות חדשים','הטכנולוגיה יקרה מדי','הצרכנים אינם קונים מוצרים זולים'],a:0,e:'מי שפוטר אינו בהכרח מי שנקלט, כי המקצועות החדשים דורשים כישורים אחרים.'},

{id:'rd_en5',lang:'en',title:'The dance of the honeybee',
 text:'In the 1940s, the Austrian scientist Karl von Frisch proposed that honeybees communicate the location of food through a "waggle dance." A bee returning to the hive moves in a figure-eight pattern; the angle of the straight middle run relative to vertical indicates the direction of the food relative to the sun, while the duration of the waggle indicates distance. Many scientists were skeptical. Some argued that bees found food simply by following its smell, and that the dance was merely a sign of excitement. The debate was not settled until decades later, when researchers built a robotic bee that performed the dance without carrying any scent. Bees that watched the robot tended to fly in the direction it indicated, suggesting that the dance itself, and not odor, carried the information. Even so, researchers now believe that bees combine several sources of information, including scent, when deciding where to fly.',
 qs:[
 {id:'rd_en5_1',q:'What was the skeptics\' main objection to von Frisch\'s theory?',o:['Bees might locate food by smell rather than by the dance.','Bees cannot see the sun from inside the hive.','The dance was too complex for bees to learn.','Von Frisch had never observed bees directly.'],a:0,e:'הספקנים טענו שהדבורים פשוט עוקבות אחרי הריח, והריקוד הוא רק סימן להתרגשות.'},
 {id:'rd_en5_2',q:'According to the passage, the duration of the waggle indicates',o:['how far away the food is','the direction of the food','the type of flower','the number of bees needed'],a:0,e:'the duration of the waggle indicates distance. הכיוון נקבע לפי הזווית.'},
 {id:'rd_en5_3',q:'Why was the robotic bee important?',o:['It performed the dance without scent, separating the dance from smell.','It replaced real bees in the hive.','It proved that bees cannot smell.','It collected food more efficiently.'],a:0,e:'הרובוט בודד את הריקוד מהריח, וכך אפשר היה לבדוק את השפעת הריקוד לבדו.'},
 {id:'rd_en5_4',q:'The word "settled" in the passage most nearly means',o:['resolved','calmed','located','paid'],a:0,e:'debate was settled פירושו שהוויכוח הוכרע (resolved).'},
 {id:'rd_en5_5',q:'Which statement best reflects the view described at the end of the passage?',o:['The dance carries information, but bees also use other cues such as scent.','Smell is the only cue bees use.','The dance has no real function.','Robots communicate better than bees.'],a:0,e:'Even so... combine several sources: הריקוד חשוב, אך לא בלעדי.'}
 ]},
{id:'rd_en6',lang:'en',title:'Anchoring',
 text:'When people estimate a number, they are often influenced by figures that have nothing to do with the question. In a well-known experiment, participants were asked to write down the last two digits of an identification number and then to bid on items such as wine and chocolate. Those whose digits were high consistently offered more than those whose digits were low, even though they knew the digits were random. Psychologists call this tendency "anchoring": an initial number serves as a reference point, and later judgments are adjusted from it, but not enough. The effect appears even among experts. Real-estate agents shown different asking prices for the same house gave different estimates of its value, while insisting that the asking price had not affected them. Some researchers suggest that the best defense is to form one\'s own estimate before seeing any figure; others doubt that people can fully escape the effect, since they are usually unaware of it.',
 qs:[
 {id:'rd_en6_1',q:'What is the main purpose of the passage?',o:['To describe a bias in which irrelevant numbers affect estimates','To explain how wine prices are set','To argue that experts make no mistakes','To compare different types of auctions'],a:0,e:'הקטע מתאר את הטיית העיגון ומביא דוגמאות לה.'},
 {id:'rd_en6_2',q:'Why was it significant that participants knew the digits were random?',o:['It shows they were influenced even by numbers they knew to be meaningless.','It proves they were dishonest.','It made them bid lower.','It meant the experiment failed.'],a:0,e:'even though they knew: ההשפעה התקיימה למרות הידיעה שהמספר חסר משמעות.'},
 {id:'rd_en6_3',q:'The example of the real-estate agents is meant to show that',o:['even professionals are affected by anchoring without realizing it','agents estimate better than other people','asking prices are always accurate','houses are hard to sell'],a:0,e:'הסוכנים הושפעו ובאותו זמן התעקשו שלא הושפעו.'},
 {id:'rd_en6_4',q:'According to the passage, why do some researchers doubt that people can avoid the effect?',o:['People are usually unaware that they are being influenced.','The effect occurs only with high numbers.','People refuse to make estimates.','Experts are immune to it.'],a:0,e:'since they are usually unaware of it: קשה להתגונן מפני השפעה שלא מודעים לה.'},
 {id:'rd_en6_5',q:'The phrase "but not enough" suggests that people',o:['move away from the initial number too little','ignore the initial number entirely','overestimate every value','never change their estimates'],a:0,e:'הם מתקנים את ההערכה מנקודת העוגן, אבל לא מספיק, ולכן נשארים קרובים אליה.'}
 ]},
{id:'rd_en7',lang:'en',title:'Teenagers and sleep',
 text:'For years, teenagers who stayed up late and struggled to wake up for school were assumed to be simply lazy or undisciplined. Research over the past few decades has offered a different explanation. During adolescence, the body\'s internal clock shifts, so that teenagers naturally begin to feel sleepy later in the evening than younger children or adults. Because school still starts early, many teenagers are chronically short of sleep, which can impair attention, memory and mood. Several school districts have therefore experimented with later start times. In a number of cases, students did not simply stay up later; they slept more, and some schools reported improved attendance. Critics point out practical obstacles, such as bus schedules and after-school activities, and note that results have varied from place to place. Still, the research has shifted the debate from questions of character to questions of biology.',
 qs:[
 {id:'rd_en7_1',q:'According to the passage, why do many teenagers go to sleep late?',o:['A biological shift in their internal clock','Laziness and lack of discipline','Too much homework','Early school start times'],a:0,e:'המחקר מסביר שהשעון הפנימי משתנה בגיל ההתבגרות. העצלות היא ההסבר הישן שהקטע דוחה.'},
 {id:'rd_en7_2',q:'What happened in some districts that delayed school start times?',o:['Students slept more, and some schools saw better attendance.','Students stayed up later and slept the same amount.','Attendance dropped sharply.','Bus schedules became simpler.'],a:0,e:'did not simply stay up later; they slept more.'},
 {id:'rd_en7_3',q:'The critics mentioned in the passage mainly argue that',o:['later start times involve practical difficulties and inconsistent results','teenagers do not need sleep','the research is completely false','schools should start even earlier'],a:0,e:'המבקרים מזכירים מכשולים מעשיים ותוצאות שמשתנות ממקום למקום.'},
 {id:'rd_en7_4',q:'The word "chronically" most nearly means',o:['persistently','occasionally','slightly','suddenly'],a:0,e:'chronically פירושו באופן מתמשך וקבוע.'},
 {id:'rd_en7_5',q:'What change does the last sentence describe?',o:['The debate now focuses on biology rather than on character.','Teenagers are now considered lazy.','All schools have adopted later start times.','Character no longer matters in education.'],a:0,e:'shifted the debate from questions of character to questions of biology.'}
 ]}
);

{id:'hi01',lvl:3,q:'חוקרים מצאו שבערים שבהן מספר בתי הקפה גבוה, גם שיעור הסטודנטים גבוה. מכאן הסיקו שפתיחת בתי קפה מושכת סטודנטים לעיר. איזו מהעובדות הבאות מחלישה ביותר את המסקנה?',o:['בתי קפה נוטים להיפתח באזורים שבהם כבר גרים סטודנטים רבים','סטודנטים רבים שותים קפה','בחלק מהערים יש מעט בתי קפה','מחירי הקפה בערים הגדולות גבוהים'],a:0,e:'המסקנה מניחה שבתי הקפה הם הסיבה. אם הסטודנטים הם שמושכים את בתי הקפה, כיוון הסיבתיות הפוך, והמסקנה נחלשת. זו המלכודת הקלאסית: מתאם אינו סיבתיות.'},
{id:'hi02',lvl:3,q:'משרד התחבורה טוען שהתקנת מצלמות מהירות בכביש מסוים הפחיתה את מספר התאונות בו, שכן מאז התקנתן ירד מספר התאונות בכביש ב־30%. איזו מהעובדות הבאות מחזקת ביותר את הטענה?',o:['באותה תקופה לא חל שינוי במספר התאונות בכבישים דומים שאין בהם מצלמות','מספר הנהגים בכביש גדל','המצלמות יקרות','רוב הנהגים מתנגדים למצלמות'],a:0,e:'כדי לייחס את הירידה למצלמות יש לשלול גורם כללי, כמו חורף יבש או קמפיין ארצי. קבוצת השוואה ללא מצלמות שלא השתנתה עושה זאת.'},
{id:'hi03',lvl:3,q:'חוקרת רוצה לבדוק אם האזנה למוזיקה בזמן למידה פוגעת בזכירה. היא מחלקת משתתפים לשתי קבוצות: האחת לומדת עם מוזיקה בחדר רועש, והאחרת לומדת בלי מוזיקה בחדר שקט. מבקר טען שהניסוי פגום. מהו השינוי הנחוץ ביותר?',o:['להושיב את שתי הקבוצות בחדרים זהים, כך שההבדל היחיד ביניהן יהיה המוזיקה','להגדיל את מספר המשתתפים בקבוצת המוזיקה בלבד','להשמיע מוזיקה לשתי הקבוצות','לבדוק את הזכירה רק בקבוצה השקטה'],a:0,e:'בניסוי תקין משנים משתנה אחד בלבד. כאן גם המוזיקה וגם רעש החדר שונים, ולכן אי אפשר לדעת מה גרם להבדל.'},
{id:'hi04',lvl:3,q:'"מאחר שמספר המבקרים בספריות הציבוריות ירד, ברור שהציבור קורא פחות ספרים." על איזו הנחה נשענת הטענה?',o:['שרוב קריאת הספרים נעשית באמצעות ספריות ציבוריות','שספריות ציבוריות יקרות','שהציבור אינו אוהב לקרוא','שמספר הספריות גדל'],a:0,e:'אם אנשים קונים ספרים או קוראים ספרים דיגיטליים, ירידה בביקורים אינה מעידה על פחות קריאה. הטענה מניחה בשקט שהספרייה היא ערוץ הקריאה העיקרי.'},
{id:'hi05',lvl:3,q:'מחקר שנערך בקרב אלפי עובדים מצא שעובדים שקיבלו משוב תכוף מהממונים עליהם דיווחו על שביעות רצון גבוהה יותר, גם כשהמשוב כלל ביקורת. לעומת זאת, עובדים שלא קיבלו משוב כלל דיווחו על שביעות הרצון הנמוכה ביותר, נמוכה אף מזו של עובדים שקיבלו בעיקר ביקורת. איזו כותרת מתאימה ביותר לממצאים?',o:['התעלמות מזיקה יותר מביקורת','ביקורת פוגעת בשביעות הרצון','עובדים מעדיפים שבחים על פני ביקורת','משוב תכוף מגדיל את המשכורת'],a:0,e:'הממצא הבולט הוא שהיעדר משוב גרוע אפילו מביקורת. שאר הכותרות סותרות את הממצאים או אינן נובעות מהם.'},
{id:'hi06',lvl:3,q:'בסקר נמצא שכל המשתתפים שעיסוקם בהוראה מתנדבים בקהילה, ושאף אחד מהמתנדבים בקהילה אינו עובד במשמרות לילה. על סמך נתונים אלה בלבד, מה נכון בהכרח לגבי משתתפי הסקר?',o:['אף מורה אינו עובד במשמרות לילה','כל המתנדבים הם מורים','חלק מהעובדים במשמרות לילה מתנדבים','אין בסקר משתתפים העובדים במשמרות לילה'],a:0,e:'מורה, ולכן מתנדב, ולכן לא עובד במשמרות לילה. "כל המתנדבים הם מורים" היא היפוך שגוי של הטענה הראשונה.'},
{id:'hi07',lvl:3,q:'בבית חולים מסוים נמצא ששיעור התמותה במחלקה לטיפול נמרץ גבוה בהרבה מבשאר המחלקות. מנהל אחד הציע לסגור את המחלקה. מהו ההסבר המתקבל ביותר לממצא, המראה שההצעה שגויה?',o:['למחלקה מגיעים מלכתחילה החולים שמצבם הקשה ביותר','במחלקה עובדים רופאים רבים','המחלקה ממוקמת בקומה העליונה','המחלקה חדשה יחסית'],a:0,e:'שיעור התמותה הגבוה נובע מהרכב החולים, לא מהטיפול. זו הטיית בחירה, וסגירת המחלקה רק תפגע בחולים הקשים.'},
{id:'hi08',lvl:3,q:'בתחרות השתתפו ארבעה רצים. ידוע שיונתן הקדים את מיכל, שמיכל הקדימה את שירה, ושאורי לא סיים אחרון. איזו מהטענות הבאות אינה יכולה להיות נכונה?',o:['שירה לא סיימה אחרונה','אורי סיים ראשון','יונתן סיים שני','מיכל סיימה שלישית'],a:0,e:'שירה אחרי מיכל ויונתן, ואורי אינו אחרון, ולכן שירה חייבת להיות אחרונה. שאר האפשרויות מתקיימות בסידור כלשהו, למשל אורי, יונתן, מיכל, שירה.'},
{id:'hi09',lvl:3,q:'במשחק מילים, כל מילה בשרשרת חייבת להתחיל באות שבה הסתיימה המילה הקודמת, וכל מילה חייבת להיות ארוכה באות אחת לפחות מקודמתה. איזו מהשרשראות הבאות אינה חוקית?',o:['אש, שיר, רגל','גל, לבה, הרגל','דג, גדר, רכבת','בד, דבש, שולחן'],a:0,e:'"רגל" מתחילה ב־ר כנדרש, אבל אורכה 3 אותיות, כמו "שיר", ולא ארוכה ממנה. בשאלות כאלה בודקים כל כלל בנפרד בכל אפשרות.'},
{id:'hi10',lvl:3,q:'עירייה העלתה את תעריף החניה במרכז העיר פי שניים. בחודש שלאחר מכן ירד מספר המכוניות שחנו במרכז ב־20%, אך הכנסות העירייה מחניה עלו. בהנחה שמשך החניה הממוצע לא השתנה, מה ניתן להסיק בוודאות?',o:['התוספת בתשלום לכל מכונית פיצתה על הירידה במספר המכוניות','רוב הנהגים עברו לתחבורה ציבורית','מספר המכוניות במרכז ירד בחצי','הכנסות החניה עלו פי שניים'],a:0,e:'פי 2 במחיר כפול 0.8 במכוניות שווה פי 1.6 בהכנסות. ההכנסות עלו אבל לא הוכפלו. המעבר לתחבורה ציבורית אינו נובע מהנתונים.'},
{id:'hi11',lvl:3,q:'בעשור האחרון עלה מספר המקרים המאובחנים של מחלה מסוימת, אף ששיעור החולים בה בפועל לא השתנה. מה מיישב את הסתירה לכאורה?',o:['שיטות האבחון השתפרו ומזהות מקרים שבעבר לא אובחנו','המחלה נעשתה מדבקת יותר','האוכלוסייה הצטמצמה','החולים מחלימים מהר יותר'],a:0,e:'ההבדל הוא בין שיעור החולים בפועל לבין מספר המאובחנים. אבחון טוב יותר מגדיל את המספר בלי שהמחלה התפשטה.'},
{id:'hi12',lvl:3,q:'"כל האנשים המצליחים שאני מכיר קמים מוקדם. לכן, אם אקום מוקדם, אצליח." מהו הפגם העיקרי בטיעון?',o:['הוא מסיק סיבתיות מתוך מתאם, ומניח שקימה מוקדמת מספיקה להצלחה','הוא אינו מגדיר מהי שעה מוקדמת','הוא סותר את עצמו','אין בו פגם'],a:0,e:'מכך שהמצליחים קמים מוקדם לא נובע שקימה מוקדמת גורמת להצלחה, ובוודאי לא שהיא מספיקה לה.'},
{id:'hi13',lvl:3,q:'חברה טוענת שהמוצר שלה פופולרי יותר מזה של המתחרה, משום שבשנה שעברה מכרה ממנו 10,000 יחידות יותר. איזה נתון, אילו היה ידוע, היה מחליש את הטענה?',o:['החברה משווקת את מוצרה בשווקים רבים פי כמה מהמתחרה','המוצר של החברה זכה בפרס עיצוב','שתי החברות נוסדו באותה שנה','המתחרה משקיע יותר בפרסום'],a:0,e:'מכירות גבוהות יותר בשוק גדול בהרבה אינן מעידות על פופולריות. ייתכן שבכל שוק המתחרה נמכר יותר. "המתחרה משקיע יותר בפרסום" דווקא מחזק את הטענה.'},
{id:'hi14',lvl:3,q:'עד המאה ה־19 נהגו רופאים רבים לנתח גופות ומיד לאחר מכן לטפל ביולדות, בלי לשטוף ידיים. כשרופא אחד חייב את צוות מחלקתו לשטוף ידיים בתמיסת כלור, צנח שיעור התמותה של היולדות במחלקה. עמיתיו דחו בתחילה את ממצאיו, בין היתר משום שלא היה בידו הסבר למנגנון. מה ניתן להסיק מן הקטע על הסיבה לדחיית הממצאים?',o:['עמיתיו התקשו לקבל ממצא שלא היה לו הסבר תאורטי','הממצאים היו שגויים','שטיפת ידיים הייתה יקרה','התמותה לא ירדה בפועל'],a:0,e:'הקטע אומר במפורש שהיעדר הסבר למנגנון היה אחת הסיבות. הוא אינו טוען שהממצאים היו שגויים.'},
{id:'hi15',lvl:3,q:'"רק מי שעבר את מבחן הכניסה יכול להתקבל לקורס, אך לא כל מי שעבר את המבחן מתקבל." מה נובע מן המשפט?',o:['מעבר המבחן הכרחי לקבלה, אך אינו מספיק','מעבר המבחן מספיק לקבלה','אפשר להתקבל בלי לעבור את המבחן','כל מי שנכשל במבחן מתקבל לקורס אחר'],a:0,e:'"רק מי ש" מבטא תנאי הכרחי. "לא כל מי ש" מראה שהתנאי אינו מספיק.'},
{id:'hi16',lvl:3,q:'כדי לבדוק אם דשן חדש משפר את היבול, חקלאי פיזר אותו בשדה שבצפון החווה, והשווה את היבול לשדה שבדרום החווה, שלא קיבל דשן. מהי החולשה העיקרית בבדיקה?',o:['ייתכן שהשדות נבדלים זה מזה גם בתנאים אחרים, כמו קרקע והשקיה','החקלאי השתמש בדשן אחד בלבד','הבדיקה נערכה בחווה אחת','היבול נמדד בסוף העונה'],a:0,e:'ההשוואה אינה מבודדת את הדשן: ההבדל ביבול עשוי לנבוע מהבדלים בין השדות. פתרון אפשרי הוא חלוקה אקראית של חלקות בתוך אותו שדה.'}
];

AN.push(
{id:'an61',lvl:3,q:'צורף : תכשיט',o:['קדר : כד','כד : קדר','סתת : אבן','כורם : מרתף'],a:0,e:'היחס: בעל מלאכה והמוצר שהוא מייצר. הצורף מייצר תכשיט והקדר כד. "כד : קדר" הוא אותו יחס בסדר הפוך, וזו מלכודת נפוצה. סתת ואבן הם אומן וחומר הגלם, יחס אחר.'},
{id:'an62',lvl:3,q:'סתת : אבן',o:['נפח : ברזל','ברזל : נפח','צורף : תכשיט','כורם : ענבים'],a:0,e:'היחס: בעל מלאכה וחומר הגלם שהוא מעבד. הסתת מעבד אבן והנפח מעבד ברזל. "צורף : תכשיט" הוא אומן ומוצר, לא חומר.'},
{id:'an63',lvl:3,q:'כורם : כרם',o:['גנן : גינה','גינה : גנן','כרם : יין','רועה : צאן'],a:0,e:'היחס: מי שמעבד ומטפח מקום, והמקום. הכורם מעבד כרם והגנן גינה. הרועה מטפל בבעלי חיים, לא במקום.'},
{id:'an64',lvl:3,q:'התחנן : ביקש',o:['זעק : אמר','אמר : זעק','לחש : צעק','שאל : ענה'],a:0,e:'היחס: הפועל הראשון הוא צורה עזה של השני. התחנן הוא ביקש בכל לבו, וזעק הוא אמר בקול גדול. "אמר : זעק" הפוך.'},
{id:'an65',lvl:3,q:'אובייקטיביות : משוא פנים',o:['יושר : רמייה','רמייה : שקר','צדק : משפט','דעה : עמדה'],a:0,e:'היחס: הפכים. אובייקטיביות מנוגדת למשוא פנים, ויושר מנוגד לרמייה. רמייה ושקר קרובים במשמעותם.'},
{id:'an66',lvl:3,q:'זורם : מוזרם',o:['עולה : מועלה','מועלה : עולה','עולה : יורד','מעלה : עולה'],a:0,e:'היחס: הראשון מתאר פעולה שהנושא עושה מעצמו, והשני את אותה פעולה כשמישהו אחר גורם לה (סביל). המים זורמים או מוזרמים, והדבר עולה או מועלה.'},
{id:'an67',lvl:3,q:'פנס : להאיר',o:['מפתח : לפתוח','לפתוח : מפתח','דלת : מנעול','חושך : להאיר'],a:0,e:'היחס: כלי והפעולה שהוא נועד לה, בסדר כלי ואחריו פועל. שימו לב לסדר ההפוך באפשרות השנייה.'},
{id:'an68',lvl:3,q:'שקדן : התמדה',o:['ענו : צניעות','גאוותן : צניעות','צניעות : ענו','עשיר : ממון'],a:0,e:'היחס: אדם והתכונה שמאפיינת אותו. השקדן מתמיד והענו צנוע. לגאוותן חסרה צניעות, ולעשיר יש רכוש ולא תכונה.'},
{id:'an69',lvl:3,q:'משל : נמשל',o:['סמל : מסומל','מסומל : סמל','שיר : משורר','סיפור : קורא'],a:0,e:'היחס: ייצוג והדבר שהוא מייצג. המשל מייצג את הנמשל והסמל את המסומל.'},
{id:'an70',lvl:3,q:'קבצן : נדבה',o:['שואל : תשובה','נדבה : קבצן','נדיב : מתנה','עני : כסף'],a:0,e:'היחס: מי שמבקש והדבר שהוא מבקש לקבל. הקבצן מבקש נדבה והשואל מבקש תשובה. הנדיב נותן ולא מבקש.'},
{id:'an71',lvl:3,q:'מחרשה : תלם',o:['עט : קו','קו : עט','מכחול : צבע','מחרשה : שדה'],a:0,e:'היחס: כלי והסימן שהוא משאיר. המחרשה חורצת תלם והעט משאיר קו. צבע הוא חומר, לא סימן.'},
{id:'an72',lvl:3,q:'אבל : קינה',o:['שמחה : מחול','קינה : אבל','כעס : שקט','פחד : אומץ'],a:0,e:'היחס: רגש והביטוי הטקסי או האמנותי שלו. הקינה מבטאת אבל, והמחול מבטא שמחה.'},
{id:'an73',lvl:3,q:'מתפרה : בגדים',o:['מאפייה : לחם','לחם : מאפייה','חנות : קונים','מוזיאון : תמונות'],a:0,e:'היחס: מקום ייצור והמוצר שמיוצר בו. במוזיאון מציגים ולא מייצרים.'},
{id:'an74',lvl:3,q:'ענף : עץ',o:['יובל : נהר','נהר : יובל','גשר : נהר','ים : נהר'],a:0,e:'היחס: שלוחה צדדית של גוף ראשי. הענף מתפצל מהעץ, והיובל מתחבר לנהר כשלוחה שלו.'},
{id:'an75',lvl:3,q:'מתווך : צדדים',o:['גשר : גדות','גדות : גשר','שופט : נאשם','מורה : כיתה'],a:0,e:'היחס: דבר שמחבר בין שני צדדים. המתווך מקשר בין הצדדים והגשר בין הגדות.'}
);

HSC.push(
{id:'hs47',lvl:3,q:'אילו _____ החוקרים את הממצאים בזמן, _____ ניתן היה למנוע את הנזק. אולם הם _____ בפרסומם, והנזק כבר נגרם.',o:['פרסמו / ייתכן ש / התמהמהו','פרסמו / ודאי שלא / מיהרו','הסתירו / ייתכן ש / מיהרו','הסתירו / ודאי שלא / התמהמהו'],a:0,e:'"אילו" מציג תנאי שלא התקיים: הם לא פרסמו בזמן, כלומר התמהמהו. לכן אילו פרסמו, ייתכן שהנזק היה נמנע. בודקים כל חלל: אפשרות שמתאימה לחלל אחד בלבד אינה נכונה.'},
{id:'hs48',lvl:3,q:'_____ שהניסוי נערך בתנאים מבוקרים, אין בו כדי להוכיח את התאוריה, _____ מספר המשתתפים בו היה קטן מאוד, _____ לא נבדקה בו קבוצת ביקורת.',o:['אף / שכן / ויתרה מזאת','משום / אולם / ולכן','אף / ולכן / אך','משום / שכן / ולכן'],a:0,e:'"אף ש" מציג ויתור (התנאים מבוקרים), "שכן" מנמק מדוע אין הוכחה, ו"ויתרה מזאת" מוסיף נימוק נוסף באותו כיוון.'},
{id:'hs49',lvl:3,q:'ההחלטה לסגור את המפעל לא הייתה _____: היא _____ אחרי שנים של הפסדים, ו_____ שהיא כאובה, רוב העובדים הבינו שלא הייתה ברירה.',o:['פזיזה / התקבלה / אף','מתוכננת / התקבלה / משום','פזיזה / נדחתה / משום','מחושבת / נדחתה / אף'],a:0,e:'ההחלטה התקבלה אחרי שנים, ולכן לא הייתה פזיזה. "אף שהיא כאובה... הבינו" הוא ויתור.'},
{id:'hs50',lvl:3,q:'בניגוד לסברה _____, המחקר מצא שילדים שגדלו עם בעלי חיים _____ פחות לאלרגיות, ולא _____.',o:['הרווחת / נוטים / יותר','המוכחת / נוטים / פחות','הרווחת / נוטים / פחות','הנדירה / נוטים / יותר'],a:0,e:'"בניגוד לסברה הרווחת" מציג ממצא מפתיע: פחות אלרגיות ולא יותר. "ולא פחות" חוזר על אותו כיוון ואינו הגיוני.'},
{id:'hs51',lvl:3,q:'הוא לא היה _____ לביקורת, _____ דווקא חיפש אותה, משום שהאמין שרק מי ש_____ בטעויותיו יכול להשתפר.',o:['אטום / אלא / מכיר','פתוח / אלא / מתעלם','אטום / ולכן / מתעלם','פתוח / ולכן / מכיר'],a:0,e:'"לא X אלא Y": לא היה אטום לביקורת, אלא חיפש אותה. ההיגיון מחייב "מכיר בטעויותיו".'},
{id:'hs52',lvl:3,q:'_____ שהראיות נגד הנאשם היו נסיבתיות בלבד, השופטים _____ להרשיעו, ו_____ אותו מחמת הספק.',o:['מאחר / היססו / זיכו','אף / מיהרו / זיכו','מאחר / מיהרו / הרשיעו','אף / היססו / הרשיעו'],a:0,e:'"מחמת הספק" מופיע רק עם זיכוי. ראיות נסיבתיות הן סיבה להיסוס, ולכן "מאחר ש".'},
{id:'hs53',lvl:3,q:'גם _____ התוכנית תצליח, היא לא תפתור את הבעיה מן _____, אלא רק _____ את תסמיניה.',o:['אם / השורש / תמתן','כאשר / העבר / תחמיר','אם / השורש / תעמיק','אילו / הצד / תבטל'],a:0,e:'"מן השורש" הוא ביטוי לפתרון יסודי. "אלא רק" מצביע על השפעה מוגבלת וחיובית: מיתון התסמינים.'},
{id:'hs54',lvl:3,q:'הספר זכה לשבחים _____, אך דווקא _____ זו עוררה את חשדם של כמה מבקרים, שתהו אם היא אינה נובעת מ_____ ולא מאיכות.',o:['גורפים / אחידות / יחסי ציבור','מעטים / ביקורת / יחסי ציבור','גורפים / ביקורת / איכות','מסויגים / אחידות / כישרון'],a:0,e:'השבחים היו גורפים, ולכן "אחידות זו" מתייחסת אליהם. החשד הוא שהשבחים נובעים מיחסי ציבור, בניגוד לאיכות.'},
{id:'hs55',lvl:3,q:'מאחר שהמשאבים _____, הוועדה נאלצה _____ בין הפרויקטים ו_____ רק את אלה שתועלתם מוכחת.',o:['מוגבלים / לתעדף / לממן','שופעים / לתעדף / לממן','מוגבלים / לאחד / לבטל','שופעים / להפריד / לבטל'],a:0,e:'משאבים מוגבלים מחייבים לתעדף, ולכן מממנים רק את הפרויקטים המוכחים.'},
{id:'hs56',lvl:3,q:'לא זו בלבד שהטענה _____, _____ היא אף סותרת את הנתונים שהוצגו קודם לכן.',o:['אינה מבוססת / אלא','מבוססת / אלא','אינה מבוססת / ולכן','מבוססת / ולכן'],a:0,e:'המבנה "לא זו בלבד ש... אלא... אף" מוסיף טענה חמורה יותר באותו כיוון: הטענה אינה מבוססת, ויותר מזה סותרת את הנתונים.'}
);

LG.push(
{id:'lg33',lvl:3,q:'חמישה אנשים יושבים בשורה במקומות 1 עד 5 משמאל לימין: אבי, בתיה, גלעד, דנה והלל. בתיה יושבת בדיוק באמצע. אבי יושב משמאל לגלעד (לאו דווקא צמוד). דנה אינה יושבת ליד בתיה. הלל יושב באחד הקצוות. איזו מהטענות הבאות אינה יכולה להיות נכונה?',o:['אבי יושב בקצה השמאלי','גלעד יושב ליד בתיה','דנה יושבת באחד הקצוות','הלל יושב במקום 5'],a:0,e:'בתיה במקום 3, ודנה אינה במקומות 2 ו־4, ולכן היא בקצה. הלל בקצה השני. נשארו מקומות 2 ו־4 לאבי ולגלעד, ואבי משמאל, ולכן אבי במקום 2. אבי לעולם אינו בקצה.'},
{id:'lg34',lvl:3,q:'קוד בן ארבע ספרות מורכב מהספרות 1, 2, 3 ו־4, כל אחת פעם אחת. הספרה 1 אינה ראשונה. הספרות 2 ו־3 צמודות זו לזו. הספרה האחרונה זוגית. כמה קודים אפשריים?',o:['3','2','4','6'],a:0,e:'אם האחרונה 4: מסדרים 1, 2, 3 כך ש־1 אינה ראשונה ו־2, 3 צמודות: 2314 ו־3214. אם האחרונה 2: ה־3 חייבת להיות במקום השלישי, ו־1 אינה ראשונה: 4132. סך הכול 3.'},
{id:'lg35',lvl:3,q:'באחת משלוש קופסאות יש זהב. על קופסה א כתוב: "הזהב כאן". על קופסה ב כתוב: "הזהב אינו כאן". על קופסה ג כתוב: "הזהב אינו בקופסה א". רק אחת מהכתובות נכונה. היכן הזהב?',o:['בקופסה ב','בקופסה א','בקופסה ג','אי אפשר לדעת'],a:0,e:'אם בא: הכתובות על א ועל ב נכונות. אם בג: הכתובות על ב ועל ג נכונות. רק אם בב נכונה כתובת אחת בלבד, זו שעל ג.'},
{id:'lg36',lvl:3,q:'משה עובד בכל שבוע בדיוק שלושה ימים מתוך הימים ראשון עד חמישי, ולעולם אינו עובד ביומיים רצופים. באילו ימים הוא עובד?',o:['ראשון, שלישי וחמישי','ראשון, שני ורביעי','שני, רביעי וחמישי','אי אפשר לקבוע'],a:0,e:'בחמישה ימים, שלושה ימים שאינם רצופים מתאפשרים רק בדילוג מדויק: ראשון, שלישי וחמישי.'},
{id:'lg37',lvl:3,q:'הטיול יתקיים אלא אם כן יירד גשם. אם הטיול יתקיים, יוזמן אוטובוס. לא הוזמן אוטובוס. מה נובע בהכרח?',o:['ירד גשם','לא ירד גשם','הטיול התקיים','אי אפשר לדעת אם ירד גשם'],a:0,e:'"יתקיים אלא אם כן יירד גשם" פירושו: אם לא יירד גשם, הטיול יתקיים. לא הוזמן אוטובוס, ולכן הטיול לא התקיים, ולכן ירד גשם.'},
{id:'lg38',lvl:3,q:'בכיתה 30 תלמידים. 12 משחקים כדורגל, 10 משחקים כדורסל, ו־5 משחקים את שניהם. כמה תלמידים אינם משחקים אף אחד מהשניים?',o:['13','8','3','17'],a:0,e:'משחקים לפחות ענף אחד: 12 + 10 − 5 = 17. לכן 30 − 17 = 13 אינם משחקים.'}
);

{id:'sc71',lvl:3,q:'Her argument, though _____ at first glance, collapses under closer _____.',o:['persuasive / scrutiny','weak / scrutiny','persuasive / praise','obscure / neglect'],a:0,e:'though מסמן ניגוד: משכנע במבט ראשון, אך קורס כשבוחנים אותו מקרוב.'},
{id:'sc72',lvl:3,q:'Rather than being _____ by the setback, the team grew more _____ to succeed.',o:['discouraged / determined','encouraged / determined','discouraged / reluctant','delighted / hesitant'],a:0,e:'Rather than: במקום להתייאש מהכישלון, הצוות נעשה נחוש יותר.'},
{id:'sc73',lvl:3,q:'The historian warned that the diary, written decades after the events it describes, should be treated as a _____ source.',o:['questionable','definitive','contemporary','primary'],a:0,e:'יומן שנכתב עשרות שנים אחרי האירועים אינו בן זמנם, ולכן הוא מקור מפוקפק (questionable).'},

RS.push(
{id:'rs33',lvl:3,q:'Had the bridge been inspected regularly, the collapse might have been prevented.',o:['Regular inspections might have prevented the collapse, but they were not carried out.','The bridge collapsed although it had been inspected regularly.','The bridge was inspected regularly, so it did not collapse.','The collapse led to regular inspections of the bridge.'],a:0,e:'Had + past participle הוא תנאי שלא התקיים בעבר: לא בדקו את הגשר, והוא קרס.'},
{id:'rs34',lvl:3,q:'The rise in prices was caused not by higher demand but by a shortage of supply.',o:['Prices rose because supply was short, not because demand grew.','Higher demand and limited supply together raised prices.','Prices rose, which reduced both supply and demand.','A shortage of supply was caused by rising prices.'],a:0,e:'not X but Y: הסיבה היא המחסור בהיצע בלבד. האפשרות האחרונה הופכת את כיוון הסיבתיות, וזו מלכודת נפוצה.'},
{id:'rs35',lvl:3,q:'Scarcely had the minister finished speaking when protesters began to shout.',o:['The protesters began shouting almost as soon as the minister finished.','The protesters shouted before the minister began.','The minister spoke for a long time before the protest began.','The minister finished speaking because of the shouting.'],a:0,e:'Scarcely had... when פירושו "אך סיים, ומיד".'},
{id:'rs36',lvl:3,q:'The study, which was funded by the industry it examined, has been criticized for its lack of independence.',o:['The study was criticized because the industry it investigated paid for it.','The study criticized the industry that funded it.','The industry refused to fund an independent study.','The study proved that the industry is independent.'],a:0,e:'הביקורת היא על המחקר, ולא של המחקר. הסיבה: מימון מהתעשייה שנחקרה.'},
{id:'rs37',lvl:3,q:'It is not so much the cost of the project that worries residents as its impact on the environment.',o:['Residents are more concerned about the environmental impact than about the cost.','Residents worry about the cost more than about the environment.','Residents are not concerned about the project at all.','The project is cheap but harmful to the environment.'],a:0,e:'not so much X as Y פירושו "לא כל כך X אלא Y": הדאגה העיקרית היא הסביבה.'},
{id:'rs38',lvl:3,q:'The museum will remain open until the renovations, which are scheduled to begin next year, are under way.',o:['The museum will close once the renovations planned for next year begin.','The museum is currently closed for renovations.','The renovations began last year.','The museum will reopen after the renovations next year.'],a:0,e:'until... are under way: המוזיאון פתוח עד שהשיפוצים יתחילו בשנה הבאה, ואז ייסגר.'},
{id:'rs39',lvl:3,q:'Much as she admired his talent, she could not overlook his arrogance.',o:['Although she greatly admired his talent, she was bothered by his arrogance.','She admired him because of his arrogance.','She ignored his arrogance because of his talent.','She did not admire his talent.'],a:0,e:'Much as בתחילת משפט פירושו "ככל ש...", כלומר although. היא לא יכלה להתעלם מהיהירות.'},

READ.push(
{id:'rd_he11',lvl:3,lang:'he',title:'מפות והיטלים',
 text:'מפה נתפסת בדרך כלל כתמונה נאמנה של העולם, אך כל מפה היא בהכרח פשרה. פני כדור הארץ מעוגלים ואילו המפה שטוחה, ואי אפשר להעביר משטח כדורי אל דף שטוח בלי לעוות דבר מה: את השטחים, את הצורות, את המרחקים או את הכיוונים. משום כך כל שיטת שרטוט, המכונה "היטל", בוחרת מה לשמר ומה להקריב.\n\nההיטל המוכר ביותר פותח במאה ה־16 לצורכי ניווט ימי. יתרונו הגדול הוא שקו ישר במפה מייצג כיוון קבוע במצפן, וכך יכול נווט לסמן מסלול בסרגל ולשמור עליו לאורך כל ההפלגה. אולם המחיר הוא עיוות חמור של שטחים ככל שמתרחקים מקו המשווה: גרינלנד, למשל, נראית במפה זו כמעט בגודלה של אפריקה, אף שאפריקה גדולה ממנה פי ארבעה־עשר בקירוב.\n\nעיוות זה לא הטריד במיוחד כל עוד שימשה המפה את יורדי הים. הבעיה החלה כשהמפה עברה לכיתות הלימוד ולספרי האטלס, ונעשתה לדימוי המוכר של העולם בעיני מיליונים. מבקרים טענו שהמפה, המגדילה את האזורים הקרובים לקטבים ומקטינה את האזורים הקרובים למשווה, מעניקה חשיבות מופרזת לאזורים מסוימים על חשבון אחרים. בעקבות זאת הוצעו היטלים חלופיים השומרים על יחסי השטחים, אך גם הם אינם חפים מעיוותים: הם מותחים את צורות היבשות ומשבשים את הכיוונים.\n\nיש הרואים בוויכוח עדות לכך שמפות אינן כלי ניטרלי. אחרים משיבים שהוויכוח מלמד דבר אחר: לא על כוונה סמויה של יוצרי המפות, אלא על שימוש בכלי שלא למטרה שלשמה נוצר. לדבריהם, אין "מפה נכונה" אחת, ויש לבחור בכל פעם את ההיטל המתאים לשאלה שמבקשים לענות עליה.',
 qs:[
 {id:'rd_he11_1',q:'מדוע, לפי הפסקה הראשונה, כל מפה היא "פשרה"?',o:['משום שאי אפשר להעביר משטח כדורי לדף שטוח בלי לעוות דבר מה','משום ששרטוט מפות יקר','משום שיוצרי המפות מעדיפים אזורים מסוימים','משום שאין די מידע על פני כדור הארץ'],a:0,e:'הנימוק מופיע במפורש: מעבר ממשטח מעוגל לשטוח מחייב עיוות כלשהו.'},
 {id:'rd_he11_2',q:'מהו היתרון המרכזי של ההיטל שפותח במאה ה־16?',o:['קו ישר במפה מייצג כיוון קבוע במצפן','הוא שומר על יחסי השטחים','הוא מציג את צורות היבשות בלי עיוות','הוא מתאים במיוחד ללימוד בכיתות'],a:0,e:'היתרון קשור לניווט: אפשר לסמן מסלול בסרגל ולשמור על כיוון קבוע.'},
 {id:'rd_he11_3',q:'איזו מהטענות הבאות אינה נכונה לפי הקטע?',o:['ההיטלים החלופיים שומרים גם על יחסי השטחים וגם על הכיוונים','גרינלנד קטנה בהרבה מאפריקה','ההיטל המוכר מעוות שטחים ככל שמתרחקים מהמשווה','העיוות לא הטריד במיוחד את יורדי הים'],a:0,e:'לפי הקטע ההיטלים החלופיים "משבשים את הכיוונים". בשאלות "אינה נכונה" מחפשים את הפרט שסותר את הטקסט.'},
 {id:'rd_he11_4',q:'לפי הפסקה השלישית, מתי החל העיוות להיתפס כבעיה?',o:['כשהמפה נעשתה לדימוי הנפוץ של העולם בחינוך ובאטלסים','כשהתגלה שגרינלנד גדולה מאפריקה','כשנווטים החלו לטעות בדרכם','כשפותח ההיטל הראשון'],a:0,e:'"הבעיה החלה כשהמפה עברה לכיתות הלימוד ולספרי האטלס".'},

{id:'rd_en8',lvl:3,lang:'en',title:'The paradox of thrift',
 text:'In ordinary life, saving money is considered a virtue: a family that spends less than it earns builds security for the future. Yet some economists have argued that what is wise for a single household can be harmful when everyone does it at once. This idea, often called the "paradox of thrift," rests on a simple observation: one person\'s spending is another person\'s income. If, during an economic downturn, households throughout a country simultaneously cut their spending in order to save, businesses sell less, lay off workers, and pay out less in wages. Incomes then fall, and households may end up saving no more than before, or even less, while the economy as a whole has shrunk.\n\nCritics of the idea do not deny the arithmetic, but they question its practical importance. They point out that savings are not simply hidden under mattresses; deposited in banks, they are lent to businesses that use them to invest in new equipment and buildings, which in turn creates jobs. In the long run, they argue, higher savings lead to more investment and faster growth.\n\nMuch of the disagreement turns on timing. In a healthy economy, businesses are eager to borrow and invest, so increased saving is quickly put to use. In a deep recession, however, businesses may be reluctant to invest no matter how much money is available, because they doubt that customers will buy their products. Under such conditions, the warnings of the paradox of thrift appear far more relevant.',

/* FSRS-style scheduler (v4.5 default weights, 90% target retention) */
const W = [0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const DECAY = -0.5, FACTOR = 19/81, DAY = 86400000;
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const wkey = w => w[0].toLowerCase();
const initD = g => clamp(W[4] - (g-3)*W[5], 1, 10);
const retr = (t,s) => Math.pow(1 + FACTOR*t/s, DECAY);
/* card = [stability, difficulty, dueMs, lastMs, reps, lapses] */
function review(c, g, now){
  let s, d, reps, lapses;
  if(!c || c[4] === 0){
    s = W[g-1]; d = initD(g); reps = 1; lapses = 0;
  } else {
    const t = Math.max(0, (now - c[3]) / DAY);
    const r = retr(t, c[0]);
    d = clamp(W[7]*W[4] + (1-W[7])*(c[1] - W[6]*(g-3)), 1, 10);
    if(g === 1){
      s = W[11]*Math.pow(d,-W[12])*(Math.pow(c[0]+1,W[13])-1)*Math.exp((1-r)*W[14]);
      s = clamp(s, 0.1, c[0]);
      lapses = c[5] + 1;
    } else {
      const hard = g === 2 ? W[15] : 1, easy = g === 4 ? W[16] : 1;
      s = c[0]*(1 + Math.exp(W[8])*(11-d)*Math.pow(c[0],-W[9])*(Math.exp((1-r)*W[10])-1)*hard*easy);
      lapses = c[5];
    }
    reps = c[4] + 1;
  }
  const due = g === 1 ? now + 10*60000 : now + Math.max(1, Math.round(s))*DAY;
  return [s, d, due, now, reps, lapses];
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const ORDER = (function(){const r=mulberry(20261006);const a=WORDS.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const x=a[i];a[i]=a[j];a[j]=x;}return a;})();

(function(){
'use strict';

function dateKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function endOfToday(){const d=new Date();d.setHours(23,59,59,999);return d.getTime();}
function logToday(){const k=dateKey();if(!S.log[k])S.log[k]=[0,0,0,0,0];return S.log[k];}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){const o = JSON.parse(raw); if(o && o.cards) S = {cards:o.cards||{}, q:o.q||{}, log:o.log||{}, updatedAt:o.updatedAt||0};}
  }catch(e){}
}
function writeLocal(){try{localStorage.setItem(LS_KEY, JSON.stringify(S));}catch(e){}}
function pruneLog(){
  const keys = Object.keys(S.log).sort();
  while(keys.length > 120){delete S.log[keys.shift()];}
}

/* ---------- remote persistence (db capability, private per user) ---------- */
let dbRef = null, remoteTimer = null, writing = false, dirty = false;

  S.updatedAt = Date.now();
  pruneLog();
  writeLocal();
  queueRemote();
}
function queueRemote(){
  if(!dbRef) return;
  clearTimeout(remoteTimer);
  remoteTimer = setTimeout(flush, 800);
}
async function flush(){
  if(!dbRef) return;
  if(writing){dirty = true; return;}
  writing = true;
  try{
    await dbRef.set({v:1, cards:S.cards, q:S.q, log:S.log, updatedAt:S.updatedAt});
    syncState = 'cloud';

    syncState = 'local';

  if(dirty){dirty = false; queueRemote();}
  if(!session) renderFoot();
}
async function initRemote(){
  try{
    if(!window.claude || !window.claude.use) return;
    const got = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const db = got[0], user = got[1];
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    dbRef = db.doc('data/users/' + id + '/progress');

        queueRemote();

    if(!session) render();

/* ---------- helpers ---------- */
function h(tag, attrs){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v == null || v === false) continue;
    if(k === 'class') e.className = v;
    else if(k === 'text') e.textContent = v;
    else if(k === 'html') e.innerHTML = v;
    else if(k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for(let i = 2; i < arguments.length; i++){
    const kids = [].concat(arguments[i]);
    for(const c of kids){
      if(c == null || c === false) continue;
      e.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
  }
  return e;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=a[i];a[i]=a[j];a[j]=x;}return a;}
function fmtInterval(g, c, now){
  if(g === 1) return '10 דק׳';
  const n = review(c, g, now);
  const days = Math.max(1, Math.round((n[2]-now)/DAY));
  if(days < 30) return days + ' י׳';
  if(days < 365) return Math.round(days/30) + ' חו׳';
  return (days/365).toFixed(1) + ' ש׳';
}
function fmtTime(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function highlight(sentence, word){
  const stem = word.slice(0, Math.max(4, word.length-2));
  const m = new RegExp('\\b' + stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\w*', 'i').exec(sentence);
  if(!m) return [sentence];
  return [sentence.slice(0,m.index), h('mark',{text:m[0]}), sentence.slice(m.index + m[0].length)];
}

/* ---------- stats ---------- */
function wordStats(){
  const now = Date.now(), eod = endOfToday();
  let learned = 0, mature = 0, due = 0, rsum = 0;
  for(const w of WORDS){
    const c = S.cards[wkey(w)];
    if(c && c[4] > 0){
      learned++;
      if(c[0] >= 21) mature++;
      if(c[2] <= eod) due++;
      rsum += retr(Math.max(0,(now-c[3])/DAY), c[0]);
    }
  }
  return {learned, mature, due, avgR: learned ? rsum/learned : null};
}
function streak(){
  let n = 0; const d = new Date();
  const act = k => { const l = S.log[k]; return l && (l[0] + l[3]) > 0; };
  if(!act(dateKey(d))) d.setDate(d.getDate()-1);
  while(act(dateKey(d))){n++; d.setDate(d.getDate()-1);}

  let seen = 0, ok = 0;
  for(const x of bank){const s = S.q[x.id]; if(s){seen += s[0]; ok += s[1];}}

}

    h('div',{class:'lvl'},h('span',{class:'num',text:'רמה ' + lvl}),h('div',{class:'meter'},h('i',{style:'width:' + (st.learned % 10)*10 + '%'})),h('span',{class:'num',text:(st.learned % 10) + '/10'})),

    return h('button',{class:'btn',onclick:()=>startQuiz(k)}, h('span',{class:'deco',html:cardDeco(i)}), h('span',{class:'t',text:c.label}), h('span',{class:'d',text:d}));
  };
  const launch = h('div',{class:'stack'},
    h('div',{},h('h2',{text:'אנגלית'}),h('div',{class:'launch'},['sc','rs','re'].map(mkBtn))),
    h('div',{},h('h2',{text:'חשיבה מילולית בעברית'}),h('div',{class:'launch'},['hv','an','hs','hi','lg','rh'].map(mkBtn))));

  const course = h('a',{class:'card course',href:'https://campus.gov.il/course/mse-gov-psychometry-he',target:'_blank',rel:'noopener'},
    h('div',{class:'ct'},'הקורס החינמי של קמפוס IL ↗'),
    h('div',{class:'sub'},'מבחני עבר וסימולציות רשמיות. מומלץ: סימולציה מלאה פעם בשבוע בקורס, ותרגול יומי קצר כאן.'));
  const hardRow = h('button',{class:'card hard-toggle','aria-pressed':String(HARD),onclick:()=>{HARD = !HARD; try{localStorage.setItem('amirnet-hard', HARD ? '1' : '0');}catch(e){} render();}},
    h('span',{class:'sw-box'},h('i')),
    h('span',{},h('span',{class:'ct',text:'מצב מתקדם'}),h('span',{class:'sub',text: HARD ? ' · מוצגות רק שאלות ברמה גבוהה' : ' · כבוי: שאלות קשות יעלו אוטומטית כשתגיע ל־70% דיוק'})));
  const stats = h('section',{class:'card'},
    h('h2',{text:'המילים שלך'}),
    h('div',{class:'grid4'},
      h('div',{class:'stat'},h('div',{class:'v',text: st.learned + '/' + WORDS.length}),h('div',{class:'k',text:'מילים שנלמדו'})),
      h('div',{class:'stat'},h('div',{class:'v',text: String(st.mature)}),h('div',{class:'k',text:'מילים יציבות'})),
      h('div',{class:'stat'},h('div',{class:'v',text: st.avgR == null ? '—' : Math.round(st.avgR*100) + '%'}),h('div',{class:'k',text:'זכירה משוערת כעת'})),
      h('div',{class:'stat'},h('div',{class:'v',text: String(sk)}),h('div',{class:'k',text:'ימים ברצף'}))
    )
  );

  const act = h('section',{class:'card'},
    h('h2',{text:'פעילות ב־14 הימים האחרונים'}),
    h('div',{class:'bars',role:'img','aria-label':'פעילות יומית'}, days.map((d,i)=>h('div',{class:'bar' + (i === days.length-1 ? ' today' : ''), style:'height:' + Math.max(3, Math.round(d.n/maxN*100)) + '%', title: d.k + ': ' + d.n}))),
    h('div',{class:'bar-labels'}, days.map(d=>h('span',{text:d.wd})))
  );

  const row = (name, a) => h('div',{class:'acc-row'},
    h('div',{class:'head'},h('span',{text:name}),h('span',{class:'num',text: a.seen ? Math.round(a.ok/a.seen*100) + '% · ' + a.seen + ' תשובות' : 'עוד לא התחלת'})),
    h('div',{class:'meter'},h('i',{style:'width:' + (a.seen ? Math.round(a.ok/a.seen*100) : 0) + '%'})));
  const acc = h('section',{class:'card'},
    h('h2',{text:'דיוק בתרגול שאלות'}),
    h('div',{class:'acc'}, Object.keys(QUIZ).map(k => row(QUIZ[k].label, accFor(bankQs(QUIZ[k]))))));
  const backup = h('section',{class:'card'},
    h('h2',{text:'גיבוי ההתקדמות'}),
    h('div',{class:'sub',text:'ההתקדמות נשמרת רק בטלפון הזה. כדאי לשמור גיבוי פעם בשבוע, או לפני החלפת מכשיר.'}),
    h('div',{class:'bk'},
      h('button',{class:'btn btn-primary',onclick:exportData},'שמירת גיבוי'),
      h('label',{class:'btn btn-ghost'},'שחזור מגיבוי',h('input',{type:'file',accept:'application/json,.json',hidden:true,onchange:e=>{const f=e.target.files[0]; if(f) importData(f);}}))),
    h('div',{class:'sub',id:'bkmsg'}));
  const foot = h('p',{class:'foot',id:'foot'});
  const node = h('div',{class:'app-inner',style:'display:contents'},
    h('header',{class:'top'},
      h('div',{},h('h1',{text:'מאמן אמירנט'}),h('div',{class:'sub',text:'אנגלית וחשיבה מילולית בעברית · חזרות מרווחות'})),
      sk ? h('span',{class:'chip num',text:'רצף ' + sk}) : null),
    hero, course, hardRow, launch, stats, act, acc, backup, foot);
  setTimeout(renderFoot, 0);
  return node;
}
function renderFoot(){
  const f = document.getElementById('foot');
  if(!f) return;
  f.textContent = (syncState === 'cloud' ? 'ההתקדמות נשמרת בחשבון שלך ומסונכרנת בין מכשירים. ' : 'ההתקדמות נשמרת במכשיר הזה בלבד. ') +
    'המילים והשאלות כאן נכתבו עבור האפליקציה ואינן בחינות רשמיות. מומלץ לשלב גם את הקורס החינמי של קמפוס IL ובחינות רשמיות של מאל״ו.';
}

/* ---------- word session ---------- */
function startWords(extra){
  const eod = endOfToday();
  const l = logToday();
  const due = WORDS.filter(w => {const c = S.cards[wkey(w)]; return c && c[4] > 0 && c[2] <= eod;})
    .sort((a,b) => S.cards[wkey(a)][2] - S.cards[wkey(b)][2]).slice(0,30);
  const newCount = extra ? 10 : Math.max(0, NEW_PER_DAY - l[2]);
  const fresh = ORDER.map(i => WORDS[i]).filter(w => {const c = S.cards[wkey(w)]; return !c || c[4] === 0;}).slice(0, newCount);
  const queue = due.concat(fresh);
  if(!queue.length) return;
  go({kind:'words', queue, total: queue.length, done: 0, revealed: false, reviews: 0, good: 0, finished: false});
}
function wordView(){
  const s = session;
  const top = h('div',{class:'sess-top'},
    h('button',{class:'icon-btn',onclick:()=>go(null)},'יציאה'),
    h('div',{class:'prog'},
      h('div',{class:'cnt num'},h('span',{text:'מילים'}),h('span',{text: s.done + ' / ' + s.total})),
      h('div',{class:'meter'},h('i',{style:'width:' + Math.round(s.done/s.total*100) + '%'}))));
  if(s.finished || !s.queue.length){
    return h('div',{class:'stack',style:'display:contents'}, top,
      h('section',{class:'card flash'},
        h('div',{class:'score',text: String(s.reviews)}),
        h('div',{class:'he',text:'סיבובי חזרה הושלמו'}),
        h('div',{class:'sub num',text: s.reviews ? Math.round(s.good/s.reviews*100) + '% מהתשובות לא סומנו כ״שוב״' : ''})),
      h('button',{class:'btn btn-primary',onclick:()=>go(null)},'חזרה לדף הבית'));
  }
  const w = s.queue[0];
  const k = wkey(w);
  const c = S.cards[k];
  const isNew = !c || c[4] === 0;
  const card = h('section',{class:'card flash'},
    h('div',{class:'fdeco',html: flashDeco(w[0].length)}),
    isNew ? h('span',{class:'tag new',text:'חדשה'}) : h('span',{class:'tag',text:'חזרה'}),
    h('div',{class:'word en',text:w[0]}),
    h('button',{class:'icon-btn speak','aria-label':'השמעת המילה',onclick:()=>speak(w[0])},'השמעה'));
  if(!s.revealed){
    return h('div',{style:'display:contents'}, top, card, h('button',{class:'btn btn-primary',onclick:()=>{s.revealed = true; render();}},'הצג תשובה'));
  }
  card.append(
    h('div',{class:'he',text:w[1]}),
    h('div',{class:'ex en'}, highlight(w[2], w[0])));
  const now = Date.now();
  const labels = [['שוב',1],['קשה',2],['טוב',3],['קל',4]];
  const rates = h('div',{class:'rates'}, labels.map(p => h('button',{class:'rate r' + p[1],onclick:()=>rate(p[1])},
    h('b',{text:p[0]}), h('span',{class:'num',text: fmtInterval(p[1], c, now)}))));
  return h('div',{style:'display:contents'}, top, card, rates);
}
function rate(g){
  const s = session; if(!s || !s.revealed) return;
  const w = s.queue.shift();
  const k = wkey(w);
  const prev = S.cards[k];
  const isNew = !prev || prev[4] === 0;
  S.cards[k] = review(prev, g, Date.now());
  const l = logToday();
  l[0]++; if(g >= 2) l[1]++; if(isNew) l[2]++;
  s.reviews++; if(g >= 2) s.good++;
  if(g === 1) s.queue.splice(Math.min(3, s.queue.length), 0, w); else s.done++;
  s.revealed = false;
  if(!s.queue.length) s.finished = true;
  save();
  render();
}
document.addEventListener('keydown', e => {
  if(session && session.kind === 'words' && session.revealed && '1234'.indexOf(e.key) >= 0 && e.key.length === 1) rate(+e.key);
});

/* ---------- question sets ---------- */
const READ_EN = READ.filter(p => p.lang === 'en'), READ_HE = READ.filter(p => p.lang === 'he');
const QUIZ = {
  sc:{label:'השלמת משפטים', bank:SC, n:6, target:330, lang:'en', blank:true, inst:'בחרו את ההשלמה המתאימה ביותר למשפט.'},
  rs:{label:'ניסוח מחדש', bank:RS, n:3, target:360, lang:'en', inst:'בחרו את המשפט שמבטא את אותה משמעות כמו המשפט המקורי.'},
  re:{label:'הבנת הנקרא באנגלית', bank:READ_EN, reading:true, target:480, lang:'en', inst:'ענו על השאלה לפי הכתוב בקטע.'},
  hv:{label:'מילים וביטויים', bank:HV, n:10, target:240, lang:'he', inst:'בחרו את המילה או הביטוי הקרובים ביותר במשמעותם לפריט שבשאלה.'},
  an:{label:'אנלוגיות', bank:AN, n:8, target:240, lang:'he', inst:'בחרו את זוג המילים שהיחס ביניהן דומה ליחס בין שתי המילים בשאלה.'},
  hs:{label:'השלמת משפטים בעברית', bank:HSC, n:4, target:240, lang:'he', blank:true, inst:'בחרו את המילה המתאימה ביותר להשלמת המשפט.'},
  hi:{label:'הבנה והסקה', bank:HI, n:4, target:360, lang:'he', inst:'קראו את הנתונים ובחרו את התשובה המתאימה ביותר.'},
  lg:{label:'היגיון', bank:LG, n:4, target:360, lang:'he', inst:'ענו לפי מה שנובע מהנתונים בלבד.'},
  rh:{label:'הבנת הנקרא בעברית', bank:READ_HE, reading:true, target:480, lang:'he', inst:'ענו על השאלה לפי הכתוב בקטע.'}
};
function bankQs(cfg){return cfg.reading ? cfg.bank.reduce((a,p) => a.concat(p.qs), []) : cfg.bank;}
let HARD = false;
try{ HARD = localStorage.getItem('amirnet-hard') === '1'; }catch(e){}
function wantHard(qs){
  if(HARD) return true;
  let seen = 0, ok = 0;
  for(const x of qs){ const s = S.q[x.id]; if(s){ seen += s[0]; ok += s[1]; } }
  return seen >= 8 && ok / seen >= 0.7;
}
function pickQuestions(bank, n){
  const hard = wantHard(bank);
  const hardCount = bank.filter(x => x.lvl === 3).length;
  if(HARD && hardCount >= n) bank = bank.filter(x => x.lvl === 3);
  const items = bank.map(x => {
    const st = S.q[x.id];
    let p; if(!st) p = 0; else if(!st[2]) p = 1; else p = 2 + st[0];
    return {x, p: p + Math.random()*0.9 + (hard && x.lvl !== 3 ? 0.8 : 0)};
  });
  items.sort((a,b) => a.p - b.p);
  return items.slice(0, n).map(i => i.x);
}
function startQuiz(kind){
  const cfg = QUIZ[kind];
  let qs, passage = null;
  if(cfg.reading){
    const hardR = wantHard(bankQs(cfg));
    const pool = (HARD && cfg.bank.some(p => p.lvl === 3)) ? cfg.bank.filter(p => p.lvl === 3) : cfg.bank;
    const ranked = pool.map(p => ({p, v: p.qs.reduce((t,q) => t + (S.q[q.id] ? S.q[q.id][0] : 0), 0) + Math.random()*0.9 + (hardR && p.lvl !== 3 ? 0.8 : 0)}));
    ranked.sort((a,b) => a.v - b.v);
    passage = ranked[0].p; qs = passage.qs;
  } else {
    qs = pickQuestions(cfg.bank, cfg.n);
  }
  const items = qs.map(q => ({q, opts: shuffle(q.o.map((t,i) => ({t, ok: i === q.a})))}));
  go({kind, cfg, passage, items, i: 0, picked: null, answers: [], start: Date.now(), done: false, end: 0});
  timerId = setInterval(tick, 1000);
}
function tick(){
  const el = document.getElementById('timer');
  if(!el || !session || session.done){stopTimer(); return;}
  const ms = Date.now() - session.start;
  el.textContent = fmtTime(ms) + ' / ' + fmtTime(session.cfg.target*1000);
  el.classList.toggle('over', ms > session.cfg.target*1000);
}
function quizView(){
  const s = session;
  const heb = s.cfg.lang === 'he';
  const lc = heb ? 'heb' : 'en';
  const it = s.items[s.i];
  const answered = s.picked != null;
  const ms = Date.now() - s.start;
  const top = h('div',{class:'sess-top'},
    h('button',{class:'icon-btn',onclick:()=>go(null)},'יציאה'),
    h('div',{class:'prog'},
      h('div',{class:'cnt num'},h('span',{text: s.cfg.label + ' · ' + (s.i+1) + ' מתוך ' + s.items.length}),
        h('span',{id:'timer',dir:'ltr',class:'timer' + (ms > s.cfg.target*1000 ? ' over' : ''),text: fmtTime(ms) + ' / ' + fmtTime(s.cfg.target*1000)})),
      h('div',{class:'meter'},h('i',{style:'width:' + Math.round(s.i/s.items.length*100) + '%'}))));

  let qBody;
  if(s.cfg.blank){
    const parts = it.q.q.split('_____');
    const fills = it.q.o[it.q.a].split(' / ');
    const seg = [];
    parts.forEach((p, i) => {
      seg.push(p);
      if(i < parts.length - 1) seg.push(h('span',{class:'blank' + (answered ? ' ok' : ''),text: answered ? (fills[i] || fills[0]) : '\u00a0'}));
    });
    qBody = h('div',{class:'text ' + lc + (it.q.q.length > 140 ? ' long' : '')}, seg);
  } else {
    qBody = h('div',{class:'text ' + lc + (it.q.q.length > 140 ? ' long' : ''),text: it.q.q});
  }
  const lvl3 = it.q.lvl === 3 || (s.passage && s.passage.lvl === 3);
  const qCard = h('section',{class:'card q'}, h('div',{class:'inst'}, lvl3 ? h('span',{class:'tag new',text:'רמה גבוהה'}) : null, ' ' + s.cfg.inst), qBody);

  const opts = h('div',{class:'opts'}, it.opts.map((o,idx) => {
    let cls = 'opt ' + lc;
    if(answered){
      if(o.ok) cls += ' ok'; else if(idx === s.picked) cls += ' no'; else cls += ' dim';
    }
    return h('button',{class:cls, disabled: answered, onclick:()=>pick(idx)}, o.t);
  }));

  const kids = [top];
  if(s.passage){
    kids.push(h('section',{class:'card q'},
      h('div',{class:'inst',text:'קטע: ' + s.passage.title}),
      h('div',{class:'passage ' + lc,text:s.passage.text})));
  }
  kids.push(qCard, opts);
  if(answered){
    const good = it.opts[s.picked].ok;
    const last = s.i === s.items.length - 1;
    kids.push(h('div',{class:'fb ' + (good ? 'ok' : 'no')},
      h('div',{class:'h'}, good ? 'נכון' : ['לא נכון. התשובה הנכונה: ', h('bdi',{text: it.q.o[it.q.a]})]),
      h('div',{text: it.q.e})));
    kids.push(h('button',{class:'btn btn-primary',onclick: last ? finishQuiz : nextQ}, last ? 'סיום הסט' : 'השאלה הבאה'));
  }
  return h('div',{style:'display:contents'}, kids);
}
function pick(idx){
  const s = session; if(!s || s.picked != null) return;
  const it = s.items[s.i];
  const ok = it.opts[idx].ok;
  s.picked = idx;
  s.answers.push({it, ok});
  const st = S.q[it.q.id] || [0,0,0,0];
  st[0]++; if(ok) st[1]++; st[2] = ok ? 1 : 0; st[3] = Date.now();
  S.q[it.q.id] = st;
  const l = logToday(); l[3]++; if(ok) l[4]++;
  save();
  render();
}
function nextQ(){session.i++; session.picked = null; render(); window.scrollTo(0,0);}
function finishQuiz(){stopTimer(); session.done = true; session.end = Date.now(); render(); window.scrollTo(0,0);}
function filled(q){
  const parts = q.q.split('_____');
  const fills = q.o[q.a].split(' / ');
  return parts.map((p, i) => p + (i < parts.length - 1 ? '[' + (fills[i] || fills[0]) + ']' : '')).join('');
}
function resultView(){
  const s = session;
  const lc = s.cfg.lang === 'he' ? 'heb' : 'en';
  const ok = s.answers.filter(a => a.ok).length;
  const ms = s.end - s.start;
  const missed = s.answers.filter(a => !a.ok);
  const kids = [
    h('div',{class:'sess-top'},h('button',{class:'icon-btn',onclick:()=>go(null)},'דף הבית')),
    h('section',{class:'card flash'},
      h('div',{class:'sub',text: s.cfg.label}),
      h('div',{class:'score',text: ok + '/' + s.items.length}),
      h('div',{class:'sub num',text:'זמן: ' + fmtTime(ms) + ' (יעד: ' + fmtTime(s.cfg.target*1000) + ')'}))
  ];
  if(missed.length){
    kids.push(h('section',{class:'card'},
      h('h2',{text:'לחזור על הטעויות'}),
      missed.map(a => h('div',{class:'miss'},
        h('div',{class:'s ' + lc,text: filled(a.it.q) + (s.cfg.blank ? '' : '  ←  ' + a.it.q.o[a.it.q.a])}),
        h('div',{class:'sub',text: a.it.q.e})))));
  } else {
    kids.push(h('section',{class:'card'},h('div',{text:'כל התשובות נכונות. הסט הבא יכלול שאלות שפחות ראית.'})));
  }
  kids.push(h('button',{class:'btn btn-primary',onclick:()=>startQuiz(s.kind)},'סט נוסף'));
  return h('div',{style:'display:contents'}, kids);
}

/* ---------- backup ---------- */
function bkMsg(s){const el=document.getElementById('bkmsg'); if(el) el.textContent=s;}
async function exportData(){
  const name='amirnet-backup-' + dateKey() + '.json';
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'גיבוי מאמן אמירנט'}); bkMsg('הגיבוי נשמר.'); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); a.remove();
  bkMsg('הגיבוי ירד לקובץ ' + name);
}
function importData(file){
  file.text().then(tx => {
    const o=JSON.parse(tx);
    if(!o || typeof o.cards!=='object') throw new Error('bad');
    S={cards:o.cards||{}, q:o.q||{}, log:o.log||{}, updatedAt:Date.now()};
    writeLocal(); render(); bkMsg('ההתקדמות שוחזרה מהגיבוי.');
  }).catch(() => bkMsg('הקובץ אינו גיבוי תקין של האפליקציה.'));
}

/* ---------- boot ---------- */
loadLocal();
render();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator){ window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }
})();
