<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מאמן אמירנט</title>
<meta name="theme-color" content="#FBF6EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="אמירנט">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Ink look: cream paper, thick black outlines, line-art flourishes. One committed single-theme design. */
:root{
  --bg:#FBF6EE; --surface:#FBF6EE; --surface-2:#EFE6D6; --fg:#111111; --muted:#4A443C; --line:#111111;
  --accent:#111111; --accent-fg:#FBF6EE; --good:#1F6B3A; --good-bg:#DCEBD2; --bad:#A8281E; --bad-bg:#F7DCD2; --warn:#7A4B00; --bar:#CFC5B3;
  --hero-bg:#FBF6EE; --hero-fg:#111111; --hero-btn-bg:#111111; --hero-btn-fg:#FBF6EE; --hero-track:#EFE6D6; --hero-fill:#111111; --hero-mb:2.5px solid #111111;
  --cta-bg:#111111; --cta-fg:#FBF6EE;
  --lc1:#FBF6EE; --lf1:#111111; --lc2:#FBF6EE; --lf2:#111111; --lc3:#FBF6EE; --lf3:#111111; --lc4:#FBF6EE; --lf4:#111111;
  --radius:26px; --opt-r:20px; --btn-r:999px; --bw:2.5px; --bc:#111111; --shadow:none;
  --ui:'Rubik','Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --en:'Rubik','Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --display:'Rubik','Heebo',system-ui,sans-serif; --dw:700; --hw:700;
  color-scheme:light;
}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--ui)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.4rem;line-height:1.2;margin:0;font-weight:var(--hw)}
h2{font-size:.8rem;margin:0 0 10px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.sub{color:var(--muted);font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:var(--bw) solid var(--bc);box-shadow:var(--shadow);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:500;white-space:nowrap}
.card{background:var(--surface);border:var(--bw) solid var(--bc);box-shadow:var(--shadow);border-radius:var(--radius);padding:16px;min-width:0}
.hero{position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-fg);border:var(--bw) solid var(--bc);border-radius:var(--radius);padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.hero>*{position:relative}
.hero>.deco{position:absolute;inset-inline-end:6px;top:6px;display:flex;pointer-events:none}
.hero .big{font:var(--dw) 4.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.hero .lbl{font-weight:700}
.hero .meta{opacity:.92;font-size:.9rem}
.lvl{display:flex;align-items:center;gap:10px;font-size:.85rem;font-weight:700}
.lvl .meter{flex:1;height:12px;background:var(--hero-track);border:var(--hero-mb)}
.lvl .meter i{background:var(--hero-fill)}
.btn{min-height:48px;border-radius:var(--btn-r);border:1px solid transparent;font-weight:700;padding:10px 16px;cursor:pointer;text-align:center}
.btn:focus-visible,.opt:focus-visible,.rate:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.hero .btn{background:var(--hero-btn-bg);color:var(--hero-btn-fg)}
.btn-primary{background:var(--cta-bg);color:var(--cta-fg)}
.btn-ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.launch{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.launch .btn{position:relative;overflow:hidden;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:2px;text-align:start;padding:14px 16px;border-radius:var(--radius);border:var(--bw) solid var(--bc);box-shadow:var(--shadow)}
.launch .btn:nth-child(4n+1){background:var(--lc1);color:var(--lf1)}
.launch .btn:nth-child(4n+2){background:var(--lc2);color:var(--lf2)}
.launch .btn:nth-child(4n+3){background:var(--lc3);color:var(--lf3)}
.launch .btn:nth-child(4n+4){background:var(--lc4);color:var(--lf4)}
.launch .btn .deco{position:absolute;inset-inline-end:10px;top:8px;pointer-events:none;display:flex}
.launch .t{font-weight:700;font-size:1.02rem;max-width:calc(100% - 30px)}
.launch .btn:last-child:nth-child(odd){grid-column:1/-1}
.launch .btn:last-child:nth-child(odd) .t{max-width:none}
.launch .d{font-weight:400;opacity:.78;font-size:.85rem}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px 12px}
.stat .v{font:var(--dw) 2rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat .k{color:var(--muted);font-size:.8rem}
.bars{display:flex;align-items:flex-end;gap:5px;height:72px}
.bar{flex:1;min-width:0;background:var(--bar);border-radius:4px 4px 2px 2px;min-height:3px}
.bar.today{background:var(--accent)}
.bar-labels{display:flex;gap:5px;margin-top:6px}
.bar-labels span{flex:1;min-width:0;text-align:center;font-size:.7rem;color:var(--muted)}
.acc{display:flex;flex-direction:column;gap:12px}
.acc-row .head{display:flex;justify-content:space-between;gap:12px;font-size:.9rem;margin-bottom:4px}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter{border:2px solid #111;height:12px;background:#FBF6EE}
.prog .meter{height:10px}
.course{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--fg)}
.course .ct{font-weight:700}
.q .text.long{font-size:1.08rem;line-height:1.8}
.passage{white-space:pre-line}
.hard-toggle{display:flex;align-items:center;gap:12px;text-align:start;cursor:pointer;font:inherit;color:var(--fg);width:100%}
.hard-toggle .ct{font-weight:700}
.sw-box{flex:none;width:46px;height:28px;border-radius:99px;border:2.5px solid #111;background:var(--surface);position:relative}
.sw-box i{position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:#111;transition:inset-inline-start .2s}
.hard-toggle[aria-pressed="true"] .sw-box{background:#111}
.hard-toggle[aria-pressed="true"] .sw-box i{background:var(--surface);inset-inline-start:21px}
.inst .tag{margin-inline-end:6px}
.vrow{display:flex;gap:8px;margin-bottom:8px}
.vsel{flex:1;min-width:0;min-height:44px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;padding:0 10px}
.m{font-family:var(--en);font-weight:600;white-space:nowrap;unicode-bidi:isolate}
.mathq{font-size:1.2rem}
.fig{display:flex;justify-content:center;margin-top:12px}
.fg{width:100%;max-width:300px;height:auto}
.fg polygon,.fg rect,.fg circle,.fg line,.fg path{fill:none;stroke:#111;stroke-width:2.5;stroke-linejoin:round}
.fg .thin{stroke-width:1.6}
.fg .dot{fill:#111}
.fg .shade{fill:#CFC5B3}
.fg .paper{fill:#FBF6EE}
.fg text{font:600 15px var(--en);fill:#111;stroke:none}
.fg .sm{font-size:18px}
.tblwrap{overflow-x:auto;margin-bottom:12px}
.qt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.qt th,.qt td{border:2px solid #111;padding:6px 10px;text-align:center}
.qt th{background:var(--surface-2)}
.hero-sub{display:flex;gap:8px;flex-wrap:wrap}
.mini{flex:1;min-height:40px;border-radius:999px;border:2px solid #111;background:transparent;color:#111;font-weight:500;cursor:pointer;padding:0 12px}
.mini[disabled]{opacity:.45;cursor:default}
.foot{color:var(--muted);font-size:.8rem;line-height:1.6}

.sess-top{display:flex;align-items:center;gap:12px}
.icon-btn{min-height:44px;min-width:44px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;padding:0 14px}
.prog{flex:1;min-width:0}
.prog .meter{height:6px}
.prog .cnt{font-size:.8rem;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between}
.en{font-family:var(--en);font-weight:500;direction:ltr;text-align:left;unicode-bidi:isolate}
.flash{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px 18px}
.fdeco{display:flex;justify-content:center;min-height:0}
.flash .word{font-size:2.6rem;line-height:1.15;text-align:center;overflow-wrap:anywhere;font-weight:600}
.flash .he{font-size:1.7rem;font-weight:700}
.flash .ex{font-size:1.15rem;line-height:1.5;color:var(--fg);text-align:left;width:100%;padding-top:14px;border-top:2px solid var(--line)}
.flash mark{background:none;color:var(--fg);font-weight:600;text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--accent);text-underline-offset:4px}
.tag{font-size:.75rem;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--surface-2);color:var(--muted)}
.tag.new{background:var(--accent);color:var(--accent-fg)}
.speak{min-height:44px;min-width:44px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{min-height:64px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px}
.rate b{font-size:.95rem}
.rate span{font-size:.75rem;color:var(--muted)}
.r1{border-bottom-color:var(--bad)}.r2{border-bottom-color:var(--warn)}.r3{border-bottom-color:var(--accent)}.r4{border-bottom-color:var(--good)}

.q{padding:18px}
.q .inst{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.q .text{font-size:1.35rem;line-height:1.6}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--fg);text-align:center;margin-inline:2px;line-height:1.1}
.blank.ok{border-bottom-color:var(--good);color:var(--good)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:52px;width:100%;border-radius:var(--opt-r);border:2px solid var(--line);background:var(--surface);padding:10px 14px;cursor:pointer;font-size:1.1rem;line-height:1.45;direction:ltr;text-align:left}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.6}
.opt[disabled]{cursor:default}
.fb{border-radius:var(--opt-r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-bg)}.fb.no{background:var(--bad-bg)}
.fb .h{font-weight:700}
.fb.ok .h{color:var(--good)}.fb.no .h{color:var(--bad)}
.timer{font-variant-numeric:tabular-nums;font-weight:500}
.timer.over{color:var(--bad)}
.score{font:var(--dw) 3.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.miss{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-top:2px solid var(--line)}
.miss:first-of-type{border-top:0}
.miss .s{font-size:1.05rem;line-height:1.55}
.stack{display:flex;flex-direction:column;gap:18px}
.heb{direction:rtl;text-align:right;font-family:var(--ui);font-weight:500}
.q .text.heb{font-size:1.3rem;line-height:1.7}
.opt.heb{direction:rtl;text-align:right;font-family:var(--ui);font-size:1.05rem}
.passage{font-size:1.05rem;line-height:1.8;overflow-wrap:anywhere}
.passage.en{font-size:1.1rem}
.miss .s.heb{font-weight:400}
@media (prefers-reduced-motion:no-preference){.bar,.meter i{transition:height .3s,width .3s}}
.ptitle{font-weight:700;font-size:1.05rem;line-height:1.2}
.plist{display:flex;flex-direction:column;gap:12px}
.pexam{padding:14px}
.pex-t{font-weight:700;margin-bottom:10px}
.pchs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pch{min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;font:inherit}
.pch .k{font-size:.8rem;font-weight:500}
.pch .v{font-size:.95rem;font-weight:700}
.pch.done{background:var(--surface-2)}
.pxdraft,.pxhist{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:start;font:inherit;color:var(--fg);cursor:pointer;width:100%}
.pxhist{background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 0;min-height:44px}
.pxsheet{display:flex;flex-direction:column;gap:6px;padding:12px}
.pxrow{display:flex;align-items:center;gap:10px}
.pxn{width:2ch;text-align:center;font-weight:700}
.pxopts{display:flex;gap:8px;flex:1}
.pxb,.pxf{min-width:44px;min-height:44px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:600;cursor:pointer;flex:1;max-width:64px}
.pxb.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pxf{flex:0 0 44px;opacity:.55}
.pxf.on{opacity:1;background:var(--surface-2);border-color:var(--fg)}
.pxwarn{font-weight:500}
.pxkey{width:100%;box-sizing:border-box;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:1.1rem;letter-spacing:.12em;padding:0 12px;margin-block:12px 6px}
.pxsum .big{font-size:2.6rem;font-weight:700}
.pxres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pxr{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;border:1.5px solid var(--line);font-size:.9rem}
.pxr.bad{border-color:var(--bad);color:var(--bad)}
.bk{display:flex;gap:10px;flex-wrap:wrap;margin-block:12px 6px}
.bk .btn{flex:1;min-width:140px;display:inline-flex;align-items:center;justify-content:center}
.pxtag{margin-inline-start:auto;font-weight:700}

/* hub navigation */
.ttl{min-width:0}
.top .back{flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ico{display:inline-flex;flex:none}
.hero .hrow{display:flex;align-items:baseline;gap:10px}
.hero .hrow .big{font-size:3.4rem}
.hero>.deco svg{width:84px;height:auto}
.hero .hrow .meta{font-weight:500}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:start;min-height:138px;padding:14px;border-radius:22px;border:var(--bw) solid var(--bc);background:var(--surface);color:var(--fg);cursor:pointer;font:inherit;min-width:0}
.tile:active{transform:translateY(1px)}
.tile[disabled]{opacity:.5;cursor:default}
.tile .trow{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:auto;padding-bottom:10px}
.tile .tpct{font-size:.85rem;font-weight:700}
.tile .tt{font-weight:700;font-size:1.05rem;line-height:1.25}
.tile .td{font-size:.78rem;color:var(--muted);line-height:1.35}
.tmeter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.tmeter i{display:block;height:100%;background:var(--fg);border-radius:99px}
.tile:focus-visible,.prow:focus-visible,.feat:focus-visible,.tab:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.feat{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;padding:18px;border-radius:var(--radius);border:var(--bw) solid var(--bc);background:var(--fg);color:var(--bg);cursor:pointer;font:inherit;width:100%}
.feat .lbl{font-size:.8rem;font-weight:500;opacity:.8}
.feat .ft{font-size:1.25rem;font-weight:700}
.feat .meta{font-size:.85rem;opacity:.85}
.feat .fbtn{margin-top:10px;background:var(--bg);color:var(--fg);border-radius:999px;padding:8px 18px;font-weight:700}
.plist2{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 14px 12px 12px;border-radius:18px;border:var(--bw) solid var(--bc);background:var(--surface);color:var(--fg);cursor:pointer;font:inherit;text-align:start;width:100%}
.prow .pt{flex:1;min-width:0}
.prow .pl{font-weight:500;font-size:1rem}
.prow .pm{font-size:.78rem;color:var(--muted)}
.prow .pa{font-size:.85rem;font-weight:700}
.app:has(.tabbar){padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:6px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:var(--bw) solid var(--bc)}
.tab{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;padding:6px 4px;border:0;border-radius:16px;background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:.75rem}
.tab.on{background:var(--surface-2);color:var(--fg);font-weight:700}

/* ---- v12 professional polish ---- */
:root{--bw:2px;--radius:22px;--opt-r:16px}
.app{gap:16px}
h1{font-size:1.5rem;letter-spacing:-.01em}
h2{font-size:.78rem;letter-spacing:.04em;margin:4px 2px 0}
.card h2{margin:0 0 12px}
.card{padding:18px}
.top{padding-top:4px}
.icon-btn{border-width:var(--bw);border-radius:14px;color:var(--fg)}
.icon-btn.close{padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:999px}
.sess-top{gap:14px}
.prog .cnt{font-size:.82rem;font-weight:500;color:var(--fg);margin-bottom:6px}
.prog .cnt .timer{color:var(--muted)}
.prog .meter{border:0;height:6px;background:var(--surface-2)}
.prog .meter i{background:var(--fg)}
.meter{border:var(--bw) solid var(--fg)}
.q{padding:20px 18px}
.q .inst{font-size:.82rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.opts{gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-width:var(--bw);transition:background .15s,border-color .15s}
.opt:not([disabled]):hover{background:var(--surface-2)}
.opt .okey{flex:none;width:28px;height:28px;border-radius:50%;border:var(--bw) solid var(--fg);display:inline-flex;align-items:center;justify-content:center;font:600 .85rem var(--ui);direction:ltr}
.opt .otx{flex:1;min-width:0}
.opt.ok .okey{background:var(--good);border-color:var(--good);color:#fff}
.opt.no .okey{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.ok{border-color:var(--good)}
.opt.no{border-color:var(--bad)}
.opt.dim{opacity:.5}
.fb{border:var(--bw) solid;padding:14px 16px;line-height:1.6}
.fb.ok{border-color:var(--good)}.fb.no{border-color:var(--bad)}
.fb .h{display:flex;align-items:center;gap:8px}
.btn{border-radius:999px;min-height:52px;font-size:1.02rem}
.rsum{display:flex;flex-direction:column;gap:14px}
.rsum .rl{font-size:.82rem;font-weight:500;color:var(--muted)}
.rsum .rmain{display:flex;align-items:center;gap:16px}
.rsum .score{font-size:3.4rem}
.rsum .rmsg{font-weight:500;line-height:1.45}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);border-top:var(--bw) solid var(--fg);padding-top:12px}
.rstats div{display:flex;flex-direction:column;align-items:center;gap:2px}
.rstats div+div{border-inline-start:1px solid var(--bar)}
.rstats b{font-size:1.15rem}
.rstats span{font-size:.75rem;color:var(--muted)}
.miss{border-top:1px solid var(--bar)}
.flash{gap:12px;padding:26px 20px}
.flash .word{font-size:2.5rem}
.rates{gap:8px}
.rate{min-height:66px;border-width:var(--bw);border-bottom-width:5px;border-radius:16px}
.rate b{font-size:1rem}

  @keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}35%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(45deg)}}

{id:'sc34',q:'Far from being _____, the committee\'s decision was the result of months of careful deliberation.',o:['hasty','prudent','lengthy','cautious'],a:0,e:'Far from being X אומר שההפך מ־X נכון. חודשי דיון זהיר מנוגדים להחלטה נמהרת (hasty).'},
{id:'sc35',q:'The scientist was _____ in her work, checking every measurement three times before recording it.',o:['meticulous','careless','indifferent','impulsive'],a:0,e:'בדיקה שלוש פעמים מעידה על דקדקנות (meticulous).'},
{id:'sc36',q:'The new regulations are intended to _____ the damage that factories cause to rivers.',o:['mitigate','intensify','ignore','celebrate'],a:0,e:'תקנות נועדו להקל על הנזק (mitigate), לא להחמיר אותו.'},
{id:'sc37',q:'Despite the _____ weather forecast, the organizers decided to hold the event outdoors.',o:['dismal','favorable','accurate','brief'],a:0,e:'Despite מצביע על ניגוד: למרות תחזית קודרת (dismal) החליטו לקיים את האירוע בחוץ.'},
{id:'sc38',q:'Her _____ remarks offended several guests, who felt that she had no right to speak so bluntly.',o:['tactless','gracious','witty','modest'],a:0,e:'speak so bluntly מרמז על הערות חסרות טקט (tactless).'},
{id:'sc39',q:'Instead of answering the question directly, the spokesman gave an _____ reply that left reporters more confused than before.',o:['evasive','candid','thorough','prompt'],a:0,e:'Instead of answering directly מתאר תשובה מתחמקת (evasive).'},
{id:'sc40',q:'The two theories are not _____; each explains a different aspect of the phenomenon, so both can be true.',o:['incompatible','similar','recent','simple'],a:0,e:'שתי התיאוריות יכולות להיות נכונות יחד, ולכן הן אינן בלתי מתיישבות (incompatible).'},
{id:'sc41',q:'The treaty, long considered _____, was finally signed after decades of failed negotiations.',o:['unattainable','obligatory','trivial','harmless'],a:0,e:'עשורים של כישלונות ואז חתימה: ההסכם נחשב זמן רב לבלתי ניתן להשגה (unattainable).'},
{id:'sc42',q:'Critics accused the author of _____, saying that she had copied whole passages from earlier books.',o:['plagiarism','modesty','humor','accuracy'],a:0,e:'העתקת קטעים שלמים היא גניבה ספרותית (plagiarism).'},
{id:'sc43',q:'The mayor\'s _____ promise to lower taxes won him votes, but once elected he did nothing about it.',o:['empty','genuine','careful','generous'],a:0,e:'הבטחה שלא קוימה היא הבטחה ריקה (empty promise).'},
{id:'sc44',q:'To _____ suspicion, the suspect volunteered to hand over his phone to the police.',o:['dispel','arouse','confirm','ignore'],a:0,e:'מסירת הטלפון נועדה להפיג (dispel) את החשד.'}
];

/* Restatement: q = original sentence, o = four restatements */
const RS = [
{id:'rs01',q:'Had the company invested earlier, it might have avoided bankruptcy.',o:['The company went bankrupt because it invested in the wrong projects too early.','The company invested earlier than its rivals and so managed to avoid bankruptcy.','The company did not invest early, and it went bankrupt.','If the company invests soon, it will probably be able to avoid bankruptcy.'],a:2,e:'מבנה "Had + נושא" הוא תנאי שלא התממש: החברה לא השקיעה מוקדם, ופשטה רגל.'},
{id:'rs02',q:'Few of the students passed the exam.',o:['Most of the students who took the exam managed to pass it.','Only a small number passed the exam.','None of the students who took the exam were able to pass it.','Some of the students chose to fail the exam on purpose.'],a:1,e:'few פירושו מעטים, לא רוב ולא אף אחד.'},
{id:'rs03',q:'The report was neither accurate nor complete.',o:['The report was accurate in every detail, but it was not complete.','The report covered every topic completely, but it was not accurate.','The report was inaccurate and incomplete.','The report was either accurate or complete, but not both.'],a:2,e:'neither...nor שולל את שתי התכונות יחד.'},
{id:'rs04',q:'Unless the weather improves, the match will be cancelled.',o:['The match will be cancelled if the weather gets any better than it is now.','The match will be cancelled if the weather does not improve.','The match was cancelled after the weather had improved unexpectedly.','The match will take place as planned, whatever the weather may be.'],a:1,e:'unless פירושו אם לא: המשחק יבוטל אם מזג האוויר לא ישתפר.'},
{id:'rs05',q:'Despite her lack of experience, she was offered the job.',o:['She was offered the job precisely because she lacked any experience.','She had little experience, but was offered the job.','She was offered the job only after she had gained enough experience.','She refused the job offer because she felt she lacked experience.'],a:1,e:'despite מביע ניגוד: חוסר ניסיון, ובכל זאת קיבלה הצעה.'},
{id:'rs06',q:'The new policy is expected to reduce costs by a third.',o:['Costs will definitely fall by a third once the new policy is introduced.','The new policy should cut costs by a third.','The new policy has already managed to reduce costs by a third.','Under the new policy, costs are expected to rise by about a third.'],a:1,e:'is expected to משמעו צפוי, בלי ודאות ובלי שזה כבר קרה.'},
{id:'rs07',q:'No sooner had the lecture started than the lights went out.',o:['The lights went out just after the lecture began.','The lecture started only after the lights in the hall went out.','The lights went out well before the lecture was planned to start.','The lecture came to an end at the moment when the lights went out.'],a:0,e:'No sooner...than פירושו מיד אחרי: ההרצאה התחילה והאורות כבו מיד.'},
{id:'rs08',q:'Critics argue that the film\'s success owes more to its marketing than to its quality.',o:['Critics think promotion, not quality, made the film succeed.','Critics say that the film is excellent but that it was poorly marketed.','Critics claim that the film succeeded mainly because of its high quality.','Critics think that the marketing campaign damaged the film\'s reputation.'],a:0,e:'owes more to X than to Y פירושו שהסיבה העיקרית היא X, כלומר השיווק.'},
{id:'rs09',q:'She would rather study at home than go to the library.',o:['She prefers going to the library to studying at home.','She prefers studying at home to going to the library.','She studies at home because the library is closed.','She has to study at home instead of the library.'],a:1,e:'would rather A than B פירושו מעדיפה A על פני B.'},
{id:'rs10',q:'The company\'s profits, which had been falling for years, finally began to recover.',o:['The profits kept falling for many years and never recovered at all.','After years of decline, profits started to improve.','The profits began to fall again after several years of steady recovery.','The company recovered its lost profits even before they began to fall.'],a:1,e:'הרווחים ירדו שנים והתחילו להשתפר: ירידה קודמת ואז התאוששות.'},
{id:'rs11',q:'Only after the results were published did the scientists realize their mistake.',o:['The scientists realized their mistake well before the results were published.','The scientists saw their mistake only once the results were out.','The scientists never realized their mistake, even after publication.','Publishing the results was itself the mistake the scientists made.'],a:1,e:'only after מקדים את ההבנה לפרסום: הם הבינו רק אחרי הפרסום.'},
{id:'rs12',q:'It is unlikely that the project will be finished on time.',o:['The project will certainly be finished before the deadline.','The project will probably not be finished on time.','The project was finished late, after the original deadline.','Nobody involved in the project likes its current schedule.'],a:1,e:'unlikely פירושו לא סביר, כלומר כנראה לא יסתיים בזמן.'},
{id:'rs13',q:'Rarely do prices fall during the holiday season.',o:['Prices often fall quite sharply during the holiday season.','Prices seldom drop during the holiday season.','Prices never rise at all during the holiday season.','Prices always fall a little during the holiday season.'],a:1,e:'rarely פירושו לעיתים רחוקות. ההיפוך do prices הוא רק מבנה דקדוקי.'},
{id:'rs14',q:'The more he practiced, the better he played.',o:['He played better as he practiced more.','He practiced less as he played better.','He played well without practicing.','Practicing made him play worse.'],a:0,e:'the more..., the better... מתאר קשר: יותר תרגול, נגינה טובה יותר.'},
{id:'rs15',q:'Not until the report was published did the public learn of the danger.',o:['The public knew about the danger long before the report was published.','The public learned of the danger only after the report appeared.','The report was published because the public already knew of the danger.','The danger disappeared soon after the report was finally published.'],a:1,e:'Not until...did מציין שהידיעה הגיעה רק לאחר הפרסום.'},
{id:'rs16',q:'The harder he tried, the less he succeeded.',o:['His success grew steadily along with his effort.','As his effort increased, his success decreased.','He tried less and less, and succeeded more and more.','He succeeded mainly because he never really tried.'],a:1,e:'the harder..., the less... מתאר מגמות מנוגדות: יותר מאמץ, פחות הצלחה.'},
{id:'rs17',q:'The scientist\'s theory, while elegant, has yet to be confirmed by experiment.',o:['The theory is elegant, and experiments have already proven it.','The theory is attractive but still unconfirmed by experiment.','Experiments have disproved the theory, despite its elegance.','The scientist refuses to test the theory by experiment.'],a:1,e:'has yet to be confirmed פירושו שעדיין לא אושרה, ו־while elegant מוסיף ניגוד.'},
{id:'rs18',q:'Had she known about the traffic, she would have left earlier.',o:['She knew about the traffic in advance and so left early.','Not knowing about the traffic, she did not leave earlier.','She left early that day because of the heavy traffic.','She will leave earlier in future if there is traffic.'],a:1,e:'Had she known הוא תנאי שלא התקיים בעבר: היא לא ידעה, ולכן לא יצאה מוקדם.'},
{id:'rs19',q:'Hardly anyone attended the lecture.',o:['The lecture hall was crowded with people.','Very few people came to the lecture.','Everyone who was invited attended the lecture.','Nobody had been told about the lecture.'],a:1,e:'hardly anyone פירושו כמעט אף אחד, כלומר מעטים מאוד.'},
{id:'rs20',q:'The council is reluctant to approve the plan, fearing public opposition.',o:['The council has approved the plan despite strong public opposition.','Fearing public objection, the council hesitates to approve the plan.','The council opposes the plan because the public strongly supports it.','The public is reluctant to accept the council\'s decision on the plan.'],a:1,e:'reluctant פירושו מהסס, ו־fearing מציין את הסיבה.'}
];

/* Hebrew analogies: q = "A : B", o = four pairs */
const AN = [
{id:'an01',q:'רופא : חולה',o:['מורה : תלמיד','שופט : עורך דין','טבח : סכין','נהג : כביש'],a:0,e:'היחס: בעל מקצוע שמטפל או מלמד, ומי שמקבל ממנו את הטיפול. מורה מלמד תלמיד כשם שרופא מטפל בחולה.'},
{id:'an02',q:'עט : כתיבה',o:['מחק : עיפרון','מספריים : חיתוך','דף : מחברת','ספר : ספרייה'],a:1,e:'היחס: כלי והפעולה שהוא משמש לה. מספריים משמשים לחיתוך.'},
{id:'an03',q:'קר : קפוא',o:['חם : לוהט','גדול : קטן','יפה : מכוער','מהיר : איטי'],a:0,e:'היחס: אותה תכונה בדרגה חזקה יותר. קפוא הוא קר מאוד, ולוהט הוא חם מאוד.'},
{id:'an04',q:'כבשה : עדר',o:['דג : ים','ציפור : קן','פרח : ריח','עץ : יער'],a:3,e:'היחס: פרט והקבוצה שהוא חלק ממנה. עץ הוא חלק מיער כשם שכבשה היא חלק מעדר. שימו לב: ההתאמה אינה לפי מקום המגורים, אלא לפי קבוצה.'},
{id:'an05',q:'שעון : זמן',o:['מחשב : אינטרנט','מד חום : טמפרטורה','מראה : פנים','מכונית : חניה'],a:1,e:'היחס: מכשיר מדידה והגודל שהוא מודד. מד חום מודד טמפרטורה.'},
{id:'an06',q:'שתיקה : דיבור',o:['ים : מים','אור : חושך','ענן : גשם','כביש : מכונית'],a:1,e:'היחס: הפכים. שתיקה היא ההפך מדיבור, וחושך הוא ההפך מאור.'},
{id:'an07',q:'נגר : עץ',o:['רופא : בית חולים','צורף : זהב','טייס : מטוס','מורה : כיתה'],a:1,e:'היחס: בעל מקצוע וחומר הגלם שהוא עובד בו. הנגר מעבד עץ והצורף מעבד זהב.'},
{id:'an08',q:'קמח : לחם',o:['חלב : גבינה','תנור : אפייה','אורז : סיר','שולחן : כיסא'],a:0,e:'היחס: חומר גלם והמוצר שנעשה ממנו. מקמח מכינים לחם, ומחלב מכינים גבינה.'},
{id:'an09',q:'חיסון : מחלה',o:['מהירות : הגעה','כסף : קנייה','שיעור : בחינה','זהירות : תאונה'],a:3,e:'היחס: אמצעי מניעה והדבר שהוא נועד למנוע. חיסון מונע מחלה וזהירות מונעת תאונה.'},
{id:'an10',q:'פחד : בריחה',o:['שמחה : עצב','כעס : צעקה','ילד : צעצוע','כאב : רופא'],a:1,e:'היחס: רגש והתגובה האופיינית לו. פחד מוביל לבריחה וכעס מוביל לצעקה.'},
{id:'an11',q:'פסל : אמן',o:['שיר : משורר','ציור : מוזיאון','סופר : דיו','צבעים : צייר'],a:0,e:'היחס: יצירה ויוצרה. הפסל נוצר בידי אמן, והשיר נוצר בידי משורר.'},

{id:'an13',q:'דף : ספר',o:['שעה : שנייה','חורף : קר','דקה : שעה','ספר : קורא'],a:2,e:'היחס: חלק ושלם. דף הוא חלק מספר, ודקה היא חלק משעה.'},
{id:'an14',q:'שריפה : אפר',o:['ים : סערה','עץ : פרי','בית : חלון','מלחמה : הרס'],a:3,e:'היחס: תהליך והשארית או התוצאה שלו. שריפה משאירה אפר ומלחמה משאירה הרס.'},
{id:'an15',q:'חד : סכין',o:['ארוך : קצר','רך : כרית','כבד : קל','צר : רחב'],a:1,e:'היחס: תכונה אופיינית והחפץ שמתאפיין בה. הסכין חדה והכרית רכה.'},
{id:'an16',q:'טבח : מסעדה',o:['חולה : רופא','מורה : בית ספר','תלמיד : שיעור','נהג : רישיון'],a:1,e:'היחס: בעל מקצוע ומקום העבודה האופייני שלו. הטבח עובד במסעדה והמורה בבית ספר.'},
{id:'an17',q:'מטאטא : טאטוא',o:['מברשת : שיער','כוס : מים','מחרשה : חריש','פח : זבל'],a:2,e:'היחס: כלי והפעולה שהוא נועד לה. מטאטא לטאטוא ומחרשה לחריש.'},
{id:'an18',q:'הצלחה : גאווה',o:['גאווה : חיוך','כישלון : אכזבה','מבחן : ציון','כסף : עושר'],a:1,e:'היחס: אירוע והרגש שהוא מעורר. הצלחה מעוררת גאווה וכישלון מעורר אכזבה.'},
{id:'an19',q:'למידה : ידע',o:['אכילה : מזלג','קריאה : משקפיים','ריצה : נעליים','אימון : כושר'],a:3,e:'היחס: פעולה והתוצאה שלה. למידה מובילה לידע, ואימון מוביל לכושר. שאר האפשרויות מציגות כלים, לא תוצאות.'},
{id:'an20',q:'נעל : רגל',o:['כובע : חורף','גרב : כביסה','כפפה : יד','חגורה : מכנסיים'],a:2,e:'היחס: פריט לבוש והאיבר שהוא עוטף. נעל לרגל וכפפה ליד.'},
{id:'an21',q:'חשד : הוכחה',o:['השערה : עובדה','עובדה : מחקר','הוכחה : משפט','שאלה : חקירה'],a:0,e:'היחס: דבר שטרם הוכח לעומת מצב מוכח. חשד אינו מוכח, וכך גם השערה, ואילו עובדה היא מצב מוכח.'},
{id:'an22',q:'משקפיים : ראייה',o:['מכשיר שמיעה : שמיעה','אוזניים : קול','עיניים : אור','מקלט רדיו : מוזיקה'],a:0,e:'היחס: אמצעי עזר החיצוני לגוף והחוש שהוא מסייע לו. מכשיר שמיעה מסייע לשמיעה, כשם שמשקפיים מסייעים לראייה.'},
{id:'an23',q:'קטיף : פרי',o:['דיג : דג','ציד : חץ','זריעה : שדה','בישול : סיר'],a:0,e:'היחס: פעולת איסוף והדבר שנאסף בה. קוטפים פרי ודגים דגים. חץ, שדה וסיר הם כלי או מקום, לא מושא הפעולה.'},
{id:'an24',q:'מחרשה : חקלאי',o:['מכחול : צייר','בית : דייר','כיסא : שולחן','ספר : עט'],a:0,e:'היחס: כלי עבודה ובעל המקצוע שמשתמש בו. החקלאי משתמש במחרשה והצייר במכחול.'},
{id:'an25',q:'ניצוץ : להבה',o:['נחל : נהר','להבה : אש','גשם : ים','מים : קרח'],a:0,e:'היחס: ביטוי קטן של דבר והביטוי הגדול ממנו מאותו סוג. ניצוץ קטן מלהבה, ונחל קטן מנהר.'},
{id:'an26',q:'גשר : מעבר',o:['מדרגות : עלייה','חומה : לבנים','בית : גג','כביש : עיר'],a:0,e:'היחס: מבנה והפעולה שהוא מאפשר. גשר מאפשר מעבר, ומדרגות מאפשרות עלייה.'},
{id:'an27',q:'רופא : בריאות',o:['עורך דין : צדק','מורה : שיעור','מהנדס : גשר','חייל : נשק'],a:0,e:'היחס: בעל מקצוע והערך שהוא פועל לקדם. רופא פועל למען בריאות ועורך דין למען צדק. גשר ונשק הם מוצר וכלי.'},
{id:'an28',q:'משב : סערה',o:['זרם : שיטפון','גשם : ים','ריצה : הליכה','רעם : ברק'],a:0,e:'היחס: אותה תופעה בעוצמה קטנה ובעוצמה גדולה. משב קטן מסערה, וזרם מים קטן משיטפון.'},

{id:'rd_he2',lang:'he',title:'הגשם הראשון',
 text:'בעבר נהגו להניח שהגשם הראשון של העונה מנקה את האוויר ואת הסביבה מזיהום. אולם מדידות שנערכו בערים גדולות מצאו תמונה מורכבת יותר: בשעות הראשונות של הגשם עולה דווקא ריכוז חלק מהמזהמים בנחלים ובצנרת הניקוז, מפני שהמים שוטפים אליהם את האבק והשמן שהצטברו בכבישים בימי הקיץ. רק לאחר כמה שעות, כשהכבישים נקיים, יורד ריכוז המזהמים. מכאן שהגשם אינו מנקה את הסביבה אלא מעביר את הלכלוך ממקום למקום.',
 qs:[
 {id:'rd_he2_1',q:'איזו הנחה ישנה מערער עליה הקטע?',o:['שגשם יורד בארץ רק בחודשי החורף','שהגשם הראשון מנקה את הסביבה','שהכבישים מתלכלכים בעיקר בקיץ','שהנחלים בערים נקיים בימי הקיץ'],a:1,e:'הפתיחה מציגה את ההנחה הישנה: הגשם הראשון מנקה, והקטע מראה שהתמונה מורכבת יותר.'},
 {id:'rd_he2_2',q:'מדוע עולה ריכוז המזהמים בנחלים בתחילת הגשם?',o:['כי המים שוטפים אליהם לכלוך מהכבישים','כי המפעלים מגבירים את פעילותם בגשם','כי הנחלים מתייבשים לפני העונה','כי מי הגשם עצמם מזוהמים מאוד'],a:0,e:'הקטע אומר במפורש שהמים שוטפים לנחלים אבק ושמן מהכבישים.'},
 {id:'rd_he2_3',q:'מהי משמעות המשפט האחרון בקטע?',o:['הגשם מסלק את הלכלוך מן העיר לחלוטין','הלכלוך אינו נעלם אלא עובר למקום אחר','יש להימנע מלצאת מהבית בזמן גשם','הכבישים נשארים מלוכלכים גם אחרי הגשם'],a:1,e:'"מעביר את הלכלוך ממקום למקום" פירושו שהלכלוך אינו נעלם אלא משנה מיקום.'}
 ]}

{id:'rd_en3',lang:'en',title:'Handwriting in the digital age',
 text:'Many schools have reduced the time spent teaching handwriting, arguing that children will spend their adult lives typing. Yet several studies suggest the change may carry a cost. In one experiment, students who took notes by hand and students who typed them listened to the same lecture. Although the typists wrote more, the hand-writers performed better on conceptual questions a week later. The researchers explained that typing tempts people to copy the lecturer\'s words almost automatically, whereas handwriting, being slower, forces the writer to summarize and choose what matters. This does not mean that typing is useless; for long documents it is clearly more efficient. But, the authors argue, schools should not assume that a faster tool always leads to deeper learning.',
 qs:[
 {id:'rd_en3_1',q:'What is the main idea of the passage?',o:['Faster note-taking does not guarantee deeper learning.','Typing should be completely banned from classrooms.','Handwriting is always more efficient than typing.','Students who type notes cannot understand lectures.'],a:0,e:'הקטע אינו אוסר הקלדה, אלא מזהיר שכלי מהיר אינו מבטיח למידה עמוקה יותר.'},
 {id:'rd_en3_2',q:'According to the researchers, why did the hand-writers do better on conceptual questions?',o:['Writing slowly forced them to summarize.','They listened more carefully than the typists did.','They wrote down more words than the typists did.','They had already studied the material beforehand.'],a:0,e:'הקטע מסביר שהכתיבה האיטית מחייבת לסכם ולבחור מה חשוב.'},
 {id:'rd_en3_3',q:'The authors would most likely agree with which statement?',o:['Typing is useful, but speed is not a sign of learning.','Schools should stop teaching students how to type.','Students who write by hand always remember more details.','Conceptual questions are always harder than factual ones.'],a:0,e:'הכותבים מודים שהקלדה יעילה למסמכים ארוכים, ועם זאת מזהירים מלהסיק שמהירות פירושה למידה.'},
 {id:'rd_en3_4',q:'The phrase "tempts people to copy" suggests that typing',o:['makes word-for-word copying easy','is forbidden in many lecture halls','prevents people from listening well','improves the accuracy of the notes'],a:0,e:'tempts מרמז על פיתוי: ההקלדה מקלה להעתיק כמעט אוטומטית.'}
 ]},
{id:'rd_en4',lang:'en',title:'Trees and urban heat',
 text:'Cities are usually several degrees warmer than the countryside around them, a phenomenon known as the urban heat island. Dark roads and roofs absorb sunlight and release it slowly at night, while tall buildings block the breeze. Planting trees is often proposed as a remedy, and with good reason: shade lowers surface temperatures, and leaves cool the air as water evaporates from them. Yet urban foresters point out that a tree planted in the wrong place may do little good. Saplings struggle in compacted soil, and a tree that dies within a few years provides no shade and wastes the money spent on it. Cities that have succeeded in cooling their neighborhoods, the foresters say, did so not merely by planting many trees but by caring for them over decades.',
 qs:[
 {id:'rd_en4_1',q:'Why are cities warmer than the surrounding countryside?',o:['Dark surfaces store heat and buildings block wind.','Trees in cities release stored heat during the night.','People in cities use far more air conditioning.','Cities receive more direct sunlight than the countryside.'],a:0,e:'הקטע מציין שכבישים וגגות כהים סופגים חום ומשחררים אותו לאט, ובניינים גבוהים חוסמים את הרוח.'},
 {id:'rd_en4_2',q:'What is the foresters\' main criticism of tree-planting programs?',o:['Planting is useless without long-term care.','Trees do not actually cool the air around them.','Trees are far too expensive for most cities to plant.','There are not enough saplings available to plant.'],a:0,e:'המסקנה: ערים שהצליחו לא רק נטעו עצים אלא גם טיפלו בהם עשרות שנים.'},
 {id:'rd_en4_3',q:'According to the passage, how do trees help cool a city?',o:['Through shade and evaporation from leaves','By blocking sunlight from reaching the roofs','By absorbing heat from the roads at night','By blocking the warm breeze from the countryside'],a:0,e:'הקטע מציין שני מנגנונים: צל, וקירור האוויר באמצעות אידוי מים מהעלים.'},
 {id:'rd_en4_4',q:'The word "remedy" in the passage most nearly means',o:['solution','excuse','tradition','warning'],a:0,e:'remedy הוא פתרון או תרופה לבעיה, כאן לבעיית החום בעיר.'}
 ]},
{id:'rd_he3',lang:'he',title:'שינוי בלשון',
 text:'לדעת רבים, שינויי הלשון הם סימן להתנוונות: צעירים משבשים את הכללים, מאמצים מילים זרות ומקצרים כל משפט, ובעקבות כך, כך הם חוששים, תאבד השפה את יופיה. אולם בלשנים רבים רואים את התמונה אחרת. לשיטתם, שפה חיה היא שפה משתנה, ושפה שחדלה להשתנות היא לרוב שפה שחדלו לדבר בה. כך, מילים שנראות לנו כיום תקניות לחלוטין נחשבו בשעתן לשיבוש, ולא מעטות מהן נכנסו לשימוש רק לפני דורות מעטים. הבלשנים אינם טוענים שכל שינוי הוא לטובה, וגם אינם מתנגדים לתיקון לשון בהקשרים רשמיים. הם מבקשים רק להבחין בין שני דברים: בין הצורך להקפיד על כללי הכתיבה בטקסט מסוים לבין הטענה שהכללים הם חוק טבע. מי שמבלבל בין השניים, הם אומרים, דומה למי שמנסה לעצור נהר בידיו.',
 qs:[
 {id:'rd_he3_1',q:'מהי עמדת הבלשנים כפי שהיא מוצגת בקטע?',o:['שינוי לשוני מעיד על שפה חיה','יש לאסור על צעירים להשתמש במילים זרות','כל שינוי בלשון הוא שיפור של השפה','אין כל צורך בכללי כתיבה בשום הקשר'],a:0,e:'הבלשנים אינם מתנגדים לכללים ואינם טוענים שכל שינוי טוב, אלא שהשינוי הוא סימן לשפה חיה.'},
 {id:'rd_he3_2',q:'מדוע מוזכר בסוף הקטע הדימוי של עצירת נהר?',o:['כדי להמחיש שאי אפשר לעצור שינוי לשוני','כדי להדגיש את חשיבותם של נהרות לתרבות','כדי להוכיח שמילים זרות מזהמות את השפה','כדי לתאר את המהירות שבה השפה נכתבת'],a:0,e:'עצירת נהר בידיים היא משימה חסרת סיכוי, וכך גם ניסיון לעצור שינוי לשוני.'},
 {id:'rd_he3_3',q:'איזו מהטענות הבאות עולה מן הקטע?',o:['הבלשנים מתנגדים לכל תיקון לשון בכל הקשר','מילים תקניות כיום נחשבו פעם לשיבוש','שפה שאינה משתנה היא תמיד שפה נעלה יותר','צעירים משתמשים במילים זרות יותר מכל דור'],a:1,e:'הקטע אומר במפורש שמילים תקניות כיום נחשבו בשעתן לשיבוש. האפשרויות האחרות אינן נאמרות או סותרות את הקטע.'},
 {id:'rd_he3_4',q:'מהי ההבחנה שהבלשנים מבקשים לעשות?',o:['בין הקפדה על כללים לבין ראייתם כחוק טבע','בין מילים זרות לבין מילים עבריות מקוריות','בין שפת הצעירים לבין שפת המבוגרים','בין שפת הכתיבה לבין שפת הדיבור'],a:0,e:'ההבחנה מנוסחת בקטע במפורש: בין הצורך להקפיד על כללים בטקסט מסוים לבין הטענה שהם חוק טבע.'}
 ]},
{id:'rd_he4',lang:'he',title:'הורדת מחירים',
 text:'כשחברה גדולה מורידה מחירים, נוטים לראות בכך הטבה ישירה לצרכן. אולם הכלכלנים מזהירים מהסקה פשטנית: הורדת מחירים יכולה לשרת גם מטרה אחרת לגמרי, והיא סילוקם של מתחרים קטנים מהשוק. חברה גדולה יכולה להרשות לעצמה למכור בהפסד תקופה ארוכה, בעוד שהמתחרים הקטנים אינם יכולים, ולכן הם נאלצים לסגור. משנעלמו, החברה מעלה את המחירים בחזרה, ואף מעבר לרמתם הקודמת, שכן אין מי שיגביל אותה. הצרכן, שנהנה בטווח הקצר, משלם בסופו של דבר יותר. עם זאת, הכלכלנים מדגישים כי אין להסיק שכל הורדת מחירים היא מהלך תחבולני. בשווקים שבהם קל למתחרים חדשים להיכנס, העלאת מחירים אחרי סילוקם של מתחרים תחזיר אותם מיד לשוק, ולכן התחבולה אינה משתלמת.',
 qs:[
 {id:'rd_he4_1',q:'מהי הנקודה המרכזית בקטע?',o:['הורדת מחירים אינה בהכרח לטובת הצרכן','חברות גדולות פועלות תמיד לטובת הצרכן','מחירים נמוכים משקפים תמיד תחרות בריאה','מתחרים קטנים אינם יכולים להתקיים כלל'],a:0,e:'הקטע מזהיר שהורדת מחירים עלולה לשרת מטרה אחרת, ובסופו של דבר הצרכן עלול לשלם יותר.'},
 {id:'rd_he4_2',q:'מדוע חברה גדולה יכולה לנקוט את המהלך שתואר ואילו חברה קטנה אינה יכולה?',o:['משום שהיא יכולה לשרוד הפסדים ממושכים','משום שהצרכנים מעדיפים לקנות ממנה','משום שהמוצרים שלה איכותיים יותר','משום שהחוק מתיר זאת רק לחברות גדולות'],a:0,e:'הקטע אומר שהחברה הגדולה יכולה למכור בהפסד תקופה ארוכה, והקטנות אינן יכולות.'},
 {id:'rd_he4_3',q:'באיזה מצב, לפי הקטע, המהלך אינו משתלם?',o:['כשקל למתחרים חדשים להיכנס לשוק','כשהצרכנים אינם מבחינים בשינויי מחירים','כשהחברה המורידה מחירים היא קטנה','כשהמחירים מועלים בחזרה באופן הדרגתי'],a:0,e:'בשווקים פתוחים העלאת מחירים מחזירה את המתחרים, ולכן המהלך אינו משתלם.'},
 {id:'rd_he4_4',q:'מה משמעות המילה "תחבולני" בקטע?',o:['מתוכנן בערמומיות','כלכלי לגמרי','נחוץ ומוצדק','כושל מראש'],a:0,e:'תחבולה היא תכסיס ערמומי. מהלך תחבולני נועד להשיג מטרה סמויה.'}
 ]},
{id:'rd_he5',lang:'he',title:'פיזור הלמידה',
 text:'מורים רבים מאמינים שהדרך הטובה ללמוד לבחינה היא לשבת שעות רצופות על החומר בערב שלפניה. מחקרים בתחום הזיכרון מצביעים על דרך יעילה יותר: פיזור הלמידה על פני ימים. כשחוזרים על חומר לאחר הפסקה, נדרש מאמץ לשחזר אותו, והמאמץ הזה, כך מסתבר, הוא שמבסס את הזיכרון. לעומת זאת, קריאה חוזרת ברצף יוצרת תחושת היכרות מטעה: החומר נראה מוכר, ולכן הלומד סבור שהוא יודע אותו, אף שאינו מסוגל לשחזרו כשיתבקש. אין פירוש הדבר שלמידה ברגע האחרון חסרת תועלת: היא עשויה להספיק לבחינה קרובה. אך היא מותירה פחות בזיכרון לטווח ארוך, ומי שזקוק לידע גם אחרי הבחינה, למשל סטודנט שילמד את החומר שוב בשנה הבאה, ירוויח מהפיזור.',
 qs:[
 {id:'rd_he5_1',q:'מדוע קריאה חוזרת ברצף עלולה להטעות?',o:['היא יוצרת תחושת ידיעה מטעה','היא ארוכה ומייגעת מדי','היא גורמת לשכחה מיידית של החומר','היא מקשה על הבנת החומר המורכב'],a:0,e:'לפי הקטע, החומר נראה מוכר ולכן הלומד סבור שהוא יודע אותו, אף שאינו מצליח לשחזרו.'},
 {id:'rd_he5_2',q:'מה תפקיד המאמץ בשחזור, לפי הקטע?',o:['הוא מבסס את הזיכרון','הוא מעיד על חולשת הלומד','הוא מיותר כשיש הפסקות','הוא מגביר את תחושת ההיכרות'],a:0,e:'הקטע אומר שהמאמץ לשחזר הוא שמבסס את הזיכרון.'},
 {id:'rd_he5_3',q:'איזו טענה מתיישבת עם האמור בקטע?',o:['למידה ברגע האחרון מספיקה לטווח קצר בלבד','למידה ברגע האחרון אינה מועילה כלל ועיקר','פיזור הלמידה מועיל רק לבחינות ארוכות','רוב המורים מתנגדים לפיזור הלמידה'],a:0,e:'הקטע אומר שלמידה ברגע האחרון עשויה להספיק לבחינה קרובה, אך מותירה פחות בזיכרון לטווח ארוך.'},
 {id:'rd_he5_4',q:'מדוע מוזכר הסטודנט שילמד את החומר שוב בשנה הבאה?',o:['כדוגמה למי שירוויח מהפיזור','כדי להראות שלמידה חוזרת מיותרת','כדי להסביר מדוע מורים רבים טועים','כדי לבסס את הטענה שהבחינות קלות'],a:0,e:'הסטודנט הוא דוגמה למי שזקוק לידע גם אחרי הבחינה, ולכן ירוויח מהפיזור.'}

{id:'rd_he6',lang:'he',title:'דעת הרוב',

READ.push(
{id:'rd_he7',lang:'he',title:'ביקוש מושרה',
 text:'במשך עשרות שנים הייתה התשובה המקובלת לפקקי תנועה הרחבת כבישים: אם הכביש צר מכדי להכיל את המכוניות, יש להוסיף לו נתיבים. אולם מחקרים שנערכו בערים רבות מצביעים על תופעה מפתיעה: זמן קצר לאחר ההרחבה, הכביש החדש נעשה עמוס כמו קודמו. ההסבר לתופעה, המכונה "ביקוש מושרה", פשוט למדי. כשהנסיעה נעשית מהירה ונוחה יותר, אנשים שנמנעו בעבר מלנסוע בשעות העומס, או שהעדיפו תחבורה ציבורית, עוברים לנסוע ברכב פרטי. הכביש הרחב אינו רק מספק את הביקוש הקיים, אלא יוצר ביקוש חדש. מכאן אין להסיק שאין להרחיב כבישים לעולם: במקומות שבהם הביקוש כמעט אינו גמיש, למשל בדרך המובילה לאזור תעשייה מבודד, ההרחבה עשויה להועיל. אך בערים צפופות, טוענים המתכננים, הדרך היעילה להקל על העומס היא דווקא להפוך את החלופות לנסיעה ברכב פרטי לאטרקטיביות יותר, ולא להמשיך ולסלול.',
 qs:[
 {id:'rd_he7_1',q:'מהי הטענה המרכזית בקטע?',o:['הרחבת כבישים בעיר אינה פותרת עומסים','אין להרחיב כבישים בשום מקום ובשום מצב','תחבורה ציבורית איטית יותר מרכב פרטי','פקקי תנועה נגרמים בעיקר בגלל תאונות'],a:0,e:'הקטע מראה שההרחבה יוצרת ביקוש חדש, ומסייג שבמקומות מסוימים היא עשויה להועיל. "בשום מקום" היא הכללת יתר.'},
 {id:'rd_he7_2',q:'לפי הקטע, מדוע הכביש המורחב מתמלא שוב?',o:['הנוחות מושכת נהגים חדשים','ההרחבה נעשתה ברשלנות ובחופזה','מספר תושבי העיר גדל בינתיים','התחבורה הציבורית הוזלה באותה עת'],a:0,e:'אנשים שנמנעו מלנסוע או שהעדיפו תחבורה ציבורית עוברים לרכב פרטי.'},
 {id:'rd_he7_3',q:'מה מטרת הדוגמה של הדרך לאזור תעשייה מבודד?',o:['להראות מקרה שבו הרחבה עשויה להועיל','להראות שאזורי תעשייה גורמים לפקקים','להוכיח שביקוש מושרה קיים בכל מקום','להמליץ להעביר מפעלים אל תוך הערים'],a:0,e:'הדוגמה מסייגת את הטענה: כשהביקוש קבוע, ההרחבה לא תיצור תנועה חדשה.'},
 {id:'rd_he7_4',q:'מה פירוש הביטוי "הביקוש כמעט אינו גמיש" בהקשר הקטע?',o:['מספר הנוסעים כמעט אינו משתנה','הנוסעים אינם מוכנים לשלם על נסיעה','הכביש אינו ניתן להרחבה בפועל','הנסיעה בדרך זו אסורה על פי חוק'],a:0,e:'ביקוש לא גמיש אינו מגיב לשינויים בתנאים, ולכן הרחבה לא תמשוך נהגים חדשים.'},

 ]},
{id:'rd_he8',lang:'he',title:'אפקט הפלצבו',
 text:'בניסויים רפואיים נהוג לחלק את המשתתפים לשתי קבוצות: האחת מקבלת את התרופה הנבדקת, והאחרת מקבלת תכשיר דומה למראה שאין בו חומר פעיל, הקרוי פלצבו. המשתתפים אינם יודעים לאיזו קבוצה שויכו. הסיבה לשיטה זו היא שחולים רבים מדווחים על הקלה גם כשקיבלו פלצבו, ככל הנראה משום שהציפייה להחלמה משפיעה על תחושותיהם. אילו ניתנה התרופה לכל המשתתפים, לא היה אפשר לדעת אם השיפור נובע מן החומר הפעיל או מן הציפייה. לכן תרופה נחשבת יעילה רק אם השיפור בקבוצה שקיבלה אותה גדול במובהק מן השיפור בקבוצת הפלצבו. יש הרואים בממצא זה מקור לאופטימיות: אם הציפייה לבדה מסוגלת להקל, אולי אפשר לרתום אותה לטיפול. אחרים מזהירים שההקלה מן הפלצבו מתבטאת בעיקר בתחושות שהחולים מדווחים עליהן, כמו כאב או עייפות, ופחות במדדים שניתן למדוד באופן אובייקטיבי.',
 qs:[
 {id:'rd_he8_1',q:'מה תפקידה של קבוצת הפלצבו בניסוי?',o:['להבחין בין החומר הפעיל לבין הציפייה','לחסוך בעלויות הניסוי ובזמן החוקרים','לבדוק רק את תופעות הלוואי של התרופה','להגדיל את מספר המשתתפים בכל ניסוי'],a:0,e:'בלי קבוצת השוואה לא היה אפשר לדעת אם השיפור נובע מהחומר או מהציפייה.'},
 {id:'rd_he8_2',q:'מן הקטע אפשר להסיק שהמשתתפים אינם יודעים לאיזו קבוצה שויכו כדי ש',o:['הציפייה תהיה דומה בשתי הקבוצות','המשתתפים לא יעזבו את הניסוי באמצע','החוקרים לא יתבלבלו בין הקבוצות','הניסוי יסתיים מהר יותר מן הצפוי'],a:0,e:'זו הסקה: אם רק קבוצה אחת הייתה יודעת שהיא מקבלת תרופה, הציפייה הייתה שונה ומטשטשת את התוצאה.'},
 {id:'rd_he8_3',q:'מתי, לפי הקטע, תרופה נחשבת יעילה?',o:['כשהשיפור בקבוצתה גדול במובהק משבפלצבו','כשרוב המשתתפים מדווחים על שיפור כלשהו','כשאין לה תופעות לוואי משמעותיות','כשהיא דומה למראה לתכשיר הפלצבו'],a:0,e:'הקטע אומר זאת במפורש. "רוב המשתתפים משתפרים" אינו מספיק, כי גם בפלצבו רבים משתפרים.'},
 {id:'rd_he8_4',q:'מה ההבדל בין שתי העמדות המוצגות בסוף הקטע?',o:['האחת רואה בפלצבו פוטנציאל, האחרת מגבלות','האחת תומכת בתרופות והאחרת מתנגדת להן','שתיהן שוללות את קיומו של אפקט הפלצבו','שתיהן ממליצות להפסיק את הניסויים מיד'],a:0,e:'האופטימיים רוצים לרתום את הציפייה, והמזהירים מציינים שהיא משפיעה בעיקר על תחושות.'},
 {id:'rd_he8_5',q:'לפי המזהירים, באילו מדדים בולטת פחות השפעת הפלצבו?',o:['במדדים אובייקטיביים','בתחושת הכאב','בתחושת העייפות','בדיווחי המטופלים עצמם'],a:0,e:'כאב, עייפות ודיווחים הם דווקא התחום שבו הפלצבו משפיע. מדדים אובייקטיביים מושפעים פחות.'}
 ]},
{id:'rd_he9',lang:'he',title:'הפרכה במדע',
 text:'נהוג לחשוב שמדען מוכיח את תאוריותיו באמצעות תצפיות התומכות בהן. אולם פילוסופים של המדע הצביעו על בעיה בתפיסה זו: גם אלף תצפיות תומכות אינן מוכיחות שהתאוריה נכונה, שכן התצפית הבאה עלולה לסתור אותה. מי שראה רק ברבורים לבנים אינו רשאי לקבוע שכל הברבורים לבנים; די בברבור שחור אחד כדי להפריך את הטענה. מכאן הציעו כמה מהם לראות את לב השיטה המדעית לא באישוש אלא בהפרכה: תאוריה מדעית היא תאוריה שאפשר, לפחות עקרונית, להצביע על תצפית שתסתור אותה. טענה שאינה ניתנת להפרכה בשום תצפית אפשרית, למשל "כל מה שקורה הוא לטובה", עשויה להיות מנחמת, אך אין היא טענה מדעית. עם זאת, מבקרי הגישה מעירים שבפועל מדענים אינם נוטשים תאוריה בכל פעם שתצפית אחת סותרת אותה. לעיתים הם מעדיפים לחשוד בתצפית, ובצדק, שכן גם מכשירי מדידה טועים.',
 qs:[
 {id:'rd_he9_1',q:'מהי הבעיה שהפילוסופים מצביעים עליה בתפיסה המקובלת?',o:['תצפיות תומכות אינן מוכיחות תאוריה','מדענים אינם עורכים מספיק תצפיות','לתצפיות אין חשיבות של ממש במדע','אי אפשר לראות ברבורים שחורים בטבע'],a:0,e:'"גם אלף תצפיות תומכות אינן מוכיחות", כי התצפית הבאה עלולה לסתור.'},
 {id:'rd_he9_2',q:'מה תפקידה של הדוגמה של הברבורים?',o:['להראות שתצפית אחת יכולה להפריך','להוכיח שכל הברבורים בעולם לבנים','להראות שתצפיות רבות מספיקות להוכחה','לתאר ניסוי ביולוגי שנערך בברבורים'],a:0,e:'ברבור שחור אחד מספיק כדי להפריך את "כל הברבורים לבנים".'},
 {id:'rd_he9_3',q:'מדוע הטענה "כל מה שקורה הוא לטובה" אינה מדעית לפי הגישה המתוארת?',o:['משום שאין תצפית שתסתור אותה','משום שהיא שקרית ומטעה','משום שהיא מנחמת את השומעים','משום שלא נבדקה מספיק פעמים'],a:0,e:'לפי הגישה, טענה מדעית חייבת להיות ניתנת להפרכה עקרונית. הכותב אינו טוען שהיא שקרית.'},
 {id:'rd_he9_4',q:'מה טוענים מבקרי הגישה?',o:['שמדענים לא נוטשים תאוריה בגלל תצפית אחת','שאין צורך לערוך תצפיות כדי לבסס תאוריה','שכל תאוריה מדעית ניתנת להוכחה מלאה וסופית','שמכשירי המדידה של המדענים אינם טועים לעולם'],a:0,e:'המבקרים מצביעים על הפער בין הגישה לבין מה שמדענים עושים בפועל.'},
 {id:'rd_he9_5',q:'מהי עמדת הכותב כלפי מדענים שחושדים בתצפית הסותרת?',o:['הוא רואה בכך התנהגות מוצדקת לעיתים','הוא מגנה אותם על חוסר העקביות שלהם','הוא טוען שהם צודקים תמיד ובכל מצב','הוא אינו מביע כל עמדה בעניין הזה'],a:0,e:'המילה "ובצדק" חושפת את עמדתו, ו"לעיתים" מגבילה אותה.'}
 ]},
{id:'rd_he10',lang:'he',title:'טכנולוגיה ותעסוקה',
 text:'בכל פעם שמופיעה טכנולוגיה חדשה המחליפה עבודת אדם, מתעורר חשש מאבטלה המונית. החשש אינו חסר בסיס: אורגים, מרכזניות ופקידי בנק רבים איבדו את פרנסתם בעקבות מכונות. אולם בראייה היסטורית רחבה, שיעור התעסוקה לא קרס. הטכנולוגיה הוזילה מוצרים ושירותים, הצרכנים הפנו את הכסף שנחסך לצריכת דברים אחרים, ונוצרו מקצועות שקודם לכן לא היו קיימים כלל. עם זאת, כלכלנים מזהירים מלהסיק שהמעבר חלק. העובדים שאיבדו את משרתם אינם בהכרח אלה שנקלטים במקצועות החדשים, שלעיתים קרובות דורשים כישורים אחרים לגמרי. לכן גם אם בטווח הארוך המשק כולו מרוויח, דור שלם של עובדים עלול לשלם את המחיר. השאלה החשובה, לדעתם, אינה אם הטכנולוגיה תיצור משרות, אלא מי ייהנה מהן וכיצד יסייעו למי שנפגע.',
 qs:[
 {id:'rd_he10_1',q:'מה עולה מן הקטע על ההשפעה ההיסטורית של טכנולוגיה על התעסוקה?',o:['התעסוקה לא קרסה, אך היו נפגעים','הטכנולוגיה הביאה לאבטלה המונית','הטכנולוגיה לא פגעה באף עובד','כל המשרות שאבדו חזרו לאותם עובדים'],a:0,e:'הקטע מכיר בנפגעים, אך אומר ששיעור התעסוקה הכולל לא קרס.'},
 {id:'rd_he10_2',q:'מה תפקידן של הדוגמאות של האורגים והמרכזניות?',o:['להראות שהחשש אינו חסר בסיס','להוכיח שהחשש מאבטלה מוגזם','לתאר מקצועות חדשים שנוצרו','להציג מקצועות שהטכנולוגיה יצרה'],a:0,e:'הדוגמאות באות מיד אחרי "החשש אינו חסר בסיס" ומבססות אותו.'},
 {id:'rd_he10_3',q:'לפי הקטע, באיזה אופן הטכנולוגיה יוצרת מקומות עבודה?',o:['הוזלה מפנה כסף לצריכה ולמקצועות חדשים','המדינה מחייבת חברות להעסיק עובדים','מכונות זקוקות לעובדים רבים להפעלתן','העובדים מסרבים לעבוד לצד מכונות'],a:0,e:'הקטע מתאר שרשרת: הוזלה, הפניית כסף לצריכה אחרת, ומקצועות חדשים.'},
 {id:'rd_he10_4',q:'מדוע, לדעת הכלכלנים, המעבר אינו חלק?',o:['המשרות החדשות דורשות כישורים אחרים','אין כמעט מקצועות חדשים בשוק','הטכנולוגיה החדשה יקרה מדי לעסקים','הצרכנים אינם קונים מוצרים זולים'],a:0,e:'מי שפוטר אינו בהכרח מי שנקלט, כי המקצועות החדשים דורשים כישורים אחרים.'},
 {id:'rd_he10_5',q:'מה מוצג בקטע כשאלה החשובה?',o:['מי ייהנה מהמשרות וכיצד יסייעו לנפגעים','האם הטכנולוגיה תיצור משרות חדשות בכלל','כיצד אפשר לעצור את התקדמות הטכנולוגיה','האם המכונות יחליפו את כל העובדים'],a:0,e:'המשפט האחרון מנגיד: לא "אם תיצור משרות" אלא "מי ייהנה וכיצד יסייעו".'}
 ]},
{id:'rd_en5',lang:'en',title:'The dance of the honeybee',
 text:'In the 1940s, the Austrian scientist Karl von Frisch proposed that honeybees communicate the location of food through a "waggle dance." A bee returning to the hive moves in a figure-eight pattern; the angle of the straight middle run relative to vertical indicates the direction of the food relative to the sun, while the duration of the waggle indicates distance. Many scientists were skeptical. Some argued that bees found food simply by following its smell, and that the dance was merely a sign of excitement. The debate was not settled until decades later, when researchers built a robotic bee that performed the dance without carrying any scent. Bees that watched the robot tended to fly in the direction it indicated, suggesting that the dance itself, and not odor, carried the information. Even so, researchers now believe that bees combine several sources of information, including scent, when deciding where to fly.',
 qs:[
 {id:'rd_en5_1',q:'What was the skeptics\' main objection to von Frisch\'s theory?',o:['Bees might find food by smell instead.','Bees cannot see the sun from inside the dark hive.','The dance was far too complex for bees to learn.','Von Frisch had never actually observed bees directly.'],a:0,e:'הספקנים טענו שהדבורים פשוט עוקבות אחרי הריח, והריקוד הוא רק סימן להתרגשות.'},
 {id:'rd_en5_2',q:'According to the passage, the duration of the waggle indicates',o:['how far away the food is','the direction of the food','the type of flower','the number of bees needed'],a:0,e:'the duration of the waggle indicates distance. הכיוון נקבע לפי הזווית.'},
 {id:'rd_en5_3',q:'Why was the robotic bee important?',o:['It danced without scent, isolating the dance.','It replaced the real bees inside the hive.','It proved that bees are unable to smell.','It collected food more efficiently than bees.'],a:0,e:'הרובוט בודד את הריקוד מהריח, וכך אפשר היה לבדוק את השפעת הריקוד לבדו.'},
 {id:'rd_en5_4',q:'The word "settled" in the passage most nearly means',o:['resolved','calmed','located','paid'],a:0,e:'debate was settled פירושו שהוויכוח הוכרע (resolved).'},
 {id:'rd_en5_5',q:'Which statement best reflects the view described at the end of the passage?',o:['The dance informs, but bees also use scent.','Smell is the only cue that bees really use.','The dance has no real function for the hive.','Robots communicate better than real bees do.'],a:0,e:'Even so... combine several sources: הריקוד חשוב, אך לא בלעדי.'}
 ]},
{id:'rd_en6',lang:'en',title:'Anchoring',
 text:'When people estimate a number, they are often influenced by figures that have nothing to do with the question. In a well-known experiment, participants were asked to write down the last two digits of an identification number and then to bid on items such as wine and chocolate. Those whose digits were high consistently offered more than those whose digits were low, even though they knew the digits were random. Psychologists call this tendency "anchoring": an initial number serves as a reference point, and later judgments are adjusted from it, but not enough. The effect appears even among experts. Real-estate agents shown different asking prices for the same house gave different estimates of its value, while insisting that the asking price had not affected them. Some researchers suggest that the best defense is to form one\'s own estimate before seeing any figure; others doubt that people can fully escape the effect, since they are usually unaware of it.',
 qs:[
 {id:'rd_en6_1',q:'What is the main purpose of the passage?',o:['To describe a bias in estimating numbers','To explain how the prices of wine are set','To argue that experts never make mistakes','To compare several different kinds of auctions'],a:0,e:'הקטע מתאר את הטיית העיגון ומביא דוגמאות לה.'},
 {id:'rd_en6_2',q:'Why was it significant that participants knew the digits were random?',o:['Even meaningless numbers influenced them.','It proves that the participants were dishonest.','It made the participants bid much lower.','It meant that the experiment had failed.'],a:0,e:'even though they knew: ההשפעה התקיימה למרות הידיעה שהמספר חסר משמעות.'},
 {id:'rd_en6_3',q:'The example of the real-estate agents is meant to show that',o:['even professionals are affected unknowingly','agents estimate prices better than other people','asking prices for houses are always accurate','houses are generally very hard to sell'],a:0,e:'הסוכנים הושפעו ובאותו זמן התעקשו שלא הושפעו.'},
 {id:'rd_en6_4',q:'According to the passage, why do some researchers doubt that people can avoid the effect?',o:['People are usually unaware of the influence.','The effect occurs only with very high numbers.','Most people simply refuse to make estimates.','Experts are completely immune to the effect.'],a:0,e:'since they are usually unaware of it: קשה להתגונן מפני השפעה שלא מודעים לה.'},
 {id:'rd_en6_5',q:'The phrase "but not enough" suggests that people',o:['adjust too little from the first number','ignore the initial number completely','overestimate every value they are given','never change their estimates at all'],a:0,e:'הם מתקנים את ההערכה מנקודת העוגן, אבל לא מספיק, ולכן נשארים קרובים אליה.'}
 ]},
{id:'rd_en7',lang:'en',title:'Teenagers and sleep',
 text:'For years, teenagers who stayed up late and struggled to wake up for school were assumed to be simply lazy or undisciplined. Research over the past few decades has offered a different explanation. During adolescence, the body\'s internal clock shifts, so that teenagers naturally begin to feel sleepy later in the evening than younger children or adults. Because school still starts early, many teenagers are chronically short of sleep, which can impair attention, memory and mood. Several school districts have therefore experimented with later start times. In a number of cases, students did not simply stay up later; they slept more, and some schools reported improved attendance. Critics point out practical obstacles, such as bus schedules and after-school activities, and note that results have varied from place to place. Still, the research has shifted the debate from questions of character to questions of biology.',
 qs:[
 {id:'rd_en7_1',q:'According to the passage, why do many teenagers go to sleep late?',o:['A shift in their internal clock','Laziness and a lack of discipline','Too much homework every evening','School days that start too early'],a:0,e:'המחקר מסביר שהשעון הפנימי משתנה בגיל ההתבגרות. העצלות היא ההסבר הישן שהקטע דוחה.'},

 {id:'rd_en7_4',q:'The word "chronically" most nearly means',o:['persistently','occasionally','slightly','suddenly'],a:0,e:'chronically פירושו באופן מתמשך וקבוע.'},

{id:'hi01',lvl:3,q:'חוקרים מצאו שבערים שבהן מספר בתי הקפה גבוה, גם שיעור הסטודנטים גבוה. מכאן הסיקו שפתיחת בתי קפה מושכת סטודנטים לעיר. איזו מהעובדות הבאות מחלישה ביותר את המסקנה?',o:['בתי קפה נפתחים היכן שכבר גרים סטודנטים רבים','סטודנטים רבים נוהגים לשתות קפה מדי יום','בחלק מהערים הגדולות יש מעט מאוד בתי קפה','מחירי הקפה בערים שבהן יש אוניברסיטה גבוהים'],a:0,e:'המסקנה מניחה שבתי הקפה הם הסיבה. אם הסטודנטים הם שמושכים את בתי הקפה, כיוון הסיבתיות הפוך, והמסקנה נחלשת. זו המלכודת הקלאסית: מתאם אינו סיבתיות.'},

{id:'hi03',lvl:3,q:'חוקרת רוצה לבדוק אם האזנה למוזיקה בזמן למידה פוגעת בזכירה. היא מחלקת משתתפים לשתי קבוצות: האחת לומדת עם מוזיקה בחדר רועש, והאחרת לומדת בלי מוזיקה בחדר שקט. מבקר טען שהניסוי פגום. מהו השינוי הנחוץ ביותר?',o:['להושיב את שתי הקבוצות בחדרים זהים','להגדיל רק את קבוצת המוזיקה','להשמיע מוזיקה גם לקבוצה השנייה','לבדוק זכירה רק אצל הקבוצה השקטה'],a:0,e:'בניסוי תקין משנים משתנה אחד בלבד. כאן גם המוזיקה וגם רעש החדר שונים, ולכן אי אפשר לדעת מה גרם להבדל.'},
{id:'hi04',lvl:3,q:'"מאחר שמספר המבקרים בספריות הציבוריות ירד, ברור שהציבור קורא פחות ספרים." על איזו הנחה נשענת הטענה?',o:['שרוב הקריאה נעשית בספריות הציבוריות','שספריות ציבוריות יקרות מדי לתחזוקה','שהציבור הרחב אינו אוהב לקרוא ספרים','שמספר הספריות בארץ גדל בשנים האחרונות'],a:0,e:'אם אנשים קונים ספרים או קוראים ספרים דיגיטליים, ירידה בביקורים אינה מעידה על פחות קריאה. הטענה מניחה בשקט שהספרייה היא ערוץ הקריאה העיקרי.'},

{id:'hi10',lvl:3,q:'עירייה העלתה את תעריף החניה במרכז העיר פי שניים. בחודש שלאחר מכן ירד מספר המכוניות שחנו במרכז ב־20%, אך הכנסות העירייה מחניה עלו. בהנחה שמשך החניה הממוצע לא השתנה, מה ניתן להסיק בוודאות?',o:['התוספת לכל מכונית פיצתה על הירידה','רוב הנהגים עברו לנסוע בתחבורה ציבורית','מספר המכוניות שחנו במרכז ירד בחצי','הכנסות העירייה מחניה עלו פי שניים'],a:0,e:'פי 2 במחיר כפול 0.8 במכוניות שווה פי 1.6 בהכנסות. ההכנסות עלו אבל לא הוכפלו. המעבר לתחבורה ציבורית אינו נובע מהנתונים.'},

{id:'an66',lvl:3,q:'זורם : מוזרם',o:['עולה : מועלה','מועלה : עולה','עולה : יורד','מעלה : עולה'],a:0,e:'היחס: הראשון מתאר פעולה שהנושא עושה מעצמו, והשני את אותה פעולה כשמישהו אחר גורם לה (סביל). המים זורמים או מוזרמים, והדבר עולה או מועלה.'},
{id:'an67',lvl:3,q:'פנס : להאיר',o:['מפתח : לפתוח','לפתוח : מפתח','דלת : מנעול','חושך : להאיר'],a:0,e:'היחס: כלי והפעולה שהוא נועד לה, בסדר כלי ואחריו פועל. שימו לב לסדר ההפוך באפשרות השנייה.'},
{id:'an68',lvl:3,q:'שקדן : התמדה',o:['ענו : צניעות','גאוותן : צניעות','צניעות : ענו','עשיר : ממון'],a:0,e:'היחס: אדם והתכונה שמאפיינת אותו. השקדן מתמיד והענו צנוע. לגאוותן חסרה צניעות, ולעשיר יש רכוש ולא תכונה.'},
{id:'an69',lvl:3,q:'משל : נמשל',o:['סמל : מסומל','מסומל : סמל','שיר : משורר','סיפור : קורא'],a:0,e:'היחס: ייצוג והדבר שהוא מייצג. המשל מייצג את הנמשל והסמל את המסומל.'},
{id:'an70',lvl:3,q:'קבצן : נדבה',o:['שואל : תשובה','נדבה : קבצן','נדיב : מתנה','עני : כסף'],a:0,e:'היחס: מי שמבקש והדבר שהוא מבקש לקבל. הקבצן מבקש נדבה והשואל מבקש תשובה. הנדיב נותן ולא מבקש.'},
{id:'an71',lvl:3,q:'מחרשה : תלם',o:['עט : קו','קו : עט','מכחול : צבע','מחרשה : שדה'],a:0,e:'היחס: כלי והסימן שהוא משאיר. המחרשה חורצת תלם והעט משאיר קו. צבע הוא חומר, לא סימן.'},
{id:'an72',lvl:3,q:'אבל : קינה',o:['שמחה : מחול','קינה : אבל','כעס : שקט','פחד : אומץ'],a:0,e:'היחס: רגש והביטוי הטקסי או האמנותי שלו. הקינה מבטאת אבל, והמחול מבטא שמחה.'},
{id:'an73',lvl:3,q:'מתפרה : בגדים',o:['מאפייה : לחם','לחם : מאפייה','חנות : קונים','מוזיאון : תמונות'],a:0,e:'היחס: מקום ייצור והמוצר שמיוצר בו. במוזיאון מציגים ולא מייצרים.'},
{id:'an74',lvl:3,q:'ענף : עץ',o:['יובל : נהר','נהר : יובל','גשר : נהר','ים : נהר'],a:0,e:'היחס: שלוחה צדדית של גוף ראשי. הענף מתפצל מהעץ, והיובל מתחבר לנהר כשלוחה שלו.'},
{id:'an75',lvl:3,q:'מתווך : צדדים',o:['גשר : גדות','גדות : גשר','שופט : נאשם','מורה : כיתה'],a:0,e:'היחס: דבר שמחבר בין שני צדדים. המתווך מקשר בין הצדדים והגשר בין הגדות.'}
);

HSC.push(
{id:'hs47',lvl:3,q:'אילו _____ החוקרים את הממצאים בזמן, _____ ניתן היה למנוע את הנזק. אולם הם _____ בפרסומם, והנזק כבר נגרם.',o:['פרסמו / ייתכן ש / התמהמהו','פרסמו / ודאי שלא / מיהרו','הסתירו / ייתכן ש / מיהרו','הסתירו / ודאי שלא / התמהמהו'],a:0,e:'"אילו" מציג תנאי שלא התקיים: הם לא פרסמו בזמן, כלומר התמהמהו. לכן אילו פרסמו, ייתכן שהנזק היה נמנע. בודקים כל חלל: אפשרות שמתאימה לחלל אחד בלבד אינה נכונה.'},
{id:'hs48',lvl:3,q:'_____ שהניסוי נערך בתנאים מבוקרים, אין בו כדי להוכיח את התאוריה, _____ מספר המשתתפים בו היה קטן מאוד, _____ לא נבדקה בו קבוצת ביקורת.',o:['אף / שכן / ויתרה מזאת','משום / אולם / ולכן','אף / ולכן / אך','משום / שכן / ולכן'],a:0,e:'"אף ש" מציג ויתור (התנאים מבוקרים), "שכן" מנמק מדוע אין הוכחה, ו"ויתרה מזאת" מוסיף נימוק נוסף באותו כיוון.'},
{id:'hs49',lvl:3,q:'ההחלטה לסגור את המפעל לא הייתה _____: היא _____ אחרי שנים של הפסדים, ו_____ שהיא כאובה, רוב העובדים הבינו שלא הייתה ברירה.',o:['פזיזה / התקבלה / אף','מתוכננת / התקבלה / משום','פזיזה / נדחתה / משום','מחושבת / נדחתה / אף'],a:0,e:'ההחלטה התקבלה אחרי שנים, ולכן לא הייתה פזיזה. "אף שהיא כאובה... הבינו" הוא ויתור.'},
{id:'hs50',lvl:3,q:'בניגוד לסברה _____, המחקר מצא שילדים שגדלו עם בעלי חיים _____ פחות לאלרגיות, ולא _____.',o:['הרווחת / נוטים / יותר','המוכחת / נוטים / פחות','הרווחת / נוטים / פחות','הנדירה / נוטים / יותר'],a:0,e:'"בניגוד לסברה הרווחת" מציג ממצא מפתיע: פחות אלרגיות ולא יותר. "ולא פחות" חוזר על אותו כיוון ואינו הגיוני.'},
{id:'hs51',lvl:3,q:'הוא לא היה _____ לביקורת, _____ דווקא חיפש אותה, משום שהאמין שרק מי ש_____ בטעויותיו יכול להשתפר.',o:['אטום / אלא / מכיר','פתוח / אלא / מתעלם','אטום / ולכן / מתעלם','פתוח / ולכן / מכיר'],a:0,e:'"לא X אלא Y": לא היה אטום לביקורת, אלא חיפש אותה. ההיגיון מחייב "מכיר בטעויותיו".'},
{id:'hs52',lvl:3,q:'_____ שהראיות נגד הנאשם היו נסיבתיות בלבד, השופטים _____ להרשיעו, ו_____ אותו מחמת הספק.',o:['מאחר / היססו / זיכו','אף / מיהרו / זיכו','מאחר / מיהרו / הרשיעו','אף / היססו / הרשיעו'],a:0,e:'"מחמת הספק" מופיע רק עם זיכוי. ראיות נסיבתיות הן סיבה להיסוס, ולכן "מאחר ש".'},
{id:'hs53',lvl:3,q:'גם _____ התוכנית תצליח, היא לא תפתור את הבעיה מן _____, אלא רק _____ את תסמיניה.',o:['אם / השורש / תמתן','כאשר / העבר / תחמיר','אם / השורש / תעמיק','אילו / הצד / תבטל'],a:0,e:'"מן השורש" הוא ביטוי לפתרון יסודי. "אלא רק" מצביע על השפעה מוגבלת וחיובית: מיתון התסמינים.'},
{id:'hs54',lvl:3,q:'הספר זכה לשבחים _____, אך דווקא _____ זו עוררה את חשדם של כמה מבקרים, שתהו אם היא אינה נובעת מ_____ ולא מאיכות.',o:['גורפים / אחידות / יחסי ציבור','מעטים / ביקורת / יחסי ציבור','גורפים / ביקורת / איכות','מסויגים / אחידות / כישרון'],a:0,e:'השבחים היו גורפים, ולכן "אחידות זו" מתייחסת אליהם. החשד הוא שהשבחים נובעים מיחסי ציבור, בניגוד לאיכות.'},
{id:'hs55',lvl:3,q:'מאחר שהמשאבים _____, הוועדה נאלצה _____ בין הפרויקטים ו_____ רק את אלה שתועלתם מוכחת.',o:['מוגבלים / לתעדף / לממן','שופעים / לתעדף / לממן','מוגבלים / לאחד / לבטל','שופעים / להפריד / לבטל'],a:0,e:'משאבים מוגבלים מחייבים לתעדף, ולכן מממנים רק את הפרויקטים המוכחים.'},
{id:'hs56',lvl:3,q:'לא זו בלבד שהטענה _____, _____ היא אף סותרת את הנתונים שהוצגו קודם לכן.',o:['אינה מבוססת / אלא','מבוססת / אלא','אינה מבוססת / ולכן','מבוססת / ולכן'],a:0,e:'המבנה "לא זו בלבד ש... אלא... אף" מוסיף טענה חמורה יותר באותו כיוון: הטענה אינה מבוססת, ויותר מזה סותרת את הנתונים.'}
);

LG.push(
{id:'lg33',lvl:3,q:'חמישה אנשים יושבים בשורה במקומות 1 עד 5 משמאל לימין: אבי, בתיה, גלעד, דנה והלל. בתיה יושבת בדיוק באמצע. אבי יושב משמאל לגלעד (לאו דווקא צמוד). דנה אינה יושבת ליד בתיה. הלל יושב באחד הקצוות. איזו מהטענות הבאות אינה יכולה להיות נכונה?',o:['אבי יושב בקצה השמאלי','גלעד יושב ליד בתיה','דנה יושבת באחד הקצוות','הלל יושב במקום 5'],a:0,e:'בתיה במקום 3, ודנה אינה במקומות 2 ו־4, ולכן היא בקצה. הלל בקצה השני. נשארו מקומות 2 ו־4 לאבי ולגלעד, ואבי משמאל, ולכן אבי במקום 2. אבי לעולם אינו בקצה.'},
{id:'lg34',lvl:3,q:'קוד בן ארבע ספרות מורכב מהספרות 1, 2, 3 ו־4, כל אחת פעם אחת. הספרה 1 אינה ראשונה. הספרות 2 ו־3 צמודות זו לזו. הספרה האחרונה זוגית. כמה קודים אפשריים?',o:['3','2','4','6'],a:0,e:'אם האחרונה 4: מסדרים 1, 2, 3 כך ש־1 אינה ראשונה ו־2, 3 צמודות: 2314 ו־3214. אם האחרונה 2: ה־3 חייבת להיות במקום השלישי, ו־1 אינה ראשונה: 4132. סך הכול 3.'},
{id:'lg35',lvl:3,q:'באחת משלוש קופסאות יש זהב. על קופסה א כתוב: "הזהב כאן". על קופסה ב כתוב: "הזהב אינו כאן". על קופסה ג כתוב: "הזהב אינו בקופסה א". רק אחת מהכתובות נכונה. היכן הזהב?',o:['בקופסה ב','בקופסה א','בקופסה ג','אי אפשר לדעת'],a:0,e:'אם בא: הכתובות על א ועל ב נכונות. אם בג: הכתובות על ב ועל ג נכונות. רק אם בב נכונה כתובת אחת בלבד, זו שעל ג.'},
{id:'lg36',lvl:3,q:'משה עובד בכל שבוע בדיוק שלושה ימים מתוך הימים ראשון עד חמישי, ולעולם אינו עובד ביומיים רצופים. באילו ימים הוא עובד?',o:['ראשון, שלישי וחמישי','ראשון, שני ורביעי','שני, רביעי וחמישי','אי אפשר לקבוע'],a:0,e:'בחמישה ימים, שלושה ימים שאינם רצופים מתאפשרים רק בדילוג מדויק: ראשון, שלישי וחמישי.'},
{id:'lg37',lvl:3,q:'הטיול יתקיים אלא אם כן יירד גשם. אם הטיול יתקיים, יוזמן אוטובוס. לא הוזמן אוטובוס. מה נובע בהכרח?',o:['ירד גשם','לא ירד גשם','הטיול התקיים','אי אפשר לדעת אם ירד גשם'],a:0,e:'"יתקיים אלא אם כן יירד גשם" פירושו: אם לא יירד גשם, הטיול יתקיים. לא הוזמן אוטובוס, ולכן הטיול לא התקיים, ולכן ירד גשם.'},
{id:'lg38',lvl:3,q:'בכיתה 30 תלמידים. 12 משחקים כדורגל, 10 משחקים כדורסל, ו־5 משחקים את שניהם. כמה תלמידים אינם משחקים אף אחד מהשניים?',o:['13','8','3','17'],a:0,e:'משחקים לפחות ענף אחד: 12 + 10 − 5 = 17. לכן 30 − 17 = 13 אינם משחקים.'}
);

SC.push(
{id:'sc65',lvl:3,q:'Although the evidence for the theory is _____, many scientists continue to regard it as _____, citing its elegance and explanatory power.',o:['scant / plausible','overwhelming / plausible','scant / implausible','overwhelming / doubtful'],a:0,e:'Although מסמן ניגוד: הראיות מעטות (scant), ובכל זאת רואים בה סבירה. citing its elegance תומך ב־plausible.'},
{id:'sc66',lvl:3,q:'The author\'s style is deliberately _____; she strips her sentences of every unnecessary word.',o:['terse','verbose','ornate','convoluted'],a:0,e:'הסרת כל מילה מיותרת מתארת סגנון תמציתי וחסכני (terse).'},
{id:'sc67',lvl:3,q:'Far from _____ the dispute, the mediator\'s clumsy remarks only _____ it.',o:['resolving / inflamed','inflaming / resolved','resolving / settled','ignoring / ended'],a:0,e:'Far from X, only Y מציג הפך: במקום לפתור, ההערות הגרועות ליבו את הסכסוך.'},
{id:'sc68',lvl:3,q:'The committee\'s report was _____ about the causes of the failure, offering no clear explanation and blaming no one.',o:['equivocal','unequivocal','candid','scathing'],a:0,e:'בלי הסבר ברור ובלי האשמה: הדוח מתחמק ודו־משמעי (equivocal).'},
{id:'sc69',lvl:3,q:'Because the new drug\'s benefits were only _____, regulators were _____ to approve it, given its serious side effects.',o:['marginal / reluctant','substantial / reluctant','marginal / eager','dramatic / eager'],a:0,e:'only מרמז על תועלת קטנה. תועלת קטנה עם תופעות לוואי חמורות מובילה להיסוס.'},
{id:'sc70',lvl:3,q:'The once-_____ industry is now in decline, its factories idle and its workers _____.',o:['thriving / unemployed','struggling / employed','thriving / employed','obsolete / promoted'],a:0,e:'once- מנגיד לעבר: התעשייה שגשגה פעם, ועכשיו המפעלים מושבתים והעובדים מובטלים.'},
{id:'sc71',lvl:3,q:'Her argument, though _____ at first glance, collapses under closer _____.',o:['persuasive / scrutiny','weak / scrutiny','persuasive / praise','obscure / neglect'],a:0,e:'though מסמן ניגוד: משכנע במבט ראשון, אך קורס כשבוחנים אותו מקרוב.'},
{id:'sc72',lvl:3,q:'Rather than being _____ by the setback, the team grew more _____ to succeed.',o:['discouraged / determined','encouraged / determined','discouraged / reluctant','delighted / hesitant'],a:0,e:'Rather than: במקום להתייאש מהכישלון, הצוות נעשה נחוש יותר.'},
{id:'sc73',lvl:3,q:'The historian warned that the diary, written decades after the events it describes, should be treated as a _____ source.',o:['questionable','definitive','contemporary','primary'],a:0,e:'יומן שנכתב עשרות שנים אחרי האירועים אינו בן זמנם, ולכן הוא מקור מפוקפק (questionable).'},
{id:'sc74',lvl:3,q:'Unlike his _____ predecessor, who rarely left his office, the new director is constantly visiting the factory floor.',o:['reclusive','gregarious','energetic','visible'],a:0,e:'מי שכמעט לא יצא ממשרדו הוא מסתגר (reclusive). Unlike מנגיד אותו לממשיך הפעיל.'},
{id:'sc75',lvl:3,q:'The negotiators\' optimism proved _____: within a week, the ceasefire had collapsed.',o:['premature','justified','contagious','prudent'],a:0,e:'הפסקת האש קרסה תוך שבוע, ולכן האופטימיות הייתה מוקדמת מדי (premature).'},
{id:'sc76',lvl:3,q:'The evidence was so _____ that even the defendant\'s own lawyer conceded that the case was _____.',o:['damning / hopeless','flimsy / hopeless','damning / promising','flimsy / strong'],a:0,e:'אם אפילו עורך הדין של הנאשם הודה, הראיות מפלילות (damning) והמקרה חסר סיכוי מבחינתו.'}
);

RS.push(
{id:'rs33',lvl:3,q:'Had the bridge been inspected regularly, the collapse might have been prevented.',o:['The bridge was not inspected regularly, which may have led to its collapse.','The bridge collapsed even though it had been inspected regularly for years.','The bridge was inspected regularly, and so the collapse was prevented in time.','The collapse of the bridge led to regular inspections of all the other bridges.'],a:0,e:'Had + past participle הוא תנאי שלא התקיים בעבר: לא בדקו את הגשר, והוא קרס.'},
{id:'rs34',lvl:3,q:'The rise in prices was caused not by higher demand but by a shortage of supply.',o:['Prices rose because supply was short, not because demand grew.','Higher demand and limited supply together caused prices to rise.','Prices rose, and this in turn reduced both supply and demand.','A shortage of supply was itself caused by the rise in prices.'],a:0,e:'not X but Y: הסיבה היא המחסור בהיצע בלבד. האפשרות האחרונה הופכת את כיוון הסיבתיות, וזו מלכודת נפוצה.'},
{id:'rs35',lvl:3,q:'Scarcely had the minister finished speaking when protesters began to shout.',o:['The protesters began shouting as soon as the minister finished.','The protesters started shouting even before the minister began.','The minister spoke for a long time before the protest began.','The minister stopped speaking because of the protesters\' shouting.'],a:0,e:'Scarcely had... when פירושו "אך סיים, ומיד".'},
{id:'rs36',lvl:3,q:'The study, which was funded by the industry it examined, has been criticized for its lack of independence.',o:['The study was criticized because the industry it examined paid for it.','The study sharply criticized the industry that had paid for it.','The industry refused to fund any independent study of its practices.','The study proved that the industry is independent of outside funding.'],a:0,e:'הביקורת היא על המחקר, ולא של המחקר. הסיבה: מימון מהתעשייה שנחקרה.'},

READ.push(
{id:'rd_he11',lvl:3,lang:'he',title:'מפות והיטלים',
 text:'מפה נתפסת בדרך כלל כתמונה נאמנה של העולם, אך כל מפה היא בהכרח פשרה. פני כדור הארץ מעוגלים ואילו המפה שטוחה, ואי אפשר להעביר משטח כדורי אל דף שטוח בלי לעוות דבר מה: את השטחים, את הצורות, את המרחקים או את הכיוונים. משום כך כל שיטת שרטוט, המכונה "היטל", בוחרת מה לשמר ומה להקריב.\n\nההיטל המוכר ביותר פותח במאה ה־16 לצורכי ניווט ימי. יתרונו הגדול הוא שקו ישר במפה מייצג כיוון קבוע במצפן, וכך יכול נווט לסמן מסלול בסרגל ולשמור עליו לאורך כל ההפלגה. אולם המחיר הוא עיוות חמור של שטחים ככל שמתרחקים מקו המשווה: גרינלנד, למשל, נראית במפה זו כמעט בגודלה של אפריקה, אף שאפריקה גדולה ממנה פי ארבעה־עשר בקירוב.\n\nעיוות זה לא הטריד במיוחד כל עוד שימשה המפה את יורדי הים. הבעיה החלה כשהמפה עברה לכיתות הלימוד ולספרי האטלס, ונעשתה לדימוי המוכר של העולם בעיני מיליונים. מבקרים טענו שהמפה, המגדילה את האזורים הקרובים לקטבים ומקטינה את האזורים הקרובים למשווה, מעניקה חשיבות מופרזת לאזורים מסוימים על חשבון אחרים. בעקבות זאת הוצעו היטלים חלופיים השומרים על יחסי השטחים, אך גם הם אינם חפים מעיוותים: הם מותחים את צורות היבשות ומשבשים את הכיוונים.\n\nיש הרואים בוויכוח עדות לכך שמפות אינן כלי ניטרלי. אחרים משיבים שהוויכוח מלמד דבר אחר: לא על כוונה סמויה של יוצרי המפות, אלא על שימוש בכלי שלא למטרה שלשמה נוצר. לדבריהם, אין "מפה נכונה" אחת, ויש לבחור בכל פעם את ההיטל המתאים לשאלה שמבקשים לענות עליה.',
 qs:[
 {id:'rd_he11_1',q:'מדוע, לפי הפסקה הראשונה, כל מפה היא "פשרה"?',o:['כי אי אפשר לשטח כדור בלי עיוות','כי שרטוט מפות מדויקות יקר מאוד','כי יוצרי המפות מעדיפים אזורים מסוימים','כי אין די מידע על פני כדור הארץ'],a:0,e:'הנימוק מופיע במפורש: מעבר ממשטח מעוגל לשטוח מחייב עיוות כלשהו.'},
 {id:'rd_he11_2',q:'מהו היתרון המרכזי של ההיטל שפותח במאה ה־16?',o:['קו ישר במפה מייצג כיוון קבוע','הוא שומר על יחסי השטחים בין היבשות','הוא מציג את צורות היבשות בלי עיוות','הוא מתאים במיוחד ללימוד בכיתות'],a:0,e:'היתרון קשור לניווט: אפשר לסמן מסלול בסרגל ולשמור על כיוון קבוע.'},
 {id:'rd_he11_3',q:'איזו מהטענות הבאות אינה נכונה לפי הקטע?',o:['ההיטלים החלופיים שומרים גם על הכיוונים','גרינלנד קטנה בהרבה מאפריקה','ההיטל המוכר מעוות שטחים הרחק מהמשווה','העיוות לא הטריד במיוחד את יורדי הים'],a:0,e:'לפי הקטע ההיטלים החלופיים "משבשים את הכיוונים". בשאלות "אינה נכונה" מחפשים את הפרט שסותר את הטקסט.'},
 {id:'rd_he11_4',q:'לפי הפסקה השלישית, מתי החל העיוות להיתפס כבעיה?',o:['כשהמפה נעשתה לדימוי הנפוץ של העולם','כשהתגלה שגרינלנד גדולה מאפריקה','כשנווטים החלו לטעות בדרכם בים','כשפותח ההיטל הראשון לצורכי ניווט'],a:0,e:'"הבעיה החלה כשהמפה עברה לכיתות הלימוד ולספרי האטלס".'},
 {id:'rd_he11_5',q:'מהו ההבדל בין שתי העמדות המוצגות בפסקה האחרונה?',o:['תפיסת עולם מול שימוש בכלי שלא למטרתו','תמיכה בהיטל הימי מול תמיכה בהיטל החלופי','שתיהן טוענות שיש מפה אחת נכונה','מפות מדויקות מול מפות שאינן שימושיות'],a:0,e:'"אינן כלי ניטרלי" מול "שימוש בכלי שלא למטרה שלשמה נוצר".'},
